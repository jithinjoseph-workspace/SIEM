  rationale: Isolation protects credentials and kernel code integrity even from code running with administrator rights.
  remediation: 'Group Policy: Computer Configuration\Policies\Administrative Templates\System\Device Guard\Turn On Virtualization Based Security = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\EnableVirtualizationBasedSecurity (REG_DWORD) = 1.'
