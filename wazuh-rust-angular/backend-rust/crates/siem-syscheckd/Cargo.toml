[package]
name = "siem-syscheckd"
version = "0.1.0"
edition = "2021"
description = "Wazuh File Integrity Monitoring (FIM) daemon (wazuh-syscheckd) for integrity scans, real-time watcher, whodata, diff analysis, and registry tracking"

[dependencies]
siem-cjson = { path = "../siem-cjson" }
siem-config = { path = "../siem-config" }
siem-regex = { path = "../siem-regex" }
siem-xml = { path = "../siem-xml" }
siem-fileop = { path = "../siem-fileop" }
siem-log = { path = "../siem-log" }
siem-dbsync = { path = "../siem-dbsync" }
siem-njson = { path = "../siem-njson" }
parking_lot = "0.12"
libc = "0.2"
siem-core = { path = "../siem-core" }
siem-wdb = { path = "../siem-wdb" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = { version = "0.36", features = ["serialize"] }
tokio = { version = "1.40", features = ["full"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
libz-sys = { version = "1.1", features = ["static"] }
tracing = "0.1"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
siem-sysinfo = { path = "../siem-sysinfo" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_Shell", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Memory", "Win32_Globalization", "Win32_System_EventLog", "Win32_Security_Authentication_Identity", "Win32_System_SystemInformation", "Win32_System_Environment"] }
siem-ipc = { path = "../siem-ipc" }
siem-execd = { path = "../siem-execd" }
siem-sca = { path = "../siem-sca" }
