[package]
name = "siem-ipc"
version = "0.1.0"
edition = "2021"
description = "Wazuh local IPC: unix-socket queues, secure framing, SendMSG format and the wazuh-db client"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
thiserror = "1"
tracing = "0.1"
serde_json = "1.0"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
