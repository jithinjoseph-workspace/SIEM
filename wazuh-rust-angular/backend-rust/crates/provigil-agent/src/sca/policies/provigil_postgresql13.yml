- id: 72021
  title: 'log_line_prefix: ''%m [%p]: [%l-1] db=%d,user=%u,app=%a,client=%h '''
  description: 'log_line_prefix adds fields such as time, process, database, user, application and client to every log line. The check expects the prefix ''%m [%p]: [%l-1] db=%d,user=%u,app=%a,client=%h''.'
  rationale: Without user, database and client on each line, log entries cannot be tied to who did what.
  remediation: 'ALTER SYSTEM SET log_line_prefix = ''%m [%p]: [%l-1] db=%d,user=%u,app=%a,client=%h ''; SELECT pg_reload_conf();'
  compliance:
