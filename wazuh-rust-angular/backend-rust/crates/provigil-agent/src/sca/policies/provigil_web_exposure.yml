- id: 78009
  title: 'WordPress 4.4.2: not installed'
  description: WordPress records its release in wp-includes/version.php. The check fails when a version.php under /var/www declares wp_version 4.4.2.
  rationale: Old releases of web applications have published, actively exploited vulnerabilities.
  remediation: Update WordPress to the current release (Dashboard > Updates or wp core update) and keep it patched.
  compliance:
    nist_800_53:
    - SI-2
    - RA-5
    pci_dss:
    - 6.3.3
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.8
    soc_2:
    - CC3.2
    - CC7.1
    - CC7.2
    gdpr_IV:
    - IV_32.2
    - IV_35.7.d
  condition: none
  rules:
  - d:$web_dirs -> ^version.php$ -> r:^\.wp_version && r:4.4.2
- id: 78010
  title: 'Joomla 3.4.8: not installed'
  description: Joomla records its release in a version.php file. The check fails when a version.php under /var/www declares RELEASE 3.4.8.
  rationale: Old releases of web applications have published, actively exploited vulnerabilities.
  remediation: Update Joomla to a supported release and keep it patched.
