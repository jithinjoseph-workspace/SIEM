events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone to protect the SIEM API from log flooding / DDoS
    limit_req_zone $binary_remote_addr zone=siem_api_limit:10m rate=1000r/s;

    # Upstream pool of Rust SIEM Manager nodes (Load Balancer)
    upstream siem_backend {
        least_conn; # Send to instance with lowest active connections
        server siem-api:8088 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Client body size limit for large log batches (up to 50MB)
        client_max_body_size 50M;

        # 1. Angular SOC Frontend Dashboard
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. REST API Pipeline for Agents & Dashboard
        location /api/ {
            limit_req zone=siem_api_limit burst=200 nodelay;
            proxy_pass http://siem_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Real-Time WebSocket Alerts Broadcast (/ws/alerts)
        location /ws/ {
            proxy_pass http://siem_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 4. Agent Binary Downloads
        location /downloads/ {
            proxy_pass http://siem_backend;
            proxy_set_header Host $host;
        }
    }
}
