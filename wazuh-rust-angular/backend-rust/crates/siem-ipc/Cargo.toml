[package]
name = "siem-ipc"
version = "0.1.0"
edition = "2021"
description = "Wazuh local IPC: unix-socket queues, secure framing, SendMSG format and the wazuh-db client"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
thiserror = "1"
tracing = "0.1"
serde_json = "1.0"
async-trait = "0.1"
siem-log = { path = "../siem-log" }
siem-regex = { path = "../siem-regex" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
tempfile = "3"
