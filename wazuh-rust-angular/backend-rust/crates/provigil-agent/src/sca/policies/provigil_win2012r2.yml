- id: 63018
  title: 'Domain controller: LDAP server channel binding token requirements: Always'
  description: Controls whether a domain controller requires LDAP clients connecting over TLS to supply a channel binding token. Value 2 requires the token from every client.
  rationale: Channel binding ties the LDAP authentication to the TLS session and blocks relaying of captured credentials to LDAPS.
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain controller: LDAP server channel binding token requirements = Always. Registry: HKLM\SYSTEM\CurrentControlSet\Services\NTDS\Parameters\LdapEnforceChannelBinding (REG_DWORD) = 2.'
