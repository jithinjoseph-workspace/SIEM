    - CC7.1
    - CC7.2
    gdpr_IV:
    - IV_35.7.d
  condition: none
  rules:
  - d:$web_dirs -> .php$ -> r:eval\(base64_decode\(\S_POST
- id: 78014
  title: '.htaccess referrer redirect to search engines: none'
  description: Injected .htaccess rules can redirect visitors who come from search results to spam or malware sites. The check fails when an .htaccess file under /var/www has a RewriteCond on HTTP_REFERER(S) matching google.
  rationale: Search-referrer redirects are a known site compromise used for SEO spam and drive-by downloads.
  remediation: Find the files (grep -rl under /var/www), treat the site as compromised, remove the injected code and restore from a trusted source; then patch the entry point.
  compliance:
    nist_800_53:
    - SI-3
    - SI-4
    - SI-7
    pci_dss:
    - 5.2.1
    - 11.5.2
    hipaa:
