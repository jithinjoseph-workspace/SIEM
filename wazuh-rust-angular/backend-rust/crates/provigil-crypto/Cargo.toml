[package]
name = "provigil-crypto"
version = "0.1.0"
edition = "2021"
description = "Agent keys, key tables, message envelope and counters"

[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
blowfish = "0.9"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = { version = "0.12", features = ["std"] }
hex = "0.4"
rand = "0.8"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
siem-regex = { package = "provigil-regex", path = "../provigil-regex" }

[dev-dependencies]
serde_json = "1"
