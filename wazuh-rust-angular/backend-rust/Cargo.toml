[workspace]
resolver = "2"
# old code is kept for comparison only; never a member
exclude = ["old-code"]
members = [
    "crates/siem-core",
    "crates/provigil-posture",
    "crates/siem-engine",
    "crates/siem-agent-linux",
    "crates/siem-api",
    "crates/provigil-common",
    "crates/provigil-agent",
    "crates/provigil-collect",
    "crates/provigil-proto",
    "crates/provigil-loadtest",
    "crates/provigil-deploy",
    "crates/provigil-agent-server",
    "crates/provigil-gateway",
    "crates/auth-service",
    "crates/siem-sqlite",
    "crates/siem-cdb",
    "crates/siem-execd",
    "crates/siem-agentlessd",
    "crates/siem-ai",
    "crates/siem-triage",
    "crates/siem-suppression",
    "crates/siem-retro",
    "crates/siem-predict",
    "crates/siem-analyst-insight",
    "crates/siem-org-memory",
    "crates/siem-swarm",
    "crates/siem-decision",
    "crates/siem-parser-gen",
    "crates/provigil-regex",
    "crates/siem-xml",
    "crates/siem-config",
    "crates/siem-ipc",
    "crates/siem-cjson",
    "crates/siem-analysisd",
    "crates/siem-log",
    "crates/siem-daemon",
    "crates/siem-active-response",
    "crates/siem-risk-fabric",
    "crates/siem-redswarm",
    "crates/siem-intent-engine",
    "crates/siem-deception",
    "crates/provigil-crypto",
    "crates/provigil-fileop",
    "crates/provigil-vulnscan",
    "crates/provigil-agentdb",
    "crates/provigil-ipc",
    "crates/provigil-daemon",
    "crates/provigil-modulesd",
]

# strip: windows-gnu links the standard library's debug symbols into every exe.
# thin LTO: the linker alone keeps the YARA engine in every response program (130 MB -> 28 MB for the
# agent package, about 25% longer clean build).
[profile.release]
strip = "symbols"
lto = "thin"
