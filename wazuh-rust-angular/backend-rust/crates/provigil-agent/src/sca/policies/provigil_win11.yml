  description: When enabled, Windows halts if it cannot write security audit events, for example when the Security log is full.
  rationale: Leaving it disabled avoids an easy denial of service where filling the log takes the system down.
  remediation: 'Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\Security Options\Audit: Shut down system immediately if unable to log security audits = Disabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\CrashOnAuditFail (REG_DWORD) = 0.'
