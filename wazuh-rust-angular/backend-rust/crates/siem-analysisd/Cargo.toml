[package]
name = "siem-analysisd"
version = "0.1.0"
edition = "2021"
description = "Port of wazuh-analysisd (src/analysisd): pre-decoding, XML decoders, rules engine, CDB lists, FTS, accumulator, JSON alerts and logtest"

[dependencies]
siem-regex = { path = "../siem-regex" }
siem-xml = { path = "../siem-xml" }
siem-cjson = { path = "../siem-cjson" }
siem-config = { path = "../siem-config" }
siem-ipc = { path = "../siem-ipc" }
siem-log = { path = "../siem-log" }
siem-daemon = { path = "../siem-daemon" }
tokio = { version = "1.40", features = ["full"] }
chrono = "0.4"
sha1 = "0.10"
regex = "1.10"
