[package]
name = "siem-engine"
version = "0.1.0"
edition = "2021"
description = "High-performance rule evaluation and log decoding engine written in Rust"

[dependencies]
siem-core = { path = "../siem-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.10", features = ["v4"] }
quick-xml = { version = "0.36", features = ["serialize"] }

[[bin]]
name = "wazuh-logtest"
path = "src/bin/wazuh_logtest.rs"
