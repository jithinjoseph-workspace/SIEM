[package]
name = "siem-retro"
version = "0.1.0"
edition = "2021"
description = "Retrospective scans for the SIEM: past events re-run through the live Wazuh ruleset (analysisd logtest), or a keyword search"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
