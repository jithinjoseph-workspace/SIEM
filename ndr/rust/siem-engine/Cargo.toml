[package]
name = "siem-engine"
version = "0.1.0"
edition = "2021"
description = "Provigil AI XDR — SIEM engine (log ingest, OCSF normalization, correlation, AI investigation)"

[dependencies]
provigil-common = { path = "../provigil-common", features = ["kafka"] }

axum            = { version = "0.7", features = ["macros"] }
tokio           = { version = "1",   features = ["full"] }
tower-http      = { version = "0.5", features = ["cors", "decompression-gzip"] }
serde           = { version = "1",   features = ["derive"] }
serde_json      = "1"
chrono          = { version = "0.4", features = ["serde"] }
uuid            = { version = "1",   features = ["v4"] }
redis           = { version = "0.23", features = ["tokio-comp", "connection-manager"] }
rdkafka         = { version = "0.36", features = ["cmake-build"] }
clickhouse      = "0.11"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow          = "1"
thiserror       = "1"
hmac            = "0.12"
sha2            = "0.10"
hex             = "0.4"
base64          = "0.21"
reqwest         = { version = "0.11", features = ["json"] }
quick-xml       = { version = "0.36", features = ["serialize"] }
futures         = "0.3"
jsonwebtoken    = "9"
