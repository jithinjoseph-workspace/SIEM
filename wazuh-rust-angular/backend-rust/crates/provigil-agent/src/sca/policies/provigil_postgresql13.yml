- id: 72020
  title: 'log_hostname: off'
  description: log_hostname makes the server resolve and log client host names instead of only addresses. The check expects SHOW log_hostname to return off.
  rationale: Reverse DNS lookups slow every connection and DNS answers can be spoofed; IP addresses are more reliable.
  remediation: ALTER SYSTEM SET log_hostname = 'off'; SELECT pg_reload_conf();
