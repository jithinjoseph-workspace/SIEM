# Sized for thousands of sensors, each holding a TLS keep-alive connection
# (measured on the old 1 worker / 1024 connections: of 3000 simultaneous
# connections only 952 were served and 2048 were reset).
worker_processes     auto;
worker_rlimit_nofile 200000;

events {
    worker_connections 16384;
    multi_accept       on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    # A single page load fires ~15-20 API calls at once (sensor-keys, stats,
    # severity, stats/timeline, aria/status, auth/me, auth/users, etc — all
    # share this one zone per client IP). At the old 120r/m (2r/s) refill,
    # two page loads/reloads within ~10-15s exhausted the burst and threw
    # real requests into 429s. Raised so normal reload behavior has headroom.
    limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=300r/m;

    # Sensor traffic (/api/ingest, /api/sensor/*, /api/pcap/*) has NO rate limit at
    # nginx: with thousands of sensors a limit here only throttled healthy ones and,
    # because it was keyed by the sensor-supplied key, could not stop a hostile client
    # anyway. Keys are validated in the engine. Only the UI's /api uses api_limit.

    limit_req_status 429;

    # The UI ships ~4.3 MB of JavaScript (Three.js, d3, charts). Nothing was
    # compressed, so every first load / lazy page chunk sent the full size
    # (measured live: scripts-*.js 3,092,581 bytes, main-*.js 515,261, with
    # and without Accept-Encoding) through the tunnel - roughly 4-5x more
    # bytes than gzip needs, which is what made each page feel hung on a
    # slow link. Static types only: API JSON is deliberately left out
    # (responses carrying tokens/session data + compression = BREACH risk).
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        application/javascript text/javascript text/css image/svg+xml application/wasm;

    upstream clickhouse_pool {
        least_conn;
        server clickhouse1:8123 max_fails=2 fail_timeout=10s;
        server clickhouse2:8123 max_fails=2 fail_timeout=10s backup;
    }

    server {
        listen 8123;
        location / {
            proxy_pass         http://clickhouse_pool;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout    60s;
            proxy_next_upstream   error timeout http_502 http_503;
        }
    }

    upstream auth_service {
        server provigil-auth:3001 max_fails=3 fail_timeout=10s;
    }

    upstream ndr_engines {
        least_conn;
        # Reuse connections to the engines. Without this every request opened a
        # new TCP connection (hundreds to thousands per second at sensor scale).
        keepalive          256;
        keepalive_requests 10000;
        keepalive_timeout  60s;
        server ndr-engine-1:3000 max_fails=3 fail_timeout=30s;
        server ndr-engine-2:3000 max_fails=3 fail_timeout=30s;
        server ndr-engine-3:3000 max_fails=3 fail_timeout=30s;
        # ENGINES_MARKER
    }

    # Engines that receive sensor traffic (/api/ingest, /api/sensor/*, /api/pcap/*).
    # By default this is the same set as ndr_engines, so nothing changes. To use a
    # dedicated ingest pool (docker-compose.ingest.yml, ENGINE_ROLE=ingest), add its
    # servers at the marker and delete the ndr-engine-N lines. Engines added from the
    # super admin infrastructure page go to ndr_engines only.
    upstream ndr_ingest {
        least_conn;
        keepalive          256;
        keepalive_requests 10000;
        keepalive_timeout  60s;
        server ndr-engine-1:3000 max_fails=3 fail_timeout=30s;
        server ndr-engine-2:3000 max_fails=3 fail_timeout=30s;
        server ndr-engine-3:3000 max_fails=3 fail_timeout=30s;
        # INGEST_ENGINES_MARKER
    }

    upstream ws_engines {
        ip_hash;
        server ndr-engine-1:3000;
        server ndr-engine-2:3000;
        server ndr-engine-3:3000;
        # WS_ENGINES_MARKER
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server_tokens off;

    server {
        listen 443 ssl;
        client_max_body_size 100m;

        # Behind a tunnel/proxy (ngrok, a load balancer) every user and sensor
        # reaches nginx from the same address, so the per-IP limits below
        # (including the strict login one) were shared by everybody. Take the
        # real client from X-Forwarded-For - but only when the connection
        # comes from the Docker bridge range, so a client connecting directly
        # can't spoof it.
        set_real_ip_from    172.16.0.0/12;
        real_ip_header      X-Forwarded-For;
        real_ip_recursive   on;

        ssl_certificate     /etc/nginx/ssl/ndr.crt;
        ssl_certificate_key /etc/nginx/ssl/ndr.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://cdn.jsdelivr.net https://unpkg.com; img-src 'self' data: https://www.google.com https://*.gstatic.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; form-action 'self';" always;

        location /ws {
            proxy_pass         http://ws_engines;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 3600s;
        }

        location = /api/auth/login {
            limit_req zone=login_limit burst=2 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/auth/logout {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/auth/refresh {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/auth/me {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/auth/check-username {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/auth/reset-password {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/auth/mfa/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/auth/users {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/auth/tenants {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/auth/me/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/auth/forgot/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SIEM not available in NDR-only mode
        location /api/siem {
            return 503 '{"error":"SIEM module not installed"}';
            add_header Content-Type application/json always;
        }

        location /api/xdr {
            return 503 '{"error":"SIEM module not installed"}';
            add_header Content-Type application/json always;
        }

        location /api/announcements {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Everything a sensor calls (see scripts/install-sensor.sh): event
        # ingest, register/heartbeat/checkin/command, and pcap fetch/upload.
        # `sensors/` (UI assignments) and `sensor-keys` (UI) deliberately do
        # NOT match - `sensor/` requires the slash right after "sensor".
        location ~ ^/api/(ingest|sensor/.*|pcap/(pending|upload|upload-failed))$ {
            proxy_pass         http://ndr_ingest;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass         http://ndr_engines;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /health {
            proxy_pass http://ndr_engines;
        }

        location = /product-config.json {
            add_header Content-Type  application/json;
            add_header Cache-Control "no-cache";
            return 200 '{"product_mode":"ndr"}';
        }

        location /favicon-proxy {
            resolver 8.8.8.8 valid=30s;
            proxy_pass https://t0.gstatic.com/faviconV2$is_args$args;
            proxy_set_header Host t0.gstatic.com;
            proxy_ssl_server_name on;
            proxy_set_header Referer "";
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=86400";
        }

        # Angular's production build content-hashes these files (main-XXXX.js,
        # chunk-XXXX.js ...), so a new build always gets new names and a long
        # lifetime is safe. Without it the browser revalidated every chunk on
        # each navigation - one round trip through the tunnel per file.
        # `expires` (not add_header) so the server-level security headers are
        # not dropped for these responses.
        location ~ ^/(main|scripts|polyfills|styles|chunk)-[A-Za-z0-9]+\.(js|css)$ {
            set $ndr_ui http://ndr-ui:80;
            proxy_pass         $ndr_ui;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            expires            1y;
        }

        location / {
            set $ndr_ui http://ndr-ui:80;
            proxy_pass         $ndr_ui;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
