[package]
name = "provigil-deploy"
version = "0.1.0"
edition = "2021"
description = "Mass deployment helper run by deploy-provigil.ps1: Linux installs over SSH and the results report (specs/provigil-mass-deploy.md, C4/C6/C7)"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# ring, not aws-lc-rs: no C toolchain beyond what the workspace already needs
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
