  - r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\LanManServer\Parameters -> RestrictNullSessAccess -> 1
- id: 64043
  title: 'Network access: Restrict clients allowed to make remote calls to SAM: Administrators only'
  description: Sets the security descriptor that decides who may query the local Security Accounts Manager over RPC. The expected descriptor O:BAG:BAD:(A;;RC;;;BA) grants remote access to Administrators only.
  rationale: Restricting remote SAM queries stops ordinary users from enumerating local accounts and groups for lateral movement planning.
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Restrict clients allowed to make remote calls to SAM = Administrators: Remote Access: Allow. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RestrictRemoteSAM (REG_SZ) = O:BAG:BAD:(A;;RC;;;BA).'
