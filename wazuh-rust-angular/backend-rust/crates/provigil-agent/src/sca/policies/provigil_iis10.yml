    - CC7.2
    - CC8.1
    gdpr_IV:
    - IV_32.2
    - IV_35.7.d
  condition: all
  rules:
  - c:%systemroot%\system32\inetsrv\appcmd list config -section:system.webServer/security/requestFiltering -> r:removeServerHeader="true"
- id: 69015
  title: 'Request filtering maxAllowedContentLength: 30000000 bytes or less'
  description: maxAllowedContentLength is the largest request body IIS accepts. The check expects the value to be 30000000 or lower.
  rationale: Capping body size limits uploads that would exhaust disk, memory or bandwidth.
  remediation: appcmd set config /section:requestfiltering /requestLimits.maxAllowedContentLength:30000000
  compliance:
    nist_800_53:
    - SI-10
    - CM-6
    pci_dss:
    - 6.2.4
    hipaa:
    - 164.312(c)(1)
    iso_27001:
    - A.8.9
    - A.8.28
    soc_2:
    - CC7.1
    - CC7.2
    - CC8.1
    gdpr_IV:
    - IV_32.2
    - IV_35.7.d
  condition: all
  rules:
  - c:%systemroot%\system32\inetsrv\appcmd list config /section:requestfiltering -> n:maxAllowedContentLength="(\d)" compare <= 30000000
- id: 69016
  title: 'Request filtering maxUrl: 4096 bytes or less'
  description: maxUrl is the longest URL path IIS accepts. The check expects the value to be 4096 or lower.
  rationale: Rejecting long URLs blocks overflow and resource exhaustion attempts that rely on oversized paths.
  remediation: appcmd set config /section:requestfiltering /requestLimits.maxUrl:4096
  compliance:
    nist_800_53:
    - SI-10
    - CM-6
    pci_dss:
    - 6.2.4
    hipaa:
    - 164.312(c)(1)
    iso_27001:
