[package]
name = "provigil-gateway"
version = "0.1.0"
edition = "2021"
description = "The ProVigil agent front door: gRPC and HTTPS for agents, shared state in ClickHouse"

[lib]
path = "src/lib.rs"

[[bin]]
name = "provigil-gateway"
path = "src/main.rs"

[dependencies]
provigil-agent-server = { path = "../provigil-agent-server" }
provigil-proto = { path = "../provigil-proto" }
siem-ipc = { path = "../siem-ipc" }
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
http-body-util = "0.1"
tonic = { version = "0.12", default-features = false, features = ["transport"] }
tower = { version = "0.5", features = ["util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clickhouse = { version = "0.13", features = ["time", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
bytes = "1"
futures-util = "0.3"
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
sysinfo = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
provigil-agent = { path = "../provigil-agent" }
tempfile = "3"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
