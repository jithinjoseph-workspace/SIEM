[package]
name = "siem-triage"
version = "0.1.0"
edition = "2021"
description = "Alert triage for the SIEM: groups similar Wazuh alerts, rules first, AI only for undecided groups, recommendations a person applies"

[dependencies]
siem-ai = { path = "../siem-ai" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4"] }
