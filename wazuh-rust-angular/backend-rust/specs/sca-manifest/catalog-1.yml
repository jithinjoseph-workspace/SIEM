S0240:
  title: "Support device authentication using certificate: Enabled: Automatic"
  description: "Lets the computer authenticate to the domain with its device certificate through Kerberos PKINIT, choosing automatically."
  rationale: "Certificate-based device authentication is stronger than a password-based machine secret."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\Kerberos\\Support device authentication using certificate = Enabled: Automatic. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\kerberos\\parameters: DevicePKInitEnabled (REG_DWORD) = 1 and DevicePKInitBehavior (REG_DWORD) = 0."
  compliance: { nist_800_53: ["IA-2", "IA-5", "SC-8", "SC-13"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(d)", "164.312(e)(1)"], iso_27001: ["A.8.5", "A.8.24"] }

S0241:
  title: "Enumeration policy for external devices incompatible with Kernel DMA Protection: Block All"
  description: "Sets what Windows does with external devices (such as Thunderbolt) whose drivers do not support DMA remapping."
  rationale: "Blocking them prevents direct memory access attacks through external ports."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\Kernel DMA Protection\\Enumeration policy for external devices incompatible with Kernel DMA Protection = Enabled: Block All. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Kernel DMA Protection\\DeviceEnumerationPolicy (REG_DWORD) = 0."
  compliance: { nist_800_53: ["MP-7", "CM-7", "SC-41"], pci_dss: ["2.2.6"], hipaa: ["164.310(d)(1)"], iso_27001: ["A.7.10", "A.8.1"] }

S0242:
  title: "Configure password backup directory: Active Directory or Microsoft Entra ID"
  description: "Sets where Windows LAPS backs up the managed local administrator password (1 = Microsoft Entra ID, 2 = Active Directory)."
  rationale: "Without a backup directory LAPS does not manage the password, leaving a static shared password in place."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\LAPS\\Configure password backup directory = Enabled: Active Directory or Azure AD (Microsoft Entra ID). Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\LAPS\\BackupDirectory (REG_DWORD) = 1 or 2."
  compliance: { nist_800_53: ["IA-5", "IA-5(1)", "AC-2"], pci_dss: ["8.3.6", "8.3.9", "2.2.2"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: ["A.5.17", "A.8.2"] }

S0243:
  title: "Do not allow password expiration time longer than required by policy: Enabled"
  description: "When enabled, LAPS does not allow the password expiration time to be set longer than the configured password age. The check also passes when the value is absent (on by default)."
  rationale: "This ensures the managed password is rotated as often as policy says."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\LAPS\\Do not allow password expiration time longer than required by policy = Enabled. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\LAPS\\PasswordExpirationProtectionEnabled (REG_DWORD) = 1."
  compliance: { nist_800_53: ["IA-5", "IA-5(1)", "AC-2"], pci_dss: ["8.3.6", "8.3.9", "2.2.2"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: ["A.5.17", "A.8.2"] }

S0244:
  title: "Enable password encryption: Enabled"
  description: "When enabled, LAPS encrypts the managed password before storing it in Active Directory."
  rationale: "Encryption limits who can read the password even if directory attributes are exposed."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\LAPS\\Enable password encryption = Enabled. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\LAPS\\ADPasswordEncryptionEnabled (REG_DWORD) = 1."
  compliance: { nist_800_53: ["IA-5", "IA-5(1)", "AC-2"], pci_dss: ["8.3.6", "8.3.9", "2.2.2"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: ["A.5.17", "A.8.2"] }

S0245:
  title: "Password Settings (LAPS): Password Complexity: Large letters + small letters + numbers + special characters"
  description: "Sets which character types LAPS uses when generating the managed password."
  rationale: "Using all character types makes the generated password much harder to guess."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\LAPS\\Password Settings = Enabled: Password Complexity = Large letters + small letters + numbers + special characters. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\LAPS\\PasswordComplexity (REG_DWORD) = 4."
  compliance: { nist_800_53: ["IA-5", "IA-5(1)", "AC-2"], pci_dss: ["8.3.6", "8.3.9", "2.2.2"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: ["A.5.17", "A.8.2"] }

S0246:
  title: "Password Settings (LAPS): Password Length: 15 or more characters"
  description: "Sets the length of the password LAPS generates for the managed account."
  rationale: "Long random passwords resist brute-force attacks."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\LAPS\\Password Settings = Enabled: Password Length = 15 or more. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\LAPS\\PasswordLength (REG_DWORD) = 15 or more."
  compliance: { nist_800_53: ["IA-5", "IA-5(1)", "AC-2"], pci_dss: ["8.3.6", "8.3.9", "2.2.2"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: ["A.5.17", "A.8.2"] }

S0247:
  title: "Password Settings (LAPS): Password Age (Days): 30 or fewer"
  description: "Sets how many days the LAPS-managed password stays valid before it is rotated."
  rationale: "Frequent rotation shortens how long a disclosed password remains useful."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\LAPS\\Password Settings = Enabled: Password Age (Days) = 30 or fewer. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\LAPS\\PasswordAgeDays (REG_DWORD) = 30 or fewer."
  compliance: { nist_800_53: ["IA-5", "IA-5(1)", "AC-2"], pci_dss: ["8.3.6", "8.3.9", "2.2.2"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: ["A.5.17", "A.8.2"] }

S0248:
  title: "Post-authentication actions: Grace period (hours): 1 to 8"
  description: "Sets how many hours after the managed account is used LAPS waits before performing its post-authentication actions."
  rationale: "A short grace period limits how long a used password stays valid."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\LAPS\\Post-authentication actions = Enabled: Grace period (hours) = a value from 1 to 8. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\LAPS\\PostAuthenticationResetDelay (REG_DWORD) = 1-8."
  compliance: { nist_800_53: ["IA-5", "IA-5(1)", "AC-2"], pci_dss: ["8.3.6", "8.3.9", "2.2.2"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: ["A.5.17", "A.8.2"] }

S0249:
  title: "Post-authentication actions: Actions: Reset password and logoff, or Reset password and reboot"
  description: "Sets what LAPS does after the grace period once the managed account has been used (3 = reset and sign out, 5 = reset and restart)."
  rationale: "Resetting the password and ending the session stops the revealed password from being reused."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\LAPS\\Post-authentication actions = Enabled: Actions = Reset the password and logoff the managed account (or reset and reboot). Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\LAPS\\PostAuthenticationActions (REG_DWORD) = 3 or 5."
  compliance: { nist_800_53: ["IA-5", "IA-5(1)", "AC-2"], pci_dss: ["8.3.6", "8.3.9", "2.2.2"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: ["A.5.17", "A.8.2"] }

S0250:
  title: "Allow Custom SSPs and APs to be loaded into LSASS: Disabled"
  description: "Controls whether custom security support providers and authentication packages can be loaded into the LSA process."
  rationale: "Malicious providers loaded into LSASS can capture every password typed on the system."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\Local Security Authority\\Allow Custom SSPs and APs to be loaded into LSASS = Disabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\System\\AllowCustomSSPsAPs (REG_DWORD) = 0."
  compliance: { nist_800_53: ["IA-5", "SC-28", "AC-3"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(a)(2)(iv)", "164.312(d)"], iso_27001: ["A.5.17", "A.8.5"] }

