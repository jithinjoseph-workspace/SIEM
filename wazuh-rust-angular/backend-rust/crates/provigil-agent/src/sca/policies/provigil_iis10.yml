- id: 69022
  title: 'Handler access policy: Read, Script'
  description: The handlers accessPolicy decides whether handlers may read, run scripts, run executables or write. The check expects accessPolicy="Read, Script".
  rationale: Never combining Write with Script or Execute stops an uploaded file from being run on the server.
  remediation: appcmd set config /section:handlers /accessPolicy:Read,Script
