- id: 66015
  title: 'Devices: Allowed to format and eject removable media: Administrators'
  description: Sets who may format and eject removable NTFS media. The check passes when the value is absent or 0 (Administrators).
  rationale: Limiting this right to administrators reduces the chance of data being carried off on removable media.
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Devices: Allowed to format and eject removable media = Administrators. Registry: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\AllocateDASD (REG_SZ) = 0.'
