- id: 62018
  title: 'Domain controller: Allow vulnerable Netlogon secure channel connections: not configured'
  description: Lists accounts that a domain controller will still accept over a Netlogon secure channel that does not use secure RPC. The check passes when no allow list value is present.
  rationale: Any account on this list can bypass the protection added against Netlogon channel downgrade attacks, so the list should stay empty.
