    - A.8.16
    soc_2:
    - CC7.1
    - CC7.2
    gdpr_IV:
    - IV_35.7.d
  condition: none
  rules:
  - d:$web_dirs -> ^.htaccess$ -> r:RewriteCond\s+\S+HTTP_REFERERS\s+\S+google
- id: 78015
  title: '.htaccess php_value auto_append_file: none'
  description: auto_append_file in .htaccess makes PHP run an extra file at the end of every script. The check fails when an .htaccess file under /var/www sets php_value auto_append_file.
  rationale: Attackers use this to inject code into every page without touching the site's own files.
  remediation: Find the files (grep -rl under /var/www), treat the site as compromised, remove the injected code and restore from a trusted source; then patch the entry point.
  compliance:
    nist_800_53:
    - SI-3
    - SI-4
