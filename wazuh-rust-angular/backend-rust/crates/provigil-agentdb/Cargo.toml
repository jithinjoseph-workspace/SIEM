[package]
name = "provigil-agentdb"
version = "0.1.0"
edition = "2021"
description = "ProVigil agent database (provigil-db): per-agent, global and task SQLite databases behind a text protocol"

[dependencies]
siem-cjson = { path = "../siem-cjson" }
siem-sqlite = { path = "../siem-sqlite" }
sha2 = "0.10"
sha1 = "0.10"
flate2 = "1"
parking_lot = { version = "0.12", features = ["arc_lock"] }
chrono = "0.4"

[dev-dependencies]
# the old implementation, as the reference of the comparison tests (removed with it)
siem-wdb = { path = "../siem-wdb" }
tempfile = "3"
