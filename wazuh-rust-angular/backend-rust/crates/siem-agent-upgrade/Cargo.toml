[package]
name = "siem-agent-upgrade"
version = "0.1.0"
edition = "2021"
description = "Wazuh-compatible Agent Upgrade Subsystem (wm_agent_upgrade) for remote package delivery, validation, and execution"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
sha1 = "0.10"
base64 = "0.21"
async-trait = "0.1"
siem-task-manager = { path = "../siem-task-manager" }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
