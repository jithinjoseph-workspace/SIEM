[package]
name = "siem-monitord"
version = "0.1.0"
edition = "2021"
description = "Port of wazuh-monitord (src/monitord): agent disconnection alerts, ossec.log rotation, alerts/archives signing and compression"

[dependencies]
siem-config = { path = "../siem-config" }
siem-cjson = { path = "../siem-cjson" }
siem-ipc = { path = "../siem-ipc" }
siem-log = { path = "../siem-log" }
siem-daemon = { path = "../siem-daemon" }
siem-regex = { path = "../siem-regex" }
siem-xml = { path = "../siem-xml" }
siem-maild = { path = "../siem-maild" }
tokio = { version = "1.40", features = ["full"] }
chrono = "0.4"
flate2 = "1.0"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "wazuh-monitord"
path = "src/bin/wazuh-monitord.rs"
