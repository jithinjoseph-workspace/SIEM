[package]
name = "provigil-fileop"
version = "0.1.0"
edition = "2021"
description = "Shared-file bundles, directory helpers, Windows text-mode I/O and the OS description string"

[dependencies]
md-5 = "0.10"
libc = "0.2"
tracing = "0.1"
siem-log = { path = "../siem-log" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json = "1"
hex = "0.4"
