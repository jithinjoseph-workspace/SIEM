[package]
name = "siem-winagent"
version = "0.1.0"
edition = "2021"
description = "Port of Wazuh 4.14.7 wazuh-agent.exe (src/win32): the Windows agent process and service"

[[bin]]
name = "wazuh-agent"
path = "src/main.rs"

[dependencies]
siem-log = { path = "../siem-log" }
siem-config = { path = "../siem-config" }
siem-ipc = { path = "../siem-ipc" }
siem-fileop = { path = "../siem-fileop" }
siem-agentd = { path = "../siem-agentd" }
siem-logcollector = { path = "../siem-logcollector" }
siem-execd = { path = "../siem-execd" }
siem-syscheckd = { path = "../siem-syscheckd" }
siem-sca = { path = "../siem-sca" }
siem-syscollector = { path = "../siem-syscollector" }
siem-sysinfo = { path = "../siem-sysinfo" }
siem-cjson = { path = "../siem-cjson" }
siem-xml = { path = "../siem-xml" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Services", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus"] }
