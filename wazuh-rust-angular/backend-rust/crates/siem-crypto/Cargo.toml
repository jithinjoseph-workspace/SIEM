[package]
name = "siem-crypto"
version = "0.1.0"
edition = "2021"
description = "Wazuh Cryptography Subsystem (src/os_crypto)"

[dependencies]
siem-core = { path = "../siem-core" }
siem-shared = { path = "../siem-shared" }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
cipher = { version = "0.4", features = ["block-padding"] }
blowfish = "0.9"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
