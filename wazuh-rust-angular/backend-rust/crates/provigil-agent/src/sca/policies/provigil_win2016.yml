    nist_800_53:
    - AC-3
    - AC-14
    pci_dss:
    - 7.2.1
    hipaa:
    - 164.312(a)(1)
    iso_27001:
    - A.5.15
    - A.8.3
    soc_2:
    - CC6.1
    - CC6.3
    gdpr_IV:
    - IV_32.2
  condition: all
  rules:
