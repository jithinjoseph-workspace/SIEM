- id: 69037
  title: 'RC4 ciphers (40/128, 56/128, 64/128, 128/128): disabled (Enabled = 0)'
  description: Schannel reads a key per RC4 key size. The check expects Enabled = 0 under each of the four RC4 cipher keys.
  rationale: RC4 has known keystream biases that allow plaintext recovery and is prohibited for TLS by RFC 7465.
