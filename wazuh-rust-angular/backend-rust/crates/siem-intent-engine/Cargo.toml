[package]
name = "siem-intent-engine"
version = "0.1.0"
edition = "2021"
description = "Intent Prediction Engine: early inference of attacker goals, multi-hypothesis scoring & preemptive containment"

[dependencies]
siem-core = { path = "../siem-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.40", features = ["full"] }
