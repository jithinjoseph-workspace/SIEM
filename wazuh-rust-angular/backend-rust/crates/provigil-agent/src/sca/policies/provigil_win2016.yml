# ProVigil configuration policy: Windows Server 2016. Generated by specs/sca-manifest/build_policies.py; edit the catalog, not this file.
policy:
  id: provigil_win2016
  name: ProVigil Windows Server 2016 hardening
  description: Security configuration checks for Windows Server 2016, written by ProVigil from the vendor's public documentation and Microsoft's Windows security baselines.
  references:
  - https://learn.microsoft.com/windows/security/operating-system-security/device-management/windows-security-configuration-framework/windows-security-baselines
requirements:
  all:
  - r:HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion -> ProductName -> r:^Windows Server 2016
checks:
- id: 64000
  title: 'Domain member: Maximum machine account password age: 365 days or fewer, but not 0'
  description: Sets how often the computer changes its computer account password. The check requires 1 to 365 days.
  rationale: Regular rotation limits how long a captured machine password stays useful; 0 would stop rotation.
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain member: Maximum machine account password age = 1 to 365 days. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\MaximumPasswordAge (REG_DWORD) = 1-365.'
  compliance:
    nist_800_53:
    - IA-5
    - SC-28
    pci_dss:
    - 8.3.2
    hipaa:
    - 164.312(d)
    iso_27001:
    - A.5.17
    - A.8.5
    soc_2:
    - CC6.1
    - CC6.2
    - CC6.6
    - CC6.7
    gdpr_IV:
    - IV_32.2
  condition: all
  rules:
  - not r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\Netlogon\Parameters -> MaximumPasswordAge -> 0
  - r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\Netlogon\Parameters -> MaximumPasswordAge -> n:^(\d+) compare <= 365
- id: 64001
  title: 'Accounts: Block Microsoft accounts: Users can''t add or log on with Microsoft accounts'
  description: Controls whether consumer Microsoft accounts can be added to the computer or used to sign in.
  rationale: Keeping sign-in to organization-managed accounts keeps identities under central control and auditing.
  remediation: 'Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\Security Options\Accounts: Block Microsoft accounts = Users can''t add or log on with Microsoft accounts. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\NoConnectedUser (REG_DWORD) = 3.'
  compliance:
    nist_800_53:
    - AC-2
    - IA-2
    pci_dss:
    - 2.2.2
    - 8.2.2
    hipaa:
    - 164.312(a)(1)
    - 164.312(a)(2)(i)
    iso_27001:
    - A.5.15
    - A.5.16
    - A.8.2
    soc_2:
    - CC6.1
    - CC6.2
    - CC6.3
    gdpr_IV:
    - IV_32.2
  condition: all
  rules:
  - r:HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Policies\System
  - r:HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Policies\System -> NoConnectedUser
  - r:HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Policies\System -> NoConnectedUser -> 3
- id: 64002
  title: 'Accounts: Guest account status: Disabled'
  description: Controls whether the built-in local Guest account (the account whose SID ends in -501) is enabled.
  rationale: The Guest account allows unauthenticated, anonymous-like access to the computer.
  remediation: 'Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\Security Options\Accounts: Guest account status = Disabled. Command: the built-in local account with SID ending -501 must be disabled (for example: Disable-LocalUser -SID <machine SID>-501, or net user Guest /active:no).'
  compliance:
    nist_800_53:
    - IA-2
    - IA-5
    pci_dss:
    - 8.3.1
    hipaa:
    - 164.312(d)
    iso_27001:
    - '5.17'
    - '8.5'
    soc_2:
    - CC6.1
    - CC6.2
    gdpr_IV:
    - IV_32.2
  condition: all
  rules:
  - c:powershell -NoProfile -Command "[bool](Get-CimInstance -Query 'SELECT * FROM Win32_UserAccount WHERE LocalAccount = TRUE AND SID LIKE ''S-1-5-21-%-501''' | Where-Object -Property Disabled)" -> r:True
- id: 64003
  title: 'Accounts: Limit local account use of blank passwords to console logon only: Enabled'
  description: Allows local accounts with blank passwords to sign in only at the physical console, not over the network.
  rationale: This stops remote attackers from using any account that has an empty password.
  remediation: 'Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\Security Options\Accounts: Limit local account use of blank passwords to console logon only = Enabled. Registry: HKLM\System\CurrentControlSet\Control\Lsa\LimitBlankPasswordUse = 1.'
  compliance:
    nist_800_53:
    - IA-2
    - IA-5
    pci_dss:
    - 8.3.1
    hipaa:
    - 164.312(d)
    iso_27001:
    - '5.17'
    - '8.5'
    soc_2:
    - CC6.1
    - CC6.2
    gdpr_IV:
    - IV_32.2
  condition: all
  rules:
  - r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa
  - r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa -> LimitBlankPasswordUse
  - r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa -> LimitBlankPasswordUse -> 1
- id: 64004
  title: 'Audit: Force audit policy subcategory settings to override audit policy category settings: Enabled'
  description: Makes Windows apply the detailed (subcategory) audit policy instead of the legacy category-level audit policy.
  rationale: Subcategory auditing gives precise control of which events are logged; without this the legacy settings can override it.
  remediation: 'Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\Security Options\Audit: Force audit policy subcategory settings (Windows Vista or later) to override audit policy category settings = Enabled. Registry: HKLM\System\CurrentControlSet\Control\Lsa\SCENoApplyLegacyAuditPolicy = 1.'
  compliance:
    nist_800_53:
    - AU-2
    - AU-12
    pci_dss:
    - 10.2.1
    hipaa:
    - 164.312(b)
    iso_27001:
    - '8.15'
    soc_2:
    - CC7.2
    gdpr_IV:
    - IV_35.7.d
  condition: all
  rules:
  - r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa
  - r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa -> SCENoApplyLegacyAuditPolicy
  - r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa -> SCENoApplyLegacyAuditPolicy -> 1
- id: 64005
  title: 'Audit: Shut down system immediately if unable to log security audits: Disabled'
  description: Controls whether Windows halts when it cannot write security audit events.
  rationale: Halting on a full log lets an attacker cause a denial of service by filling the log.
  remediation: 'Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\Security Options\Audit: Shut down system immediately if unable to log security audits = Disabled. Registry: HKLM\System\CurrentControlSet\Control\Lsa\CrashOnAuditFail = 0.'
  compliance:
    nist_800_53:
    - AU-5
    - CP-10
    pci_dss:
    - 10.7.2
    hipaa:
    - 164.308(a)(7)(i)
    iso_27001:
    - '8.14'
    soc_2:
    - A1.2
    - CC7.2
    gdpr_IV:
    - IV_32.2
    - IV_35.7.d
  condition: all
  rules:
  - r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa
  - r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa -> CrashOnAuditFail
  - r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa -> CrashOnAuditFail -> 0
- id: 64006
  title: 'Devices: Allowed to format and eject removable media: Administrators'
  description: Sets who may format and eject removable NTFS media; value 0 limits this to Administrators.
  rationale: Restricting this stops ordinary users from removing media that holds organisational data.
  remediation: 'Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\Security Options\Devices: Allowed to format and eject removable media = Administrators. Registry: HKLM\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\AllocateDASD = 0.'
