[package]
name = "provigil-license"
version = "0.1.0"
edition = "2021"
description = "ProVigil licences (RS256 tokens, the sign-in service's format) and signed update packages"

[dependencies]
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ring = "0.17"

[[bin]]
name = "provigil-license"
path = "src/main.rs"
