[package]
name = "provigil-agent"
version = "0.1.0"
edition = "2021"
description = "ProVigil Unified Clean-Room Endpoint Agent for Windows"

[dependencies]
# the file integrity baseline on disk (MIT; SQLite itself is public domain)
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sysinfo = "0.30"
sha2 = "0.10"
# registry value hashes (MIT/Apache-2.0, same family as sha2)
md-5 = "0.10"
sha1 = "0.10"
regex = "1.10"
# the configuration assessment policies (src/sca/*.yml)
serde_yaml = "0.9"
flate2 = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
provigil-common = { path = "../provigil-common" }
# the gRPC transport (transport.rs): the service, and TLS for grpcs:// addresses
provigil-proto = { path = "../provigil-proto" }
tonic = { version = "0.12", default-features = false, features = ["transport"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.4", features = ["util"] }
siem-active-response = { path = "../siem-active-response" }
provigil-collect = { path = "../provigil-collect" }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Services", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_ProcessStatus", "Win32_System_EventLog",
    # the inventory (src/syscollector/win.rs)
    "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation",
    "Win32_System_Environment", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
    "Win32_NetworkManagement_NetManagement", "Win32_Security_Authorization"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "provigil-agent"
path = "src/main.rs"
