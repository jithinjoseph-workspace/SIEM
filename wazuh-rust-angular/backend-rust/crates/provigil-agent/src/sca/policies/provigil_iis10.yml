- id: 69026
  title: 'Site log location: not the default %SystemDrive%\inetpub\logs\LogFiles'
  description: Each IIS site writes request logs to a configured directory. The check fails when a site still logs to %SystemDrive%\inetpub\logs\LogFiles.
  rationale: Logs on a separate volume cannot fill the system drive and are easier to protect and forward.
  remediation: appcmd set config -section:system.applicationHost/sites -siteDefaults.logFile.directory:D:\IISLogs
  compliance:
    nist_800_53:
    - AU-4
    - AU-9
    - AU-11
    pci_dss:
    - 10.3.2
    - 10.5.1
    hipaa:
