- id: 64011
  title: 'Domain controller: LDAP server signing requirements: Require signing'
  description: Defines whether the domain controller insists on signed LDAP binds. Value 2 rejects unsigned simple and SASL binds that are not protected by TLS.
  rationale: Unsigned LDAP traffic can be modified or relayed in transit; requiring signing protects directory queries and changes.
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain controller: LDAP server signing requirements = Require signing. Registry: HKLM\SYSTEM\CurrentControlSet\Services\NTDS\Parameters\LDAPServerIntegrity (REG_DWORD) = 2.'
