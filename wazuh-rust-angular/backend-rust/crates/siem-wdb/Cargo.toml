[package]
name = "siem-wdb"
version = "0.1.0"
edition = "2021"
description = "Wazuh DB agent and global state management engine (global.db, FIM inventory, Syscollector, SCA, Rootcheck, wire protocol)"

[dependencies]
siem-core = { path = "../siem-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
sha1 = "0.10"
siem-sqlite = { path = "../siem-sqlite" }
siem-njson = { path = "../siem-njson" }
siem-config = { path = "../siem-config" }
siem-xml = { path = "../siem-xml" }
siem-log = { path = "../siem-log" }
siem-daemon = { path = "../siem-daemon" }
siem-cjson = { path = "../siem-cjson" }
sha2 = "0.10"
# zlib itself (bundled, static): gzip output identical to the C build
libz-sys = { version = "1.1", features = ["static"] }
libc = "0.2"
parking_lot = { version = "0.12", features = ["arc_lock"] }

[target.'cfg(target_os = "linux")'.dependencies]
siem-router = { path = "../siem-router" }
