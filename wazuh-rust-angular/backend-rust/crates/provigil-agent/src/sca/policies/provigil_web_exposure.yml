  title: 'osCommerce 2.2: not installed'
  description: osCommerce 2.2 identifies itself in includes/application_top.php. The check fails when such a file under /var/www names osCommerce 2.2.
  rationale: Old releases of web applications have published, actively exploited vulnerabilities.
  remediation: Replace osCommerce 2.2 with a supported release or another maintained platform.
  compliance:
