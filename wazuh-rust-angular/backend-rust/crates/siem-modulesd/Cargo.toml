[package]
name = "siem-modulesd"
version = "0.1.0"
edition = "2021"
description = "Port of wazuh-modulesd (wazuh_modules/): the manager modules database, agent-upgrade, task-manager and download"

[dependencies]
siem-log = { path = "../siem-log" }
siem-config = { path = "../siem-config" }
siem-ipc = { path = "../siem-ipc" }
siem-daemon = { path = "../siem-daemon" }
siem-crypto = { path = "../siem-crypto" }
siem-regex = { path = "../siem-regex" }
siem-fileop = { path = "../siem-fileop" }
siem-xml = { path = "../siem-xml" }
siem-remoted = { path = "../siem-remoted" }
siem-cjson = { path = "../siem-cjson" }
siem-execd = { path = "../siem-execd" }
siem-vulnerability-scanner = { path = "../siem-vulnerability-scanner" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.40", features = ["full"] }
serde_json = "1.0"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "wazuh-modulesd"
path = "src/bin/wazuh-modulesd.rs"
