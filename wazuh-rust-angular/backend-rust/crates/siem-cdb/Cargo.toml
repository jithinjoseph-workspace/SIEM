[package]
name = "siem-cdb"
version = "0.1.0"
edition = "2021"
description = "Wazuh-compatible fast Constant Database (CDB) engine for Threat Intelligence (IPs, Hashes, Domains)"

[dependencies]
siem-core = { path = "../siem-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
ipnet = "2.9"
tracing = "0.1"
