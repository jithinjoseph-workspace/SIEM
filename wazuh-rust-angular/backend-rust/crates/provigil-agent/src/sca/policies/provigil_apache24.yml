# ProVigil configuration policy: Apache HTTP Server 2.4. Generated by specs/sca-manifest/build_policies.py; edit the catalog, not this file.
policy:
  id: provigil_apache24
  name: ProVigil Apache HTTP Server 2.4 hardening
  description: Security configuration checks for Apache HTTP Server 2.4, written by ProVigil from the vendor's public documentation.
  references: []
requirements:
  any:
  - f:/etc/httpd/conf/httpd.conf
variables:
  $main-conf: /etc/httpd/conf/httpd.conf
  $conf-dirs: /etc/httpd/conf.d,/etc/httpd/modsecurity.d
  $ssl-confs: /etc/httpd/conf.d/ssl.conf
  $request-confs: /etc/httpd/conf/httpd.conf
  $traceen: /etc/httpd/conf/httpd.conf
  $enabled-modules: httpd -M
checks:
- id: 68000
  title: 'WebDAV modules (dav_module, dav_fs_module, dav_lock_module): not loaded'
  description: WebDAV extends HTTP so clients can create, change and move files on the server. The check lists loaded modules with 'httpd -M' and expects no dav_* module.
  rationale: Remote file authoring is rarely needed on a public site and gives attackers a way to write content to the server.
  remediation: In /etc/httpd/conf.modules.d/ (or httpd.conf) comment out the 'LoadModule dav_module', 'LoadModule dav_fs_module' and 'LoadModule dav_lock_module' line(s), then run 'apachectl configtest' and restart httpd.
  compliance:
    nist_800_53:
    - CM-7
    pci_dss:
    - 2.2.4
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.9
    soc_2:
    - CC7.1
    - CC8.1
    gdpr_IV:
    - IV_32.2
  condition: none
  rules:
  - c:$enabled-modules -> r:dav_\.+module
- id: 68001
  title: 'Server status module (status_module): not loaded'
  description: mod_status publishes a live page with current requests, client addresses and worker state. The check expects status_module to be absent from 'httpd -M'.
  rationale: The status page leaks internal activity and client details that help an attacker plan an attack.
  remediation: In /etc/httpd/conf.modules.d/ (or httpd.conf) comment out the 'LoadModule status_module modules/mod_status.so' line(s), then run 'apachectl configtest' and restart httpd.
  compliance:
    nist_800_53:
    - CM-7
    - SI-11
    pci_dss:
    - 2.2.4
    - 6.2.4
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.9
    soc_2:
    - CC7.1
    - CC7.2
    - CC8.1
    gdpr_IV:
    - IV_32.2
    - IV_35.7.d
  condition: none
  rules:
  - c:$enabled-modules -> r:status_module
- id: 68002
  title: 'Directory listing module (autoindex_module): not loaded'
  description: mod_autoindex generates a file list for any directory that has no index page. The check expects autoindex_module to be absent from 'httpd -M'.
  rationale: Automatic listings expose backup files, scripts and other content that was never meant to be linked.
  remediation: In /etc/httpd/conf.modules.d/ (or httpd.conf) comment out the 'LoadModule autoindex_module modules/mod_autoindex.so' line(s), then run 'apachectl configtest' and restart httpd.
  compliance:
    nist_800_53:
    - CM-7
    - SI-11
    pci_dss:
    - 2.2.4
    - 6.2.4
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.9
    soc_2:
    - CC7.1
    - CC7.2
    - CC8.1
    gdpr_IV:
    - IV_32.2
    - IV_35.7.d
  condition: none
  rules:
  - c:$enabled-modules -> r:autoindex_module
- id: 68003
  title: 'Proxy modules (proxy_*): not loaded'
  description: mod_proxy and its protocol modules let httpd forward requests to other servers. The check expects no module whose name contains 'proxy_' in 'httpd -M'.
  rationale: A server that is not meant to be a proxy should not be able to relay traffic; a misconfigured proxy can be abused to reach internal hosts or hide attack traffic.
  remediation: In /etc/httpd/conf.modules.d/ (or httpd.conf) comment out the LoadModule lines for proxy_module and every proxy_*_module (usually 00-proxy.conf), unless the server is a deliberate reverse proxy, line(s), then run 'apachectl configtest' and restart httpd.
  compliance:
    nist_800_53:
    - CM-7
    pci_dss:
    - 2.2.4
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.9
    soc_2:
    - CC7.1
    - CC8.1
    gdpr_IV:
    - IV_32.2
  condition: none
  rules:
  - c:$enabled-modules -> r:proxy_
- id: 68004
  title: 'User directory module (userdir_module): not loaded'
  description: mod_userdir maps URLs such as /~name to a directory in each user's home. The check expects the userdir module to be absent from the 'httpd -M' output.
  rationale: Publishing home directories exposes account names and personal files and widens the content the server serves.
  remediation: In /etc/httpd/conf.modules.d/ (or httpd.conf) comment out the 'LoadModule userdir_module modules/mod_userdir.so' line(s), then run 'apachectl configtest' and restart httpd.
  compliance:
    nist_800_53:
    - CM-7
    pci_dss:
    - 2.2.4
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.9
    soc_2:
    - CC7.1
    - CC8.1
    gdpr_IV:
    - IV_32.2
  condition: none
  rules:
  - c:$enabled-modules -> userdir_
- id: 68005
  title: 'Server information module (info_module): not loaded'
  description: mod_info shows the full server configuration, including loaded modules and directives, on a web page. The check expects info_module to be absent from 'httpd -M'.
  rationale: Showing the configuration to visitors hands an attacker a map of the server and its weak points.
  remediation: In /etc/httpd/conf.modules.d/ (or httpd.conf) comment out the 'LoadModule info_module modules/mod_info.so' line(s), then run 'apachectl configtest' and restart httpd.
  compliance:
    nist_800_53:
    - CM-7
    - SI-11
    pci_dss:
    - 2.2.4
    - 6.2.4
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.9
    soc_2:
    - CC7.1
    - CC7.2
    - CC8.1
    gdpr_IV:
    - IV_32.2
    - IV_35.7.d
  condition: none
  rules:
  - c:$enabled-modules -> r:info_module
- id: 68006
  title: 'apache account shell: /sbin/nologin or /dev/null'
  description: The account that runs the httpd worker processes is listed in /etc/passwd. The check expects its login shell to end in /sbin/nologin or /dev/null.
  rationale: A service account with no usable shell cannot be used for an interactive login if its password or keys are ever obtained.
  remediation: usermod -s /sbin/nologin apache
  compliance:
    nist_800_53:
    - AC-2
    - AC-6
    pci_dss:
    - 2.2.2
    - 8.2.2
    hipaa:
    - 164.312(a)(1)
    iso_27001:
    - A.5.15
    - A.8.2
    soc_2:
    - CC6.1
    - CC6.3
    gdpr_IV:
    - IV_32.2
  condition: all
  rules:
  - f:/etc/passwd -> r:apache && r:/sbin/nologin$|/dev/null$
- id: 68007
  title: 'apache account password: locked'
  description: '''passwd -S apache'' reports whether the service account password is usable. The check expects the status L / LK or ''Password locked''.'
  rationale: A locked password stops anyone from logging in as the web server account with a guessed or reused password.
  remediation: passwd -l apache
  compliance:
    nist_800_53:
    - AC-2
    - AC-6
    pci_dss:
    - 2.2.2
    - 8.2.2
    hipaa:
    - 164.312(a)(1)
    iso_27001:
    - A.5.15
    - A.8.2
    soc_2:
    - CC6.1
    - CC6.3
    gdpr_IV:
    - IV_32.2
  condition: any
  rules:
  - c:passwd -S apache -> r:apache && r:\s*\t*L|\s*\t*LK
  - c:passwd -S apache -> r:apache && r:Password locked
- id: 68008
  title: 'AllowOverride: None in httpd.conf and conf.d files; AllowOverrideList absent from conf.d and present in httpd.conf'
  description: AllowOverride and AllowOverrideList decide which directives .htaccess files may change. The check expects an active 'AllowOverride None' line in httpd.conf and in the conf.d / modsecurity.d files, no AllowOverrideList in those directories, and an AllowOverrideList line in httpd.conf.
  rationale: With overrides off, a file uploaded into the web tree cannot change access rules or handlers; all policy stays in the main configuration.
  remediation: Inside every <Directory> block set 'AllowOverride None'; remove AllowOverrideList from conf.d files and keep 'AllowOverrideList None' in httpd.conf.
  compliance:
    nist_800_53:
    - AC-3
    - AC-6
    pci_dss:
    - 7.2.1
    - 7.2.2
    hipaa:
    - 164.312(a)(1)
    iso_27001:
    - A.5.15
    - A.8.3
    soc_2:
    - CC6.1
    - CC6.3
    gdpr_IV:
    - IV_32.2
  condition: all
  rules:
  - d:$conf-dirs -> conf -> !r:^# && r:allowoverride|AllowOverride && r:none|None
  - not d:$conf-dirs -> conf -> r:allowoverridelist|AllowOverrideList
  - f:$main-conf -> !r:^# && r:allowoverride|AllowOverride && r:none|None
  - f:$main-conf -> r:allowoverridelist|AllowOverrideList
- id: 68009
  title: 'Options directive: Includes not enabled'
  description: The Includes option turns on server-side includes, which can run commands from within served pages. The check expects no active Options line naming Includes (or IncludesNOEXEC) in httpd.conf or conf.d.
  rationale: Server-side includes let page content trigger processing on the server and are a known path for command execution.
  remediation: Remove Includes and IncludesNOEXEC from every Options directive, for example 'Options None' or 'Options -Includes'.
  compliance:
    nist_800_53:
    - CM-7
    pci_dss:
    - 2.2.4
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.9
    soc_2:
    - CC7.1
    - CC8.1
    gdpr_IV:
    - IV_32.2
  condition: none
  rules:
  - d:$conf-dirs -> conf -> !r:^# && r:options && r:includes|Includes
  - f:$main-conf -> !r:^# && r:options && r:includes|Includes
- id: 68010
  title: 'Default content: no index.html in /var/www or /var/www/html, no manual.conf / apache2-doc.conf, no SetHandler for server-* or perl handlers'
  description: A fresh install ships a welcome page, the online manual and sample handlers such as server-status, server-info and perl-status. The check expects none of these in the web root or configuration.
  rationale: Default pages confirm the product and version and sample handlers expose internals; neither belongs on a production server.
  remediation: Delete the default index.html, remove manual.conf / apache2-doc.conf, and delete <Location> blocks with 'SetHandler server-status', 'server-info' or perl-status / perl-script handlers.
  compliance:
    nist_800_53:
    - CM-7
    - SI-11
    pci_dss:
    - 2.2.4
    - 6.2.4
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.9
    soc_2:
    - CC7.1
    - CC7.2
    - CC8.1
    gdpr_IV:
    - IV_32.2
    - IV_35.7.d
  condition: none
  rules:
  - d:/var/www -> index.html
  - d:/var/www/html -> index.html
  - d:$conf-dirs -> r:manual.conf|apache2-doc.conf
  - d:$conf-dirs -> conf -> !r:^# && r:sethandler|SetHandler && r:server
  - f:$main-conf -> !r:^# && r:sethandler|SetHandler && r:server
  - d:$conf-dirs -> conf -> !r:^# && r:sethandler|SetHandler && r:perl
  - f:$main-conf -> !r:^# && r:sethandler|SetHandler && r:perl
- id: 68011
  title: 'printenv CGI script: removed'
  description: printenv is a sample CGI script that prints every environment variable of the request. The check expects no printenv file in /var/www/cgi-bin or /usr/lib/cgi-bin.
  rationale: The script discloses server paths, software versions and request data, and samples are not maintained as production code.
  remediation: rm -f /var/www/cgi-bin/printenv /usr/lib/cgi-bin/printenv
  compliance:
    nist_800_53:
    - CM-7
    - SI-11
    pci_dss:
    - 2.2.4
    - 6.2.4
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.9
    soc_2:
    - CC7.1
    - CC7.2
    - CC8.1
    gdpr_IV:
    - IV_32.2
    - IV_35.7.d
  condition: none
  rules:
  - d:/var/www/cgi-bin -> printenv
  - d:/usr/lib/cgi-bin -> printenv
- id: 68012
  title: 'test-cgi script: removed'
  description: test-cgi is a sample script that echoes server and request variables. The check expects no test-cgi file in /var/www/cgi-bin or /usr/lib/cgi-bin.
  rationale: Sample scripts disclose details about the server and some old versions had injection flaws.
  remediation: rm -f /var/www/cgi-bin/test-cgi /usr/lib/cgi-bin/test-cgi
  compliance:
    nist_800_53:
    - CM-7
    - SI-11
    pci_dss:
    - 2.2.4
    - 6.2.4
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.9
    soc_2:
    - CC7.1
    - CC7.2
    - CC8.1
    gdpr_IV:
    - IV_32.2
    - IV_35.7.d
  condition: none
  rules:
  - d:/var/www/cgi-bin -> test-cgi
  - d:/usr/lib/cgi-bin -> test-cgi
- id: 68013
  title: 'TraceEnable: off'
  description: TraceEnable controls whether the server answers HTTP TRACE requests, which echo the request back to the client. The check expects an active 'TraceEnable off' line in httpd.conf.
  rationale: TRACE can reflect cookies and headers back to a script, which has been used to steal session data (cross-site tracing).
  remediation: Add 'TraceEnable off' to httpd.conf and restart httpd.
  compliance:
    nist_800_53:
    - CM-7
    - SI-11
    pci_dss:
    - 2.2.4
    - 6.2.4
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.9
    soc_2:
    - CC7.1
    - CC7.2
    - CC8.1
    gdpr_IV:
    - IV_32.2
    - IV_35.7.d
  condition: all
  rules:
  - f:$traceen -> !r:^# && r:TraceEnable && r:off
- id: 68014
  title: 'Listen: bound to specific IP addresses (no bare port, no 0.0.0.0)'
  description: The Listen directive sets the address and port httpd accepts connections on. The check fails when any active Listen line gives only a port or uses 0.0.0.0.
  rationale: Binding to named addresses keeps the service off interfaces where it is not meant to be reachable, such as management or backup networks.
  remediation: Write each Listen with an address, for example 'Listen 10.0.0.5:80' and 'Listen 10.0.0.5:443'.
  compliance:
    nist_800_53:
    - CM-7
    - SC-7
    pci_dss:
    - 1.2.5
    - 2.2.4
    hipaa:
    - 164.312(e)(1)
    iso_27001:
    - A.8.9
    - A.8.20
    soc_2:
    - CC6.6
    - CC6.7
    - CC7.1
    - CC8.1
    gdpr_IV:
    - IV_32.2
  condition: none
  rules:
  - d:$conf-dirs -> conf -> !r:^# && r:listen\s*\t*\d+$|Listen\s*\t*\d+$
  - d:$conf-dirs -> conf -> !r:^# && r:listen|Listen && r:0.0.0.0
  - f:$main-conf -> !r:^# && r:listen\s*\t*\d+$|Listen\s*\t*\d+$
  - f:$main-conf -> !r:^# && r:listen|Listen && r:0.0.0.0
- id: 68015
  title: 'X-Frame-Options header: ''Header always append X-Frame-Options SAMEORIGIN'' (or DENY)'
  description: X-Frame-Options tells browsers whether the site's pages may be shown inside a frame on another site. The check expects httpd.conf to append the header with SAMEORIGIN or DENY.
  rationale: Blocking framing by other sites defeats clickjacking, where a hidden frame tricks users into clicking controls.
  remediation: Add 'Header always append X-Frame-Options SAMEORIGIN' to httpd.conf (requires mod_headers) and restart httpd.
  compliance:
    nist_800_53:
    - SC-8
    - SC-23
    pci_dss:
    - 4.2.1
    - 6.2.4
    hipaa:
    - 164.312(e)(1)
    iso_27001:
    - A.8.5
    - A.8.24
    soc_2:
    - CC6.6
    - CC6.7
    gdpr_IV:
    - IV_32.2
  condition: all
  rules:
  - f:$main-conf -> r:Header && r:always && r:append && r:X-Frame-Options && r:SAMEORIGIN|DENY
- id: 68016
  title: 'SSLInsecureRenegotiation: not on'
  description: SSLInsecureRenegotiation allows TLS renegotiation with clients that lack the secure renegotiation extension. The check fails when ssl.conf has an active line setting it to on.
  rationale: Legacy renegotiation lets a man-in-the-middle splice their own data into the start of a victim's TLS session.
  remediation: Set 'SSLInsecureRenegotiation off' (or remove the line) in /etc/httpd/conf.d/ssl.conf.
  compliance:
    nist_800_53:
    - SC-8
    - SC-13
    pci_dss:
    - 4.2.1
    hipaa:
    - 164.312(e)(1)
    - 164.312(e)(2)(ii)
    iso_27001:
    - A.8.24
    soc_2:
    - CC6.6
    - CC6.7
    gdpr_IV:
    - IV_32.2
  condition: none
  rules:
  - f:$ssl-confs -> !r:^# && r:sslinsecurerenegotiation|SSLInsecureRenegotiation && r:\s+on$
- id: 68017
  title: 'SSLCompression: not on'
  description: SSLCompression enables compression at the TLS layer. The check fails when ssl.conf has an active line setting it to on.
  rationale: TLS compression makes encrypted traffic open to length-based attacks such as CRIME that recover cookies.
  remediation: Set 'SSLCompression off' (or remove the line) in /etc/httpd/conf.d/ssl.conf.
  compliance:
    nist_800_53:
    - SC-8
    - SC-13
    pci_dss:
    - 4.2.1
    hipaa:
    - 164.312(e)(1)
    - 164.312(e)(2)(ii)
    iso_27001:
    - A.8.24
    soc_2:
    - CC6.6
    - CC6.7
    gdpr_IV:
    - IV_32.2
  condition: none
  rules:
  - f:$ssl-confs -> !r:^# && r:sslcompression|SSLCompression && r:\s+on$
- id: 68018
  title: 'ServerTokens: Prod'
  description: ServerTokens decides how much product and version detail goes into the Server response header. The check expects an active 'ServerTokens Prod' (or ProductOnly) line in the conf.d files.
  rationale: Hiding the version and module list makes it harder for scanners to match the server to known vulnerabilities.
  remediation: Add 'ServerTokens Prod' to a file in /etc/httpd/conf.d/ and restart httpd.
  compliance:
    nist_800_53:
    - CM-7
    - SI-11
    pci_dss:
    - 2.2.4
    - 6.2.4
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.9
    soc_2:
    - CC7.1
    - CC7.2
    - CC8.1
    gdpr_IV:
    - IV_32.2
    - IV_35.7.d
  condition: any
  rules:
  - d:$conf-dirs -> conf -> !r:^# && r:servertokens|ServerTokens && r:\s+Prod|\s+ProductOnly
- id: 68019
  title: 'ServerSignature: not On'
  description: ServerSignature adds a footer with the server name and version to generated pages such as error pages and listings. The check fails when a conf.d file sets it On.
  rationale: The footer discloses software and version details to anyone who triggers an error.
  remediation: Set 'ServerSignature Off' in the conf.d configuration and restart httpd.
  compliance:
    nist_800_53:
    - CM-7
    - SI-11
    pci_dss:
    - 2.2.4
    - 6.2.4
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.9
    soc_2:
    - CC7.1
    - CC7.2
    - CC8.1
    gdpr_IV:
    - IV_32.2
    - IV_35.7.d
  condition: none
  rules:
  - d:$conf-dirs -> conf -> !r:^# && r:serversignature|ServerSignature && r:\s+on|\s+On
- id: 68020
  title: 'Timeout: 10 seconds or less'
  description: Timeout sets how long httpd waits for I/O events such as receiving a request or sending a response. The check expects an active Timeout value of 10 or lower in httpd.conf.
  rationale: A short timeout limits how long slow clients can hold connections open, which blunts slow-request denial of service.
  remediation: Set 'Timeout 10' in httpd.conf and restart httpd.
  compliance:
    nist_800_53:
    - SC-5
    - CM-6
    pci_dss:
    - 6.2.4
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.6
    - A.8.9
    soc_2:
    - CC6.6
    - CC6.7
    - CC7.1
    - CC8.1
    gdpr_IV:
    - IV_32.2
  condition: all
  rules:
  - f:$main-conf -> !r:^# && && r:timeout|Timeout && n:\s+(\d+) compare <= 10
- id: 68021
  title: 'KeepAlive: On (not Off)'
  description: KeepAlive lets a client send several requests over one TCP connection. The check fails when httpd.conf has an active 'KeepAlive Off' line.
  rationale: Reusing connections cuts connection setup work, so the server copes better with load and connection floods.
  remediation: Set 'KeepAlive On' in httpd.conf and restart httpd.
  compliance:
    nist_800_53:
    - SC-5
    - CM-6
    pci_dss:
    - 6.2.4
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.6
    - A.8.9
    soc_2:
    - CC6.6
    - CC6.7
    - CC7.1
    - CC8.1
    gdpr_IV:
    - IV_32.2
  condition: none
  rules:
  - f:$main-conf -> !r:^# && r:keepalive|KeepAlive && r:\s+off|\s+Off
- id: 68022
  title: 'MaxKeepAliveRequests: 100 or more'
  description: MaxKeepAliveRequests caps how many requests one persistent connection may carry. The check fails when httpd.conf sets a value below 100.
  rationale: A very low cap forces constant reconnects and wastes server resources; 100 or more keeps the benefit of persistent connections.
  remediation: Set 'MaxKeepAliveRequests 100' in httpd.conf and restart httpd.
  compliance:
    nist_800_53:
    - SC-5
    - CM-6
    pci_dss:
    - 6.2.4
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.6
    - A.8.9
    soc_2:
    - CC6.6
    - CC6.7
    - CC7.1
    - CC8.1
    gdpr_IV:
    - IV_32.2
  condition: none
  rules:
  - f:$main-conf -> !r:^# && r:maxkeepaliverequests|MaxKeepAliveRequests && n:\s+(\d+) compare < 100
- id: 68023
  title: 'KeepAliveTimeout: 15 seconds or less'
  description: KeepAliveTimeout sets how long an idle persistent connection waits for the next request. The check expects a value of 15 or lower in httpd.conf.
  rationale: Idle connections tie up workers; a short wait stops a client from holding them open cheaply.
  remediation: Set 'KeepAliveTimeout 15' in httpd.conf and restart httpd.
  compliance:
    nist_800_53:
    - SC-5
    - CM-6
    pci_dss:
    - 6.2.4
    hipaa:
