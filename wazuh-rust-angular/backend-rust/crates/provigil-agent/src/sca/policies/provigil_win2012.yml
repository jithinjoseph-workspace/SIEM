  description: Requires all Netlogon secure channel traffic between this computer and a domain controller to be either signed or encrypted.
  rationale: Protects authentication pass-through and account traffic from tampering and replay on the network.
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain member: Digitally encrypt or sign secure channel data (always) = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\RequireSignOrSeal (REG_DWORD) = 1.'
