[package]
name = "siem-agentd"
version = "0.1.0"
edition = "2021"
description = "Port of Wazuh 4.14.7 wazuh-agentd (src/client-agent)"

[[bin]]
name = "wazuh-agentd"
path = "src/bin/wazuh-agentd.rs"

[dependencies]
siem-log = { path = "../siem-log" }
siem-config = { path = "../siem-config" }
siem-crypto = { path = "../siem-crypto" }
siem-ipc = { path = "../siem-ipc" }
siem-fileop = { path = "../siem-fileop" }
siem-daemon = { path = "../siem-daemon" }
siem-cjson = { path = "../siem-cjson" }
siem-regex = { path = "../siem-regex" }
siem-xml = { path = "../siem-xml" }
chrono = "0.4"
flate2 = "1"
rand = "0.8"
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
