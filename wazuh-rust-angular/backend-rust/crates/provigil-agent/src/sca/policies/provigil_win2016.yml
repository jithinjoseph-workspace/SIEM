  description: Lists the exact registry keys that remote users may read through the remote registry service even when winreg access is otherwise restricted.
  rationale: Keeping the list to the standard keys stops remote users reading other configuration data.
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Remotely accessible registry paths = System\CurrentControlSet\Control\ProductOptions, System\CurrentControlSet\Control\Server Applications, Software\Microsoft\Windows NT\CurrentVersion. Registry: HKLM\SYSTEM\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedExactPaths\Machine (REG_MULTI_SZ).'
