- id: 78008
  title: 'Suspicious file ''.shell'' in the web root: none'
  description: Files named .shell inside a web tree are a known trace left by web shells and intrusion kits. The check fails when a file with this name exists under /var/www.
  rationale: A hidden file with this name in the web root usually holds a web shell or its output.
  remediation: Investigate any '.shell' file under /var/www (find /var/www -name '.shell'), treat the host as possibly compromised, remove the file and restore content from a trusted source.
  compliance:
