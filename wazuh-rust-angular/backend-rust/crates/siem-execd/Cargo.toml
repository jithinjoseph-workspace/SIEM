[package]
name = "siem-execd"
version = "0.1.0"
edition = "2021"
description = "Port of upstream 4.14.7 provigil-execd (src/os_execd): active responses, the timeout list and the com socket"

[[bin]]
name = "provigil-execd"
path = "src/bin/provigil-execd.rs"

[dependencies]
siem-log = { path = "../siem-log" }
siem-config = { path = "../siem-config" }
siem-ipc = { path = "../siem-ipc" }
siem-fileop = { package = "provigil-fileop", path = "../provigil-fileop" }
siem-daemon = { path = "../siem-daemon" }
siem-cjson = { path = "../siem-cjson" }
siem-regex = { package = "provigil-regex", path = "../provigil-regex" }
siem-xml = { path = "../siem-xml" }
flate2 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
tempfile = "3"
