- id: 69040
  title: 'TLS cipher suite order: only the eight ECDHE AES suites, in the listed order'
  description: 'The SSL Cipher Suite Order policy sets which suites Windows offers and in what order. The check expects the Functions value to equal exactly: ECDHE-ECDSA and ECDHE-RSA with AES-256-GCM-SHA384 and AES-128-GCM-SHA256, then the same with AES-256-CBC-SHA384 and AES-128-CBC-SHA256.'
  rationale: Offering only forward-secret AES suites, GCM first, prevents negotiation of weak or non-forward-secret ciphers.
  remediation: 'Group Policy: Computer Configuration > Administrative Templates > Network > SSL Configuration Settings > SSL Cipher Suite Order, enabled with the list TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384,TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256 (stored in HKLM\SOFTWARE\Policies\Microsoft\Cryptography\Configuration\SSL\00010002, value Functions); reboot.'
  compliance:
    nist_800_53:
    - SC-8
    - SC-13
    pci_dss:
    - 4.2.1
    hipaa:
    - 164.312(e)(1)
    - 164.312(e)(2)(ii)
    iso_27001:
    - A.8.24
    soc_2:
    - CC6.6
    - CC6.7
    gdpr_IV:
    - IV_32.2
  condition: all
  rules:
  - r:HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Cryptography\Configuration\SSL\00010002 -> Functions -> TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384,TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256.
