  description: Checks that the Group Policy client-side extension of the legacy Local Administrator Password Solution is registered, so the local administrator password can be managed.
  rationale: Without automatic management, local administrator passwords tend to be shared across machines and enable lateral movement.
  remediation: Install the legacy LAPS client (AdmPwd) on the server. It registers HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\GPExtensions\{D76B9641-3288-4f75-942D-087DE603E3EA} with a DllName value. On newer systems use Windows LAPS instead.
