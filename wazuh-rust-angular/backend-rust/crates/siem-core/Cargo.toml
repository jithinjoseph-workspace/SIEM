[package]
name = "siem-core"
version = "0.1.0"
edition = "2021"
description = "ProVigil shared types: alerts, events, agents, rules and console statistics"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
