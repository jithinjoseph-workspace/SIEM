- id: 64017
  title: 'Domain member: Maximum machine account password age: 30 days or fewer, but not 0'
  description: Sets how often the computer changes its computer account password. The check requires a value from 1 to 30 days.
  rationale: A short rotation interval reduces the window in which a captured machine password can be abused; 0 would stop rotation.
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain member: Maximum machine account password age = 30 or fewer days (not 0). Registry: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\MaximumPasswordAge (REG_DWORD) = 1-30.'
