  - r:HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Policies\System -> NoConnectedUser -> 3
- id: 61009
  title: 'Accounts: Guest account status: Disabled'
  description: Controls whether the built-in local Guest account (the account whose SID ends in -501) is enabled.
  rationale: The Guest account allows unauthenticated, anonymous-like access to the computer.
  remediation: 'Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\Security Options\Accounts: Guest account status = Disabled. Command: the built-in local account with SID ending -501 must be disabled (for example: Disable-LocalUser -SID <machine SID>-501, or net user Guest /active:no).'
  compliance:
    nist_800_53:
    - IA-2
    - IA-5
    pci_dss:
    - 8.3.1
    hipaa:
