[package]
name = "siem-shared"
version = "0.1.0"
edition = "2021"
description = "Port of Wazuh src/shared domain primitives (client.keys, version, scheduler, expression, formatter, labels, queues, validator, audit)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.40", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"
sha2 = "0.10"
rand = "0.8"
flate2 = "1.0"
quick-xml = { version = "0.36", features = ["serialize"] }

[dev-dependencies]
tempfile = "3"
