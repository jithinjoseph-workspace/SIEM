- id: 64050
  title: 'Network security: Do not store LAN Manager hash value on next password change: Enabled'
  description: Stops Windows from saving the weak LAN Manager hash of a password when the password is next changed.
  rationale: LM hashes can be cracked very quickly, so storing them undermines even strong passwords.
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network security: Do not store LAN Manager hash value on next password change = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\NoLMHash (REG_DWORD) = 1.'
