- id: 72017
  title: 'log_connections: on'
  description: log_connections writes a line for each connection attempt and successful authentication. The check expects SHOW log_connections to return on.
  rationale: Connection records are needed to trace who accessed the database and to spot brute force.
  remediation: ALTER SYSTEM SET log_connections = 'on'; SELECT pg_reload_conf();
  compliance:
