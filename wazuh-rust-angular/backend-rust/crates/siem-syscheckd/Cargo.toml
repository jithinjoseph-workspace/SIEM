[package]
name = "siem-syscheckd"
version = "0.1.0"
edition = "2021"
description = "Wazuh File Integrity Monitoring (FIM) daemon (wazuh-syscheckd) for integrity scans, real-time watcher, whodata, diff analysis, and registry tracking"

[dependencies]
siem-core = { path = "../siem-core" }
siem-wdb = { path = "../siem-wdb" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = { version = "0.36", features = ["serialize"] }
tokio = { version = "1.40", features = ["full"] }
sha1 = "0.10"
sha2 = "0.10"
tracing = "0.1"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"
