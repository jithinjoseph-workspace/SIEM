[package]
name = "siem-task-manager"
version = "0.1.0"
edition = "2021"
description = "Wazuh-compatible Task Management daemon (wm_task_manager) for remote agent upgrades and task lifecycle tracking"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
siem-core = { path = "../siem-core" }
