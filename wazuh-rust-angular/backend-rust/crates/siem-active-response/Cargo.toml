[package]
name = "siem-active-response"
version = "0.1.0"
edition = "2021"
description = "(src/active-response): netsh, restart-agent, firewall-drop"

[dependencies]
serde_json = "1"
chrono = "0.4"
sha2 = "0.10"
# YARA (pure Rust); the pe / dotnet / hash modules the YARA Forge rules use
boreal = { version = "1.4", features = ["object", "hash"] }
# the rules travel compressed + base64 (antivirus reads plain YARA strings as malware)
flate2 = "1"
base64 = "0.22"
# live-response lists with the same collectors as the agent
provigil-collect = { path = "../provigil-collect" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[[bin]]
name = "netsh"
path = "src/bin/netsh.rs"

[[bin]]
name = "restart-agent"
path = "src/bin/restart_agent.rs"

[[bin]]
name = "firewall-drop"
path = "src/bin/firewall_drop.rs"

[[bin]]
name = "route-null"
path = "src/bin/route_null.rs"

# EDR responses  Windows
[[bin]]
name = "kill-process"
path = "src/bin/kill_process.rs"

[[bin]]
name = "quarantine-file"
path = "src/bin/quarantine_file.rs"

[[bin]]
name = "isolate-host"
path = "src/bin/isolate_host.rs"

[[bin]]
name = "yara-scan"
path = "src/bin/yara_scan.rs"

[[bin]]
name = "live-response"
path = "src/bin/live_response.rs"

[[bin]]
name = "tamper-protect"
path = "src/bin/tamper_protect.rs"
