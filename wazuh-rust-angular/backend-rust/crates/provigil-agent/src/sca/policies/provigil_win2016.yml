  rationale: Null sessions give weak or no protection to the data exchanged.
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network security: Allow LocalSystem NULL session fallback = Disabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0\AllowNullSessionFallback (REG_DWORD) = 0.'
