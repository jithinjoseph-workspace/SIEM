[package]
name = "siem-parser-gen"
version = "0.1.0"
edition = "2021"
description = "Self-Learning AI Auto-Generated Reusable Parser Engine with Structural Fingerprinting & Rust Sandbox Validation"

[dependencies]
siem-core = { path = "../siem-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.40", features = ["full", "sync", "time"] }
