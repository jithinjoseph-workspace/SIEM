[package]
name = "siem-rootcheck"
version = "0.1.0"
edition = "2021"
description = "Wazuh-compatible rootkit detection and trojan binary signature verification engine"

[dependencies]
siem-core = { path = "../siem-core" }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
quick-xml = { version = "0.36", features = ["serialize"] }
