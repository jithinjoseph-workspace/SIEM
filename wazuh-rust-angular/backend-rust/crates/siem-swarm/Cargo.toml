[package]
name = "siem-swarm"
version = "0.1.0"
edition = "2021"
description = "Federated, privacy-preserving threat sharing between AETHER deployments: anonymous fingerprints (keyed hashes, differential-privacy counts, k-anonymity), never raw logs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
