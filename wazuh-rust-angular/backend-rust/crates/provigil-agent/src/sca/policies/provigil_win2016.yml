- id: 64009
  title: 'Domain controller: Allow vulnerable Netlogon secure channel connections: not configured'
  description: Lists accounts a domain controller still accepts over a Netlogon channel without secure RPC. The check requires that no allow list is configured.
  rationale: Any account on this list can bypass the protection added against Netlogon channel downgrade attacks.
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain controller: Allow vulnerable Netlogon secure channel connections: leave Not Defined. Delete HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\VulnerableChannelAllowList if present.'
