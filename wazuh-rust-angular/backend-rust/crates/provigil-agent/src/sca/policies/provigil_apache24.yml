- id: 68029
  title: 'LimitRequestBody: 102400 bytes or less'
  description: LimitRequestBody caps the size of a request body the server will accept. The check expects an active value of 102400 or lower in httpd.conf.
  rationale: A body limit keeps large uploads from filling disk or memory; raise it only in the locations that need uploads.
  remediation: Set 'LimitRequestBody 102400' in httpd.conf (and a larger value only in specific <Location> blocks that need it).
