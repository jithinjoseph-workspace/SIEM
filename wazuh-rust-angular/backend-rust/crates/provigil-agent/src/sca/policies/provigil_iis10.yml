    gdpr_IV:
    - IV_32.2
    - IV_35.7.d
  condition: all
  rules:
  - c:%systemroot%\system32\inetsrv\appcmd list config /section:requestfiltering -> n:maxUrl="(\d)" compare <= 4096
- id: 69017
  title: 'Request filtering maxQueryString: 2048 bytes or less'
  description: maxQueryString is the longest query string IIS accepts. The check expects the value to be 2048 or lower.
  rationale: Rejecting long query strings blocks oversized injection payloads and parser abuse.
  remediation: appcmd set config /section:requestfiltering /requestLimits.maxQueryString:2048
  compliance:
