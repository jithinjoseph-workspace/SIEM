  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\MSS (Legacy)\\MSS: (AutoAdminLogon) Enable Automatic Logon (not recommended) = Disabled. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\AutoAdminLogon (REG_SZ) = 0."
  compliance: { nist_800_53: ["IA-5", "SC-28", "AC-3"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(a)(2)(iv)", "164.312(d)"], iso_27001: ["A.5.17", "A.8.5"] }

S0174:
  title: "MSS: (DisableSavePassword) Prevent the dial-up password from being saved: Enabled"
  description: "When enabled, users cannot save passwords for dial-up and VPN connections."
  rationale: "Saved connection passwords can be stolen and used to reach the network from elsewhere."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\MSS (Legacy)\\MSS: (DisableSavePassword) Prevent the dial-up password from being saved = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\RasMan\\Parameters\\DisableSavePassword (REG_DWORD) = 1."
  compliance: { nist_800_53: ["IA-5", "SC-28", "AC-3"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(a)(2)(iv)", "164.312(d)"], iso_27001: ["A.5.17", "A.8.5"] }

S0175:
  title: "MSS: (EnableICMPRedirect) Allow ICMP redirects to override OSPF generated routes: Disabled"
  description: "Controls whether ICMP redirect messages can change the computer's routing table."
  rationale: "Forged ICMP redirects can send traffic through an attacker's machine."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\MSS (Legacy)\\MSS: (EnableICMPRedirect) Allow ICMP redirects to override OSPF generated routes = Disabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters\\EnableICMPRedirect (REG_DWORD) = 0."
  compliance: { nist_800_53: ["SC-7", "SC-5", "CM-7"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.312(e)(1)"], iso_27001: ["A.8.20", "A.8.21"] }

S0176:
  title: "MSS: (KeepAliveTime) How often keep-alive packets are sent: 300,000 milliseconds (5 minutes)"
  description: "Sets how often TCP checks that an idle connection is still alive."
  rationale: "A shorter interval clears dead and half-open connections sooner, limiting resource exhaustion."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\MSS (Legacy)\\MSS: (KeepAliveTime) How often keep-alive packets are sent in milliseconds = 300,000 or 5 minutes. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters\\KeepAliveTime (REG_DWORD) = 300000."
  compliance: { nist_800_53: ["SC-7", "SC-5", "CM-7"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.312(e)(1)"], iso_27001: ["A.8.20", "A.8.21"] }

S0177:
  title: "MSS: (NoNameReleaseOnDemand) Ignore NetBIOS name release requests except from WINS servers: Enabled"
  description: "When enabled, the computer ignores requests to give up its NetBIOS name unless they come from a WINS server."
  rationale: "This stops a simple denial-of-service attack that forces the computer to drop its name."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\MSS (Legacy)\\MSS: (NoNameReleaseOnDemand) Allow the computer to ignore NetBIOS name release requests except from WINS servers = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\NetBT\\Parameters\\NoNameReleaseOnDemand (REG_DWORD) = 1."
  compliance: { nist_800_53: ["SC-7", "SC-5", "CM-7"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.312(e)(1)"], iso_27001: ["A.8.20", "A.8.21"] }

S0178:
  title: "MSS: (PerformRouterDiscovery) Allow IRDP to detect and configure Default Gateway addresses: Disabled"
  description: "Controls whether the computer uses router discovery messages to set its default gateway."
  rationale: "Forged router advertisements could redirect all traffic through an attacker."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\MSS (Legacy)\\MSS: (PerformRouterDiscovery) Allow IRDP to detect and configure Default Gateway addresses = Disabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters\\PerformRouterDiscovery (REG_DWORD) = 0."
  compliance: { nist_800_53: ["SC-7", "SC-5", "CM-7"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.312(e)(1)"], iso_27001: ["A.8.20", "A.8.21"] }

S0179:
  title: "MSS: (SafeDllSearchMode) Enable Safe DLL search mode: Enabled"
  description: "When enabled, Windows searches system folders before the current folder when loading DLLs."
  rationale: "Safe search order makes it harder to trick a program into loading a malicious DLL."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\MSS (Legacy)\\MSS: (SafeDllSearchMode) Enable Safe DLL search mode = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\SafeDllSearchMode (REG_DWORD) = 1."
  compliance: { nist_800_53: ["SI-16", "SI-7", "SC-39"], pci_dss: ["2.2.6", "5.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: ["A.8.7", "A.8.9"] }

S0180:
  title: "MSS: (TcpMaxDataRetransmissions IPv6) How many times unacknowledged data is retransmitted: 3"
  description: "Sets how many times TCP over IPv6 resends unacknowledged data before giving up on a connection."
  rationale: "A low retry count frees resources held by dead connections sooner."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\MSS (Legacy)\\MSS: (TcpMaxDataRetransmissions IPv6) How many times unacknowledged data is retransmitted = 3. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\TCPIP6\\Parameters\\TcpMaxDataRetransmissions (REG_DWORD) = 3."
  compliance: { nist_800_53: ["SC-7", "SC-5", "CM-7"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.312(e)(1)"], iso_27001: ["A.8.20", "A.8.21"] }

S0181:
  title: "MSS: (TcpMaxDataRetransmissions) How many times unacknowledged data is retransmitted: 3"
  description: "Sets how many times TCP over IPv4 resends unacknowledged data before giving up on a connection."
  rationale: "A low retry count frees resources held by dead connections sooner."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\MSS (Legacy)\\MSS: (TcpMaxDataRetransmissions) How many times unacknowledged data is retransmitted = 3. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters\\TcpMaxDataRetransmissions (REG_DWORD) = 3."
  compliance: { nist_800_53: ["SC-7", "SC-5", "CM-7"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.312(e)(1)"], iso_27001: ["A.8.20", "A.8.21"] }

S0182:
  title: "Configure NetBIOS settings: Disable NetBIOS name resolution"
  description: "Controls whether the DNS client falls back to NetBIOS name resolution. The check also passes when the policy is not set."
  rationale: "NetBIOS name resolution can be spoofed to capture credentials on the local network."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Network\\DNS Client\\Configure NetBIOS settings = Enabled: Disable NetBIOS name resolution. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient\\EnableNetbios (REG_DWORD) = 0."
  compliance: { nist_800_53: ["SC-7", "SC-5", "CM-7"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.312(e)(1)"], iso_27001: ["A.8.20", "A.8.21"] }

S0183:
  title: "Turn off multicast name resolution: Enabled"
  description: "When enabled, the computer does not use Link-Local Multicast Name Resolution (LLMNR)."
  rationale: "LLMNR answers can be spoofed by anyone on the local network to capture credentials."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Network\\DNS Client\\Turn off multicast name resolution = Enabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient\\EnableMulticast (REG_DWORD) = 0."
  compliance: { nist_800_53: ["SC-7", "SC-5", "CM-7"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.312(e)(1)"], iso_27001: ["A.8.20", "A.8.21"] }

S0184:
  title: "Enable Font Providers: Disabled"
  description: "Controls whether Windows downloads fonts from online font providers."
  rationale: "Blocking online font downloads removes an outbound connection and a source of untrusted font files."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Network\\Fonts\\Enable Font Providers = Disabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\System\\EnableFontProviders (REG_DWORD) = 0."
  compliance: { nist_800_53: ["CM-7", "AC-4", "SC-7"], pci_dss: ["2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)", "164.312(e)(1)"], iso_27001: ["A.8.12", "A.5.34"] }

S0185:
  title: "Enable insecure guest logons: Disabled"
  description: "Controls whether the SMB client may connect to shares using unauthenticated guest access."
  rationale: "Guest access gives no identity checks and lets rogue servers serve malicious files."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Network\\Lanman Workstation\\Enable insecure guest logons = Disabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\LanmanWorkstation\\AllowInsecureGuestAuth (REG_DWORD) = 0."
  compliance: { nist_800_53: ["IA-2", "IA-5", "SC-8", "SC-13"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(d)", "164.312(e)(1)"], iso_27001: ["A.8.5", "A.8.24"] }

S0186:
  title: "Turn on Mapper I/O (LLTDIO) driver: Disabled"
  description: "Controls the network discovery driver that maps other devices on the local network. The check also passes when the policy is not set."
  rationale: "Network mapping traffic reveals details about the network and its devices."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Network\\Link-Layer Topology Discovery\\Turn on Mapper I/O (LLTDIO) driver = Disabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\LLTD\\EnableLLTDIO (REG_DWORD) = 0."
  compliance: { nist_800_53: ["SC-7", "SC-5", "CM-7"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.312(e)(1)"], iso_27001: ["A.8.20", "A.8.21"] }

S0187:
  title: "Turn on Responder (RSPNDR) driver: Disabled"
  description: "Controls the driver that lets this computer be discovered on network maps. The check also passes when the policy is not set."
  rationale: "Answering discovery requests exposes the computer to network reconnaissance."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Network\\Link-Layer Topology Discovery\\Turn on Responder (RSPNDR) driver = Disabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\LLTD\\EnableRspndr (REG_DWORD) = 0."
  compliance: { nist_800_53: ["SC-7", "SC-5", "CM-7"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.312(e)(1)"], iso_27001: ["A.8.20", "A.8.21"] }

S0188:
  title: "Turn off Microsoft Peer-to-Peer Networking Services: Enabled"
  description: "When enabled, peer-to-peer networking protocols are switched off."
  rationale: "Peer-to-peer services are seldom needed and widen the network attack surface."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Network\\Microsoft Peer-to-Peer Networking Services\\Turn off Microsoft Peer-to-Peer Networking Services = Enabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Peernet\\Disabled (REG_DWORD) = 1."
  compliance: { nist_800_53: ["SC-7", "SC-5", "CM-7"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.312(e)(1)"], iso_27001: ["A.8.20", "A.8.21"] }

S0189:
  title: "Prohibit installation and configuration of Network Bridge on your DNS domain network: Enabled"
  description: "When enabled, users cannot create a network bridge while connected to the domain network."
  rationale: "A bridge could join the corporate network to another network and bypass perimeter controls."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Network\\Network Connections\\Prohibit installation and configuration of Network Bridge on your DNS domain network = Enabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Network Connections\\NC_AllowNetBridge_NLA (REG_DWORD) = 0."
  compliance: { nist_800_53: ["SC-7", "SC-5", "CM-7"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.312(e)(1)"], iso_27001: ["A.8.20", "A.8.21"] }

S0190:
  title: "Prohibit use of Internet Connection Sharing on your DNS domain network: Enabled"
  description: "When enabled, users cannot share the computer's internet connection while on the domain network."
  rationale: "Connection sharing could let unmanaged devices reach the corporate network."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Network\\Network Connections\\Prohibit use of Internet Connection Sharing on your DNS domain network = Enabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Network Connections\\NC_ShowSharedAccessUI (REG_DWORD) = 0."
  compliance: { nist_800_53: ["SC-7", "SC-5", "CM-7"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.312(e)(1)"], iso_27001: ["A.8.20", "A.8.21"] }

S0191:
  title: "Require domain users to elevate when setting a network's location: Enabled"
  description: "When enabled, domain users must provide administrator rights to change a network's location type."
  rationale: "Changing a network to private can relax firewall rules, so it should need elevation."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Network\\Network Connections\\Require domain users to elevate when setting a network's location = Enabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Network Connections\\NC_StdDomainUserSetLocation (REG_DWORD) = 1."
  compliance: { nist_800_53: ["AC-6", "AC-6(2)", "AC-6(10)"], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.308(a)(4)(ii)(B)", "164.312(a)(1)"], iso_27001: ["A.8.2", "A.8.18"] }

S0192:
  title: "IPv6 components: all disabled (DisabledComponents = 255)"
  description: "Sets which IPv6 components are turned off. The value 255 (0xFF) disables all IPv6 components except the loopback interface."
  rationale: "Where IPv6 is not used and not monitored, turning it off removes an unmanaged network path."
  remediation: "Set Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\TCPIP6\\Parameters\\DisabledComponents (REG_DWORD) = 255 (0xFF). A restart is required."
  compliance: { nist_800_53: ["SC-7", "SC-5", "CM-7"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.312(e)(1)"], iso_27001: ["A.8.20", "A.8.21"] }

S0193:
  title: "Configuration of wireless settings using Windows Connect Now: Disabled"
  description: "Controls whether wireless settings can be set up with Windows Connect Now over UPnP, in-band 802.11, flash drives or portable devices."
  rationale: "Turning off these setup channels stops unauthorized wireless configuration of the computer."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Network\\Windows Connect Now\\Configuration of wireless settings using Windows Connect Now = Disabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WCN\\Registrars: EnableRegistrars, DisableUPnPRegistrar, DisableInBand802DOT11Registrar, DisableFlashConfigRegistrar and DisableWPDRegistrar (REG_DWORD) all = 0."
  compliance: { nist_800_53: ["SC-7", "SC-5", "CM-7"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.312(e)(1)"], iso_27001: ["A.8.20", "A.8.21"] }

S0194:
  title: "Prohibit access of the Windows Connect Now wizards: Enabled"
  description: "When enabled, the Windows Connect Now wizards cannot be opened."
  rationale: "Blocking the wizards stops users from changing wireless settings outside central management."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Network\\Windows Connect Now\\Prohibit access of the Windows Connect Now wizards = Enabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WCN\\UI\\DisableWcnUi (REG_DWORD) = 1."
  compliance: { nist_800_53: ["SC-7", "SC-5", "CM-7"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.312(e)(1)"], iso_27001: ["A.8.20", "A.8.21"] }

S0195:
  title: "Prohibit connection to non-domain networks when connected to domain authenticated network: Enabled"
  description: "When enabled, the computer cannot connect to another network while it is connected to the domain network."
  rationale: "Simultaneous connections could bridge the corporate network to an untrusted one."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Network\\Windows Connection Manager\\Prohibit connection to non-domain networks when connected to domain authenticated network = Enabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WcmSvc\\GroupPolicy\\fBlockNonDomain (REG_DWORD) = 1."
  compliance: { nist_800_53: ["SC-7", "SC-5", "CM-7"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.312(e)(1)"], iso_27001: ["A.8.20", "A.8.21"] }

S0196:
  title: "Allow Print Spooler to accept client connections: Disabled"
  description: "Controls whether the print spooler accepts connections from remote clients."
  rationale: "Blocking remote spooler connections removes a frequently exploited network entry point."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Printers\\Allow Print Spooler to accept client connections = Disabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\\RegisterSpoolerRemoteRpcEndPoint (REG_DWORD) = 2."
  compliance: { nist_800_53: ["CM-7", "AC-6", "SC-8"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: ["A.8.9", "A.8.20"] }

S0197:
  title: "Configure Redirection Guard: Enabled"
  description: "Turns on Redirection Guard, which stops the print spooler from following file system redirections such as junctions."
  rationale: "This blocks a class of privilege escalation attacks through the spooler."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Printers\\Configure Redirection Guard = Enabled: Redirection Guard Enabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\\RedirectionguardPolicy (REG_DWORD) = 1."
  compliance: { nist_800_53: ["CM-7", "AC-6", "SC-8"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: ["A.8.9", "A.8.20"] }

S0198:
  title: "Configure RPC connection settings: Protocol for outgoing RPC connections: RPC over named pipes (value 1)"
  description: "Sets which protocol the print client uses for outgoing RPC connections to print servers. The check expects RpcUseNamedPipeProtocol = 1."
  rationale: "Fixing the protocol keeps print client traffic predictable and matched to the server configuration."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Printers\\Configure RPC connection settings = Enabled, protocol as checked. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\\RpcUseNamedPipeProtocol (REG_DWORD) = 1."
  compliance: { nist_800_53: ["CM-7", "AC-6", "SC-8"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: ["A.8.9", "A.8.20"] }

S0199:
  title: "Configure RPC connection settings: Use authentication for outgoing RPC connections: Default"
  description: "Sets whether the print client authenticates outgoing RPC connections. Default lets Windows choose authenticated connections."
  rationale: "Authenticated print RPC prevents anonymous connections to print servers."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Printers\\Configure RPC connection settings = Enabled: Use authentication for outgoing RPC connections: Default. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\\RpcAuthentication (REG_DWORD) = 0."
  compliance: { nist_800_53: ["CM-7", "AC-6", "SC-8"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: ["A.8.9", "A.8.20"] }

S0200:
  title: "Configure RPC listener settings: Protocols to allow for incoming RPC connections: value 7"
  description: "Sets which protocols the print spooler listens on for incoming RPC. The check expects RpcProtocols = 7."
  rationale: "A defined set of listener protocols keeps incoming print RPC limited to what is expected."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Printers\\Configure RPC listener settings = Enabled with the protocol set matching value 7. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\\RpcProtocols (REG_DWORD) = 7."
  compliance: { nist_800_53: ["CM-7", "AC-6", "SC-8"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: ["A.8.9", "A.8.20"] }

S0201:
  title: "Configure RPC over TCP port: Enabled (port 0 to 65535)"
  description: "Sets the TCP port used for print RPC over TCP; 0 means a dynamic port. The check passes when a valid port number is configured."
  rationale: "A configured port lets the firewall be set up precisely for print RPC traffic."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Printers\\Configure RPC over TCP port = Enabled: 0 (or a fixed port). Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\\RpcTcpPort (REG_DWORD) = 0-65535."
  compliance: { nist_800_53: ["CM-7", "AC-6", "SC-8"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: ["A.8.9", "A.8.20"] }

S0202:
  title: "Print Spooler RPC packet privacy (RpcAuthnLevelPrivacyEnabled): Enabled"
  description: "Requires print client RPC connections to the spooler to use packet privacy (encryption). The check also passes when the value is absent, since current Windows enforces it by default."
  rationale: "Requiring packet privacy blocks print RPC relay and spoofing attacks."
  remediation: "Set Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Print\\RpcAuthnLevelPrivacyEnabled (REG_DWORD) = 1."
  compliance: { nist_800_53: ["CM-7", "AC-6", "SC-8"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: ["A.8.9", "A.8.20"] }

S0203:
  title: "Limits print driver installation to Administrators: value 0 or not configured"
  description: "Controls whether only administrators may install print drivers through Point and Print. The check passes when the value is absent or 0; when absent, current Windows allows only administrators."
  rationale: "Print drivers run with system rights, so their installation should be restricted to administrators."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Printers\\Limits print driver installation to Administrators. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\\PointAndPrint\\RestrictDriverInstallationToAdministrators (REG_DWORD) = 0 or remove the value."
  compliance: { nist_800_53: ["CM-7", "AC-6", "SC-8"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: ["A.8.9", "A.8.20"] }

S0204:
  title: "Manage processing of Queue-specific files: Limit Queue-specific files to Color profiles"
  description: "Controls which queue-specific files a print server may copy to the client; the expected setting allows only color profiles."
  rationale: "Blocking other queue-specific files stops a print server from pushing executable content to clients."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Printers\\Manage processing of Queue-specific files = Enabled: Limit Queue-specific files to Color profiles. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\\CopyFilesPolicy (REG_DWORD) = 1."
  compliance: { nist_800_53: ["CM-7", "AC-6", "SC-8"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: ["A.8.9", "A.8.20"] }

S0205:
  title: "Point and Print Restrictions: When installing drivers for a new connection: Show warning and elevation prompt"
  description: "Sets whether users see a warning and must elevate when Point and Print installs a driver for a new printer. The check also passes when the policy is not set."
  rationale: "An elevation prompt stops silent driver installation from rogue print servers."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Printers\\Point and Print Restrictions = Enabled: When installing drivers for a new connection: Show warning and elevation prompt. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\\PointAndPrint\\NoWarningNoElevationOnInstall (REG_DWORD) = 0."
  compliance: { nist_800_53: ["CM-7", "AC-6", "SC-8"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: ["A.8.9", "A.8.20"] }

S0206:
  title: "Point and Print Restrictions: When updating drivers for an existing connection: Show warning and elevation prompt"
  description: "Sets whether users see a warning and must elevate when Point and Print updates the driver of an existing printer."
  rationale: "An elevation prompt stops a compromised print server from silently replacing drivers."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Printers\\Point and Print Restrictions = Enabled: When updating drivers for an existing connection: Show warning and elevation prompt. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\\PointAndPrint\\UpdatePromptSettings (REG_DWORD) = 0."
  compliance: { nist_800_53: ["CM-7", "AC-6", "SC-8"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: ["A.8.9", "A.8.20"] }

S0207:
  title: "Turn off notifications network usage: Enabled"
  description: "When enabled, apps cannot use the Windows push notification service over the network."
  rationale: "This removes a standing outbound connection that hardened systems do not need."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\Start Menu and Taskbar\\Notifications\\Turn off notifications network usage = Enabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\CurrentVersion\\PushNotifications\\NoCloudApplicationNotification (REG_DWORD) = 1."
  compliance: { nist_800_53: ["CM-7", "AC-4", "SC-7"], pci_dss: ["2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)", "164.312(e)(1)"], iso_27001: ["A.8.12", "A.5.34"] }

S0208:
  title: "Include command line in process creation events: Enabled"
  description: "When enabled, process creation audit events also record the full command line."
  rationale: "Command lines show exactly what an attacker ran, which is vital in investigations."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\Audit Process Creation\\Include command line in process creation events = Enabled. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\Audit\\ProcessCreationIncludeCmdLine_Enabled (REG_DWORD) = 1."
  compliance: { nist_800_53: ["AU-2", "AU-12", "SI-7"], pci_dss: ["10.2.1", "10.2.1.7"], hipaa: ["164.312(b)", "164.312(c)(1)"], iso_27001: ["A.8.15", "A.8.16"] }

S0209:
  title: "Encryption Oracle Remediation: Force Updated Clients"
  description: "Sets how CredSSP (used by Remote Desktop) handles clients and servers that lack the CredSSP security update."
  rationale: "Forcing updated clients blocks a known attack that relays credentials through unpatched CredSSP."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\Credentials Delegation\\Encryption Oracle Remediation = Enabled: Force Updated Clients. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\CredSSP\\Parameters\\AllowEncryptionOracle (REG_DWORD) = 0."
  compliance: { nist_800_53: ["IA-2", "IA-5", "SC-8", "SC-13"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(d)", "164.312(e)(1)"], iso_27001: ["A.8.5", "A.8.24"] }

S0210:
  title: "Remote host allows delegation of non-exportable credentials: Enabled"
  description: "When enabled, the computer supports Restricted Admin and Remote Credential Guard, which avoid sending reusable credentials to remote hosts."
  rationale: "Keeping reusable credentials off remote hosts limits credential theft during remote administration."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\Credentials Delegation\\Remote host allows delegation of non-exportable credentials = Enabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\CredentialsDelegation\\AllowProtectedCreds (REG_DWORD) = 1."
  compliance: { nist_800_53: ["IA-5", "SC-28", "AC-3"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(a)(2)(iv)", "164.312(d)"], iso_27001: ["A.5.17", "A.8.5"] }

S0211:
  title: "Turn On Virtualization Based Security: Enabled"
  description: "Turns on virtualization-based security, which uses the hypervisor to isolate sensitive parts of Windows."
  rationale: "Isolation protects credentials and kernel code integrity even from code running with administrator rights."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\Device Guard\\Turn On Virtualization Based Security = Enabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\DeviceGuard\\EnableVirtualizationBasedSecurity (REG_DWORD) = 1."
  compliance: { nist_800_53: ["SI-16", "SI-7", "SC-39"], pci_dss: ["2.2.6", "5.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: ["A.8.7", "A.8.9"] }

S0212:
  title: "Turn On Virtualization Based Security: Select Platform Security Level: Secure Boot and DMA Protection"
  description: "Sets the platform protections required for virtualization-based security."
  rationale: "Requiring DMA protection as well as Secure Boot defends against direct memory access attacks on the isolated memory."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\Device Guard\\Turn On Virtualization Based Security = Enabled: Select Platform Security Level = Secure Boot and DMA Protection. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\DeviceGuard\\RequirePlatformSecurityFeatures (REG_DWORD) = 3."
  compliance: { nist_800_53: ["SI-16", "SI-7", "SC-39"], pci_dss: ["2.2.6", "5.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: ["A.8.7", "A.8.9"] }

S0213:
  title: "Turn On Virtualization Based Security: Virtualization Based Protection of Code Integrity: Enabled with UEFI lock"
  description: "Turns on hypervisor-protected code integrity (HVCI) and locks the setting in firmware."
  rationale: "HVCI stops unsigned or tampered kernel code from running; the UEFI lock prevents it being turned off remotely."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\Device Guard\\Turn On Virtualization Based Security = Enabled: Virtualization Based Protection of Code Integrity = Enabled with UEFI lock. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\DeviceGuard\\HypervisorEnforcedCodeIntegrity (REG_DWORD) = 1."
  compliance: { nist_800_53: ["SI-16", "SI-7", "SC-39"], pci_dss: ["2.2.6", "5.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: ["A.8.7", "A.8.9"] }

S0214:
  title: "Turn On Virtualization Based Security: Require UEFI Memory Attributes Table: Enabled"
  description: "Requires the firmware to provide the UEFI Memory Attributes Table before HVCI is turned on."
  rationale: "This ensures firmware memory is correctly marked so code integrity protection works as designed."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\Device Guard\\Turn On Virtualization Based Security = Enabled: Require UEFI Memory Attributes Table = checked. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\DeviceGuard\\HVCIMATRequired (REG_DWORD) = 1."
  compliance: { nist_800_53: ["SI-16", "SI-7", "SC-39"], pci_dss: ["2.2.6", "5.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: ["A.8.7", "A.8.9"] }

S0215:
  title: "Turn On Virtualization Based Security: Credential Guard Configuration: Enabled with UEFI lock"
  description: "Turns on Credential Guard, which isolates credential secrets in a protected environment, and locks it in firmware."
  rationale: "Credential Guard stops tools that dump password hashes and Kerberos tickets from memory."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\Device Guard\\Turn On Virtualization Based Security = Enabled: Credential Guard Configuration = Enabled with UEFI lock. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\DeviceGuard\\LsaCfgFlags (REG_DWORD) = 1."
  compliance: { nist_800_53: ["IA-5", "SC-28", "AC-3"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(a)(2)(iv)", "164.312(d)"], iso_27001: ["A.5.17", "A.8.5"] }

S0216:
  title: "Prevent installation of devices that match any of these device IDs: Enabled with at least one ID"
  description: "Blocks installation of devices whose hardware IDs are listed. The check expects the deny list to contain at least one entry."
  rationale: "Blocking known risky devices, such as certain storage or network adapters, reduces data loss and attack paths."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\Device Installation\\Device Installation Restrictions\\Prevent installation of devices that match any of these device IDs = Enabled, with the IDs to block. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\DeviceInstall\\Restrictions\\DenyDeviceIDs (REG_DWORD) = 1 and values 1, 2, ... under HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\DeviceInstall\\Restrictions\\DenyDeviceIDs."
  compliance: { nist_800_53: ["MP-7", "CM-7", "SC-41"], pci_dss: ["2.2.6"], hipaa: ["164.310(d)(1)"], iso_27001: ["A.7.10", "A.8.1"] }

S0217:
  title: "Prevent installation of devices using drivers that match these device setup classes: Enabled with at least one class"
  description: "Blocks installation of devices in the listed setup classes. The check expects the deny list to contain at least one class GUID."
  rationale: "Blocking whole device classes, such as IEEE 1394, closes physical attack paths."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\Device Installation\\Device Installation Restrictions\\Prevent installation of devices using drivers that match these device setup classes = Enabled, with the classes to block. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\DeviceInstall\\Restrictions\\DenyDeviceClasses (REG_DWORD) = 1 and values 1, 2, ... under HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\DeviceInstall\\Restrictions\\DenyDeviceClasses."
  compliance: { nist_800_53: ["MP-7", "CM-7", "SC-41"], pci_dss: ["2.2.6"], hipaa: ["164.310(d)(1)"], iso_27001: ["A.7.10", "A.8.1"] }

S0218:
  title: "Prevent device metadata retrieval from the Internet: Enabled"
  description: "When enabled, Windows does not download device metadata such as icons and descriptions from the internet."
  rationale: "Fewer automatic downloads mean fewer outbound connections and less untrusted content."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\Device Installation\\Prevent device metadata retrieval from the Internet = Enabled. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Device Metadata\\PreventDeviceMetadataFromNetwork (REG_DWORD) = 1."
  compliance: { nist_800_53: ["CM-7", "AC-4", "SC-7"], pci_dss: ["2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)", "164.312(e)(1)"], iso_27001: ["A.8.12", "A.5.34"] }

S0219:
  title: "Boot-Start Driver Initialization Policy: Good, unknown and bad but critical"
  description: "Sets which boot-start drivers Windows loads based on the Early Launch Antimalware classification."
  rationale: "Not loading drivers flagged as bad (unless critical to boot) stops boot-level malware."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\Early Launch Antimalware\\Boot-Start Driver Initialization Policy = Enabled: Good, unknown and bad but critical. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Policies\\EarlyLaunch\\DriverLoadPolicy (REG_DWORD) = 3."
  compliance: { nist_800_53: ["SI-16", "SI-7", "SC-39"], pci_dss: ["2.2.6", "5.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: ["A.8.7", "A.8.9"] }

S0220:
  title: "Configure registry policy processing: Do not apply during periodic background processing: unchecked"
  description: "Controls whether registry-based Group Policy settings are also reapplied during background refresh."
  rationale: "Background reapplication restores settings that were changed locally without waiting for a restart."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\Group Policy\\Configure registry policy processing = Enabled: Do not apply during periodic background processing = unchecked. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Group Policy\\{35378EAC-683F-11D2-A89A-00C04FBBCFA2}\\NoBackgroundPolicy (REG_DWORD) = 0."
  compliance: { nist_800_53: ["CM-6", "CM-2"], pci_dss: ["2.2.1", "2.2.6"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: ["A.8.9"] }

S0221:
  title: "Configure registry policy processing: Process even if the Group Policy objects have not changed: checked"
  description: "Controls whether registry-based settings are reapplied even when the policy objects have not changed."
  rationale: "Reapplying unchanged policy undoes unauthorized local changes to managed settings."
  remediation: "Group Policy: Computer Configuration\\Policies\\Administrative Templates\\System\\Group Policy\\Configure registry policy processing = Enabled: Process even if the Group Policy objects have not changed = checked. Registry: HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Group Policy\\{35378EAC-683F-11D2-A89A-00C04FBBCFA2}\\NoGPOListChanges (REG_DWORD) = 0."
  compliance: { nist_800_53: ["CM-6", "CM-2"], pci_dss: ["2.2.1", "2.2.6"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: ["A.8.9"] }

