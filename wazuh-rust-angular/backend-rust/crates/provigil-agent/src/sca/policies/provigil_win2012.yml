- id: 62171
  title: 'Hardened UNC Paths: NETLOGON and SYSVOL require mutual authentication and integrity'
  description: Requires mutual authentication and integrity whenever the computer connects to the NETLOGON and SYSVOL shares of any server.
  rationale: Group Policy and logon scripts come from these shares; hardening them prevents a spoofed server from delivering malicious policy.
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Network Provider > Hardened UNC Paths = Enabled with \\*\NETLOGON and \\*\SYSVOL set to RequireMutualAuthentication=1, RequireIntegrity=1. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths (REG_SZ values).'
