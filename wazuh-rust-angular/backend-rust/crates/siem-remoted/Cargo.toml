[package]
name = "siem-remoted"
version = "0.1.0"
edition = "2021"
description = "Port of wazuh-remoted: the agent communication daemon (Wazuh wire protocol on 1514)"

[dependencies]
siem-crypto = { path = "../siem-crypto" }
siem-regex = { path = "../siem-regex" }
siem-xml = { path = "../siem-xml" }
siem-config = { path = "../siem-config" }
siem-ipc = { path = "../siem-ipc" }
siem-fileop = { path = "../siem-fileop" }
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.10"
sha2 = "0.10"
rand = "0.8"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "wazuh-remoted"
path = "src/main.rs"
