- id: 64045
  title: 'Network access: Sharing and security model for local accounts: Classic'
  description: Classic means network sign-ins with local accounts authenticate as themselves; Guest only maps them all to the Guest account.
  rationale: The classic model keeps per-account permissions effective for network access.
  remediation: 'Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\Security Options\Network access: Sharing and security model for local accounts = Classic - local users authenticate as themselves. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\ForceGuest (REG_DWORD) = 0.'
