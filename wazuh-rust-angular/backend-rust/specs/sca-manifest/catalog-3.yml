# ProVigil configuration-assessment text for settings S0501-S0828 (catalog part 3).
# Written in our own words from Microsoft's public Group Policy and security policy documentation.

S0501:
  title: "Domain controller: Allow vulnerable Netlogon secure channel connections: not configured"
  description: "Lists accounts that a domain controller will still accept over a Netlogon secure channel that does not use secure RPC. The check passes when no allow list value is present."
  rationale: "Any account on this list can bypass the protection added against Netlogon channel downgrade attacks, so the list should stay empty."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain controller: Allow vulnerable Netlogon secure channel connections: leave Not Defined. Delete HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\VulnerableChannelAllowList if present.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0502:
  title: "Domain controller: LDAP server channel binding token requirements: Always"
  description: "Controls whether a domain controller requires LDAP clients connecting over TLS to supply a channel binding token. Value 2 requires the token from every client."
  rationale: "Channel binding ties the LDAP authentication to the TLS session and blocks relaying of captured credentials to LDAPS."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain controller: LDAP server channel binding token requirements = Always. Registry: HKLM\SYSTEM\CurrentControlSet\Services\NTDS\Parameters\LdapEnforceChannelBinding (REG_DWORD) = 2.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0503:
  title: "Domain controller: LDAP server signing requirements: Require signing"
  description: "Defines whether the domain controller insists on signed LDAP binds. Value 2 rejects unsigned simple and SASL binds that are not protected by TLS."
  rationale: "Unsigned LDAP traffic can be modified or relayed in transit; requiring signing protects directory queries and changes."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain controller: LDAP server signing requirements = Require signing. Registry: HKLM\SYSTEM\CurrentControlSet\Services\NTDS\Parameters\LDAPServerIntegrity (REG_DWORD) = 2.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0504:
  title: "Domain controller: Refuse machine account password changes: Disabled"
  description: "When enabled, the domain controller refuses requests from domain members to change their computer account password. The check passes when the value is absent or 0."
  rationale: "Computer account passwords must rotate regularly; refusing changes leaves long-lived machine secrets that are easier to crack or reuse."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain controller: Refuse machine account password changes = Disabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\RefusePasswordChange (REG_DWORD) = 0.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0505:
  title: "Domain member: Digitally encrypt or sign secure channel data (always): Enabled"
  description: "Requires all Netlogon secure channel traffic between this computer and a domain controller to be either signed or encrypted."
  rationale: "Protects authentication pass-through and account traffic from tampering and replay on the network."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain member: Digitally encrypt or sign secure channel data (always) = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\RequireSignOrSeal (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0506:
  title: "Domain member: Digitally encrypt secure channel data (when possible): Enabled"
  description: "Makes the computer encrypt Netlogon secure channel traffic whenever the domain controller supports it."
  rationale: "Encryption keeps credential-related secure channel data confidential on the wire."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain member: Digitally encrypt secure channel data (when possible) = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\SealSecureChannel (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0507:
  title: "Domain member: Digitally sign secure channel data (when possible): Enabled"
  description: "Makes the computer sign Netlogon secure channel traffic whenever the domain controller supports it."
  rationale: "Signing lets each side detect modified or replayed secure channel messages."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain member: Digitally sign secure channel data (when possible) = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\SignSecureChannel (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0508:
  title: "Domain member: Disable machine account password changes: Disabled"
  description: "Controls whether the computer periodically changes its own computer account password in the domain. Value 0 keeps automatic changes on."
  rationale: "Regularly rotated machine passwords limit the time a stolen computer account secret stays useful."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain member: Disable machine account password changes = Disabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\DisablePasswordChange (REG_DWORD) = 0.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0509:
  title: "Domain member: Maximum machine account password age: 30 days or fewer, but not 0"
  description: "Sets how often the computer changes its computer account password. The check requires a value from 1 to 30 days."
  rationale: "A short rotation interval reduces the window in which a captured machine password can be abused; 0 would stop rotation."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain member: Maximum machine account password age = 30 or fewer days (not 0). Registry: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\MaximumPasswordAge (REG_DWORD) = 1-30.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0510:
  title: "Domain member: Require strong (Windows 2000 or later) session key: Enabled"
  description: "Requires a 128-bit session key for the Netlogon secure channel; the computer will not set up a channel with a weaker key."
  rationale: "Strong session keys make the secure channel resistant to key-recovery and hijacking attacks."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain member: Require strong (Windows 2000 or later) session key = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\RequireStrongKey (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0511:
  title: "Interactive logon: Message text for users attempting to log on: configured"
  description: "Shows a text notice to everyone before they sign in. The check passes when the message text contains text."
  rationale: "A logon notice informs users of acceptable use and monitoring, which supports legal action against misuse."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Interactive logon: Message text for users attempting to log on = your organisation notice. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LegalNoticeText (REG_SZ) = non-empty text.'
  compliance: { nist_800_53: [AC-8], pci_dss: ["12.6.1"], hipaa: ["164.308(a)(5)(ii)(A)"], iso_27001: [A.5.10] }
S0512:
  title: "Interactive logon: Message title for users attempting to log on: configured"
  description: "Sets the title of the notice window shown before sign-in. The check passes when a title is present."
  rationale: "A titled notice makes the acceptable-use warning clear and consistent across systems."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Interactive logon: Message title for users attempting to log on = your notice title. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LegalNoticeCaption (REG_SZ) = non-empty text.'
  compliance: { nist_800_53: [AC-8], pci_dss: ["12.6.1"], hipaa: ["164.308(a)(5)(ii)(A)"], iso_27001: [A.5.10] }
S0513:
  title: "Interactive logon: Prompt user to change password before expiration: between 5 and 14 days"
  description: "Sets how many days before a password expires the user starts receiving change reminders. The check requires 5 to 14 days."
  rationale: "Early reminders let users choose a new password in good time instead of being locked out or picking a weak one in a hurry."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Interactive logon: Prompt user to change password before expiration = 5 to 14 days. Registry: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\PasswordExpiryWarning (REG_DWORD) = 5-14.'
  compliance: { nist_800_53: [IA-5], pci_dss: ["8.3.6", "8.3.9"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: [A.5.17] }
S0514:
  title: "Interactive logon: Require Domain Controller authentication to unlock workstation: Enabled"
  description: "Forces a domain controller check of the account before a locked session can be unlocked, instead of relying on cached credentials."
  rationale: "Disabled or changed accounts cannot keep unlocking a session with an old cached password."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Interactive logon: Require Domain Controller authentication to unlock workstation = Enabled. Registry: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\ForceUnlockLogon (REG_DWORD) = 1.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0515:
  title: "Microsoft network client: Digitally sign communications (if server agrees): Enabled"
  description: "Lets the SMB client sign its packets whenever the server supports signing."
  rationale: "SMB signing detects tampering and blocks many SMB relay attacks."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Microsoft network client: Digitally sign communications (if server agrees) = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters\EnableSecuritySignature (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0516:
  title: "Microsoft network client: Send unencrypted password to third-party SMB servers: Disabled"
  description: "Controls whether the SMB client may send a clear-text password to servers that do not support password encryption."
  rationale: "Clear-text passwords on the network can be captured by anyone able to observe the traffic."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Microsoft network client: Send unencrypted password to third-party SMB servers = Disabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters\EnablePlainTextPassword (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0517:
  title: "Microsoft network server: Amount of idle time required before suspending session: 15 minutes or fewer, but not 0"
  description: "Sets how many minutes an SMB session may stay idle before the server suspends it. The check requires 1 to 15 minutes."
  rationale: "Closing idle sessions frees server resources and shortens the time an unattended session can be misused."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Microsoft network server: Amount of idle time required before suspending session = 1 to 15 minutes. Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\AutoDisconnect (REG_DWORD) = 1-15.'
  compliance: { nist_800_53: [AC-11, AC-12], pci_dss: ["8.2.8"], hipaa: ["164.312(a)(2)(iii)"], iso_27001: [A.8.5] }
S0518:
  title: "Disconnect SMB clients when logon hours expire: Enabled (EnableForcedLogOff = 1 under LanmanWorkstation)"
  description: "Ends SMB sessions of users whose permitted logon hours have run out. This check reads the EnableForcedLogOff value under the LanmanWorkstation service key."
  rationale: "Users should not keep network file access outside the hours their account allows."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Microsoft network server: Disconnect clients when logon hours expire = Enabled. The check reads HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters\EnableForcedLogOff (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-11, AC-12], pci_dss: ["8.2.8"], hipaa: ["164.312(a)(2)(iii)"], iso_27001: [A.8.5] }
S0519:
  title: "Microsoft network server: Server SPN target name validation level: Accept if provided by client or higher"
  description: "Controls how strictly the SMB server checks the service principal name the client presents. The check requires level 1 or higher."
  rationale: "Validating the target name helps stop SMB relay attacks against the server."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Microsoft network server: Server SPN target name validation level = Accept if provided by client (or Required from client). Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\SMBServerNameHardeningLevel (REG_DWORD) >= 1.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0520:
  title: "Network access: Allow anonymous SID/Name translation: Disabled"
  description: "Determines whether an anonymous user can translate security identifiers to account names, for example to find the built-in Administrator name. The check expects TurnOffAnonymousBlock = 0."
  rationale: "Blocking anonymous name lookups denies attackers an easy way to learn account names."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Allow anonymous SID/Name translation = Disabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\TurnOffAnonymousBlock (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0521:
  title: "Network access: Do not allow anonymous enumeration of SAM accounts: Enabled"
  description: "Stops anonymous connections from listing the accounts held in the local Security Accounts Manager."
  rationale: "Account lists help attackers plan password guessing and social engineering."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Do not allow anonymous enumeration of SAM accounts = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RestrictAnonymousSAM (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0522:
  title: "Network access: Do not allow anonymous enumeration of SAM accounts and shares: Enabled"
  description: "Stops anonymous connections from listing both local accounts and network share names."
  rationale: "Hiding accounts and shares from anonymous users removes reconnaissance data an attacker would otherwise collect for free."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Do not allow anonymous enumeration of SAM accounts and shares = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RestrictAnonymous (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0523:
  title: "Network access: Do not allow storage of passwords and credentials for network authentication: Enabled"
  description: "Prevents Credential Manager from saving domain passwords and credentials for later network authentication."
  rationale: "Saved credentials can be extracted by malware or anyone who gains control of the session."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Do not allow storage of passwords and credentials for network authentication = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\DisableDomainCreds (REG_DWORD) = 1.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0524:
  title: "Network access: Let Everyone permissions apply to anonymous users: Disabled"
  description: "Controls whether anonymous connections receive the permissions granted to the Everyone group."
  rationale: "Keeping anonymous users out of Everyone stops unauthenticated access to resources that were opened to all signed-in users."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Let Everyone permissions apply to anonymous users = Disabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\EveryoneIncludesAnonymous (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0525:
  title: "Network access: Named Pipes that can be accessed anonymously (domain controller): includes LSARPC, NETLOGON, SAMR"
  description: "Lists the named pipes an anonymous session may open. On a domain controller the list must contain LSARPC, NETLOGON and SAMR, which older clients need."
  rationale: "Limiting anonymous pipes to the ones domain services require keeps other RPC interfaces closed to unauthenticated users."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Named Pipes that can be accessed anonymously = LSARPC, NETLOGON, SAMR (plus BROWSER only if needed). Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\NullSessionPipes (REG_MULTI_SZ).'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0526:
  title: "Network access: Named Pipes that can be accessed anonymously (member server): None"
  description: "Lists the named pipes an anonymous session may open. On a member server no pipes should be listed."
  rationale: "Every anonymously reachable pipe is an unauthenticated entry point; member servers do not need any."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Named Pipes that can be accessed anonymously = blank. Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\NullSessionPipes (REG_MULTI_SZ) = empty.'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0527:
  title: "Network access: Remotely accessible registry paths: ProductOptions, Server Applications, Windows NT CurrentVersion"
  description: "Lists the exact registry keys that remote users may read through the remote registry service even when winreg access is otherwise restricted."
  rationale: "Keeping the list to the standard keys stops remote users reading other configuration data."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Remotely accessible registry paths = System\CurrentControlSet\Control\ProductOptions, System\CurrentControlSet\Control\Server Applications, Software\Microsoft\Windows NT\CurrentVersion. Registry: HKLM\SYSTEM\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedExactPaths\Machine (REG_MULTI_SZ).'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0528:
  title: "Network access: Remotely accessible registry paths and subpaths: standard list only"
  description: "Lists registry keys, and everything under them, that remote users may read through the remote registry service. The expected list covers print, event log, OLAP, content index, Terminal Server, Perflib, SysmonLog, CertSvc and WINS paths."
  rationale: "Keeping the list to the documented defaults avoids exposing extra configuration to remote readers."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Remotely accessible registry paths and subpaths = the standard list (Print, Windows, Printers, Eventlog, OLAP Server, ContentIndex, Terminal Server, UserConfig, DefaultUserConfiguration, Perflib, SysmonLog, CertSvc, WINS). Registry: HKLM\SYSTEM\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedPaths\Machine (REG_MULTI_SZ).'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0529:
  title: "Network access: Restrict anonymous access to Named Pipes and Shares: Enabled"
  description: "Limits anonymous access to only the pipes and shares named in the anonymous pipe and share lists."
  rationale: "Without this restriction, unauthenticated users may reach pipes and shares that were never meant to be public."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Restrict anonymous access to Named Pipes and Shares = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\RestrictNullSessAccess (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0530:
  title: "Network access: Restrict clients allowed to make remote calls to SAM: Administrators only"
  description: "Sets the security descriptor that decides who may query the local Security Accounts Manager over RPC. The expected descriptor O:BAG:BAD:(A;;RC;;;BA) grants remote access to Administrators only."
  rationale: "Restricting remote SAM queries stops ordinary users from enumerating local accounts and groups for lateral movement planning."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Restrict clients allowed to make remote calls to SAM = Administrators: Remote Access: Allow. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RestrictRemoteSAM (REG_SZ) = O:BAG:BAD:(A;;RC;;;BA).'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0531:
  title: "Network access: Shares that can be accessed anonymously: None"
  description: "Lists the network shares an anonymous session may open. The check passes when the value is absent or empty."
  rationale: "Any share listed here is readable without authentication."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Shares that can be accessed anonymously = blank. Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\NullSessionShares (REG_MULTI_SZ) = empty.'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0532:
  title: "Network security: Allow Local System to use computer identity for NTLM: Enabled"
  description: "Lets services running as Local System authenticate with the computer account when they use NTLM, instead of falling back to an anonymous session."
  rationale: "Using the computer identity avoids anonymous NTLM sessions that cannot be tied to a specific system."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network security: Allow Local System to use computer identity for NTLM = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\UseMachineId (REG_DWORD) = 1.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0533:
  title: "Network security: Do not store LAN Manager hash value on next password change: Enabled"
  description: "Stops Windows from saving the weak LAN Manager hash of a password when the password is next changed."
  rationale: "LM hashes can be cracked very quickly, so storing them undermines even strong passwords."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network security: Do not store LAN Manager hash value on next password change = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\NoLMHash (REG_DWORD) = 1.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0534:
  title: "Microsoft network server: Disconnect clients when logon hours expire: Enabled"
  description: "Ends SMB server sessions of users whose permitted logon hours have run out."
  rationale: "Users should not keep network file access outside the hours their account allows."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Microsoft network server: Disconnect clients when logon hours expire = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\EnableForcedLogOff (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-11, AC-12], pci_dss: ["8.2.8"], hipaa: ["164.312(a)(2)(iii)"], iso_27001: [A.8.5] }
S0535:
  title: "Network security: LDAP client signing requirements: Negotiate signing or higher"
  description: "Sets whether LDAP requests from this computer are signed. The check requires value 1 (negotiate) or higher."
  rationale: "Signed LDAP traffic cannot be silently altered or relayed by an attacker in the middle."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network security: LDAP client signing requirements = Negotiate signing (or Require signing). Registry: HKLM\SYSTEM\CurrentControlSet\Services\LDAP\LDAPClientIntegrity (REG_DWORD) >= 1.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0536:
  title: "Shutdown: Allow system to be shut down without having to log on: Disabled"
  description: "Controls whether the Shut Down command is offered on the sign-in screen to people who have not signed in."
  rationale: "Only authenticated, authorised users should be able to take a server offline."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Shutdown: Allow system to be shut down without having to log on = Disabled. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ShutdownWithoutLogon (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-6], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.312(a)(1)"], iso_27001: [A.8.2] }
S0537:
  title: "System objects: Require case insensitivity for non-Windows subsystems: Enabled"
  description: "Makes object names case-insensitive for all subsystems, not only the Windows subsystem."
  rationale: "Case-sensitive names would let two objects differ only by case, which can trick users and tools into opening the wrong one."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > System objects: Require case insensitivity for non-Windows subsystems = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Kernel\ObCaseInsensitive (REG_DWORD) = 1.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0538:
  title: "System objects: Strengthen default permissions of internal system objects: Enabled"
  description: "Tightens the default access control on shared kernel objects such as symbolic links and devices so ordinary users can read but not change them."
  rationale: "Stronger defaults stop non-administrators from tampering with objects that other processes depend on."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > System objects: Strengthen default permissions of internal system objects (e.g. Symbolic Links) = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\ProtectionMode (REG_DWORD) = 1.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0539:
  title: "System settings: Optional subsystems: none listed"
  description: "Lists the optional subsystems Windows may start on demand, such as the old POSIX subsystem. The check requires the value to exist and be empty."
  rationale: "Unused subsystems widen the attack surface and can run processes outside normal Windows controls."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > System settings: Optional subsystems = blank. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\SubSystems\Optional (REG_MULTI_SZ) = empty.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0540:
  title: "User Account Control: Only elevate UIAccess applications that are installed in secure locations: Enabled"
  description: "Allows applications that request UIAccess to run with that right only if they live in protected folders such as Program Files or System32."
  rationale: "UIAccess programs can drive other windows, including elevation prompts; restricting their location prevents a user-writable copy from abusing that power."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > User Account Control: Only elevate UIAccess applications that are installed in secure locations = Enabled. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableSecureUIAPaths (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-6], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.312(a)(1)"], iso_27001: [A.8.2] }
S0541:
  title: "User Account Control: Run all administrators in Admin Approval Mode: Enabled"
  description: "Turns User Account Control on, so administrators work with a standard token and must approve each elevation."
  rationale: "Without it, every program an administrator runs gets full rights, letting malware take over silently."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > User Account Control: Run all administrators in Admin Approval Mode = Enabled. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableLUA (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-6], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.312(a)(1)"], iso_27001: [A.8.2] }
S0542:
  title: "User Account Control: Switch to the secure desktop when prompting for elevation: Enabled"
  description: "Shows elevation prompts on the isolated secure desktop where only Windows processes can run."
  rationale: "Other programs cannot fake or click through a prompt shown on the secure desktop."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > User Account Control: Switch to the secure desktop when prompting for elevation = Enabled. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\PromptOnSecureDesktop (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-6], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.312(a)(1)"], iso_27001: [A.8.2] }
S0543:
  title: "User Account Control: Virtualize file and registry write failures to per-user locations: Enabled"
  description: "Redirects writes by older applications to protected system locations into per-user folders and registry keys."
  rationale: "Legacy software keeps working under a standard token instead of needing to run as administrator."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > User Account Control: Virtualize file and registry write failures to per-user locations = Enabled. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableVirtualization (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-6], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.312(a)(1)"], iso_27001: [A.8.2] }
S0544:
  title: "Windows Firewall: Domain profile firewall state: On"
  description: "Turns the host firewall on for network connections that belong to the domain profile."
  rationale: "A running host firewall filters unwanted traffic even inside the corporate network."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Windows Defender Firewall with Advanced Security > Properties > Domain Profile > Firewall state = On. Registry: HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\EnableFirewall (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-7], pci_dss: ["1.5.1"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0545:
  title: "Windows Firewall: Domain profile inbound connections: Block"
  description: "Blocks inbound connections on the domain profile unless a rule allows them."
  rationale: "Default-deny inbound filtering means only services that are explicitly allowed can be reached."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Windows Defender Firewall with Advanced Security > Properties > Domain Profile > Inbound connections = Block (default). Registry: HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\DefaultInboundAction (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-7], pci_dss: ["1.5.1"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0546:
  title: "Windows Firewall: Domain profile outbound connections: Allow"
  description: "Allows outbound connections on the domain profile unless a rule blocks them."
  rationale: "Allowing outbound traffic by default keeps normal operation working while inbound traffic stays restricted."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Windows Defender Firewall with Advanced Security > Properties > Domain Profile > Outbound connections = Allow (default). Registry: HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\DefaultOutboundAction (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SC-7], pci_dss: ["1.5.1"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0547:
  title: "Windows Firewall: Private profile firewall state: On"
  description: "Turns the host firewall on for network connections that belong to the private profile."
  rationale: "Private networks can still carry hostile devices, so the firewall must stay on."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Windows Defender Firewall with Advanced Security > Properties > Private Profile > Firewall state = On. Registry: HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile\EnableFirewall (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-7], pci_dss: ["1.5.1"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0548:
  title: "Windows Firewall: Private profile inbound connections: Block"
  description: "Blocks inbound connections on the private profile unless a rule allows them."
  rationale: "Default-deny inbound filtering limits what other devices on the network can reach."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Windows Defender Firewall with Advanced Security > Properties > Private Profile > Inbound connections = Block (default). Registry: HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile\DefaultInboundAction (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-7], pci_dss: ["1.5.1"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0549:
  title: "Windows Firewall: Private profile outbound connections: Allow"
  description: "Allows outbound connections on the private profile unless a rule blocks them."
  rationale: "Allowing outbound traffic by default keeps normal operation working while inbound traffic stays restricted."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Windows Defender Firewall with Advanced Security > Properties > Private Profile > Outbound connections = Allow (default). Registry: HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile\DefaultOutboundAction (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SC-7], pci_dss: ["1.5.1"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0550:
  title: "Windows Firewall: Public profile firewall state: On"
  description: "Turns the host firewall on for network connections that belong to the public profile."
  rationale: "Public networks are untrusted, so the firewall must be active there."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Windows Defender Firewall with Advanced Security > Properties > Public Profile > Firewall state = On. Registry: HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile\EnableFirewall (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-7], pci_dss: ["1.5.1"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0551:
  title: "Windows Firewall: Public profile inbound connections: Block"
  description: "Blocks inbound connections on the public profile unless a rule allows them."
  rationale: "Default-deny inbound filtering on untrusted networks keeps services hidden from other devices."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Windows Defender Firewall with Advanced Security > Properties > Public Profile > Inbound connections = Block (default). Registry: HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile\DefaultInboundAction (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-7], pci_dss: ["1.5.1"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0552:
  title: "Windows Firewall: Public profile outbound connections: Allow"
  description: "Allows outbound connections on the public profile unless a rule blocks them."
  rationale: "Allowing outbound traffic by default keeps normal operation working while inbound traffic stays restricted."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Windows Defender Firewall with Advanced Security > Properties > Public Profile > Outbound connections = Allow (default). Registry: HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile\DefaultOutboundAction (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SC-7], pci_dss: ["1.5.1"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0553:
  title: "Audit Credential Validation: Success and Failure"
  description: "Records each attempt to validate account credentials, for example NTLM checks of domain or local accounts."
  rationale: "Successful and failed credential checks reveal password guessing and the use of stolen credentials."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Account Logon > Audit Credential Validation = Success and Failure. Command: auditpol /set /subcategory:"Credential Validation" /success:enable /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0554:
  title: "Audit Kerberos Authentication Service: Success and Failure"
  description: "Records Kerberos ticket-granting ticket requests handled by a domain controller."
  rationale: "TGT request events show who signed in to the domain and expose brute-force and ticket attacks."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Account Logon > Audit Kerberos Authentication Service = Success and Failure. Command: auditpol /set /subcategory:"Kerberos Authentication Service" /success:enable /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0555:
  title: "Audit Kerberos Service Ticket Operations: Success and Failure"
  description: "Records Kerberos service ticket requests issued by a domain controller."
  rationale: "Service ticket events help trace access to services and detect attacks such as ticket harvesting for offline cracking."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Account Logon > Audit Kerberos Service Ticket Operations = Success and Failure. Command: auditpol /set /subcategory:"Kerberos Service Ticket Operations" /success:enable /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0556:
  title: "Audit Application Group Management: Success and Failure"
  description: "Records creation, change and deletion of application groups and their members."
  rationale: "Changes to application groups can grant access, so they should leave an audit trail."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Account Management > Audit Application Group Management = Success and Failure. Command: auditpol /set /subcategory:"Application Group Management" /success:enable /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0557:
  title: "Audit Computer Account Management: includes Success"
  description: "Records creation, change and deletion of computer accounts."
  rationale: "Unexpected computer accounts can be used for persistence or relay attacks, so their creation must be visible."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Account Management > Audit Computer Account Management = Success (or Success and Failure). Command: auditpol /set /subcategory:"Computer Account Management" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0558:
  title: "Audit Distribution Group Management: includes Success"
  description: "Records creation, change and deletion of distribution groups and their membership."
  rationale: "Distribution group changes can redirect mail and hint at account misuse."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Account Management > Audit Distribution Group Management = Success (or Success and Failure). Command: auditpol /set /subcategory:"Distribution Group Management" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0559:
  title: "Audit Other Account Management Events: includes Success"
  description: "Records other account events, such as access to password hashes or changes to password policy."
  rationale: "These events can reveal attempts to read account secrets or weaken account rules."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Account Management > Audit Other Account Management Events = Success (or Success and Failure). Command: auditpol /set /subcategory:"Other Account Management Events" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0560:
  title: "Audit Security Group Management: includes Success"
  description: "Records creation, change and deletion of security groups and changes to their membership."
  rationale: "Adding a user to a privileged group is a common escalation step and must be logged."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Account Management > Audit Security Group Management = Success (or Success and Failure). Command: auditpol /set /subcategory:"Security Group Management" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0561:
  title: "Audit User Account Management: Success and Failure"
  description: "Records creation, change, enabling, disabling, deletion and password resets of user accounts."
  rationale: "Account changes are central to access control; both completed and refused changes need a record."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Account Management > Audit User Account Management = Success and Failure. Command: auditpol /set /subcategory:"User Account Management" /success:enable /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0562:
  title: "Audit Process Creation: includes Success"
  description: "Records each new process started on the system, with the program name and the user who started it."
  rationale: "Process start events are key evidence when investigating malware and attacker activity."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Detailed Tracking > Audit Process Creation = Success. Command: auditpol /set /subcategory:"Process Creation" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0563:
  title: "Audit Directory Service Access: includes Failure"
  description: "Records attempts to access Active Directory objects that carry an auditing entry; failures show refused access."
  rationale: "Refused directory access can indicate reconnaissance or attempts to reach protected objects."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > DS Access > Audit Directory Service Access = Failure (or Success and Failure). Command: auditpol /set /subcategory:"Directory Service Access" /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0564:
  title: "Audit Directory Service Changes: includes Success"
  description: "Records creation, modification, move and deletion of Active Directory objects, including old and new attribute values."
  rationale: "Directory changes can grant rights or alter policy, so a record of what changed is essential."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > DS Access > Audit Directory Service Changes = Success (or Success and Failure). Command: auditpol /set /subcategory:"Directory Service Changes" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0565:
  title: "Audit Account Lockout: includes Failure"
  description: "Records failed sign-in attempts against accounts that are locked out."
  rationale: "Lockout events point to password guessing or a denial-of-service attempt against accounts."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Logon/Logoff > Audit Account Lockout = Failure (or Success and Failure). Command: auditpol /set /subcategory:"Account Lockout" /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0566:
  title: "Audit Logoff: includes Success"
  description: "Records when a logon session ends."
  rationale: "Logoff times complete the picture of who was using the system and for how long."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Logon/Logoff > Audit Logoff = Success. Command: auditpol /set /subcategory:"Logoff" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0567:
  title: "Audit Logon: Success and Failure"
  description: "Records sign-in attempts on this computer, both successful and failed, with the logon type and source."
  rationale: "Logon events are the primary record of access and reveal brute-force attempts and unusual sign-ins."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Logon/Logoff > Audit Logon = Success and Failure. Command: auditpol /set /subcategory:"Logon" /success:enable /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0568:
  title: "Audit Other Logon/Logoff Events: Success and Failure"
  description: "Records other session events such as Remote Desktop reconnects and disconnects, workstation lock and unlock, and screen saver use."
  rationale: "These events show session activity that ordinary logon events miss, such as hijacked remote sessions."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Logon/Logoff > Audit Other Logon/Logoff Events = Success and Failure. Command: auditpol /set /subcategory:"Other Logon/Logoff Events" /success:enable /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0569:
  title: "Audit Special Logon: includes Success"
  description: "Records sign-ins that receive administrator-equivalent privileges or that belong to configured special groups."
  rationale: "Privileged sign-ins carry the most risk and should always be traceable."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Logon/Logoff > Audit Special Logon = Success. Command: auditpol /set /subcategory:"Special Logon" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0570:
  title: "Audit Detailed File Share: includes Failure"
  description: "Records access to individual files and folders on network shares; failures show refused attempts."
  rationale: "Refused share access can reveal users or malware probing for data they should not reach."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Object Access > Audit Detailed File Share = Failure. Command: auditpol /set /subcategory:"Detailed File Share" /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0571:
  title: "Audit File Share: Success and Failure"
  description: "Records connections to network shares, both allowed and refused."
  rationale: "Share access records help trace data access and spot lateral movement through file shares."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Object Access > Audit File Share = Success and Failure. Command: auditpol /set /subcategory:"File Share" /success:enable /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0572:
  title: "Audit Other Object Access Events: Success and Failure"
  description: "Records scheduled task changes and COM+ catalog changes, among other object events. The check queries the subcategory under the name 'Audit Other Object Access Events'."
  rationale: "Scheduled tasks are a common persistence method, so creating or changing them should be logged."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Object Access > Audit Other Object Access Events = Success and Failure. Command: auditpol /set /subcategory:"Other Object Access Events" /success:enable /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0573:
  title: "Audit Removable Storage: Success and Failure"
  description: "Records attempts to read or write files on removable storage devices."
  rationale: "Removable media is a common route for data theft and malware, so its use should be visible."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Object Access > Audit Removable Storage = Success and Failure. Command: auditpol /set /subcategory:"Removable Storage" /success:enable /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0574:
  title: "Audit Audit Policy Change: includes Success"
  description: "Records changes to the audit policy itself."
  rationale: "An attacker who turns off auditing to hide activity should leave a trace of doing so."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Policy Change > Audit Audit Policy Change = Success (or Success and Failure). Command: auditpol /set /subcategory:"Audit Policy Change" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0575:
  title: "Audit Authentication Policy Change: includes Success"
  description: "Records changes to authentication policy, such as domain trusts, Kerberos policy and granted logon rights."
  rationale: "Changes to how users authenticate can weaken security and must be traceable."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Policy Change > Audit Authentication Policy Change = Success. Command: auditpol /set /subcategory:"Authentication Policy Change" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0576:
  title: "Audit Authorization Policy Change: includes Success"
  description: "Records changes to authorization policy, such as user rights assignments and permissions on security objects."
  rationale: "Granting a user right is a quiet way to escalate privilege and should be logged."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Policy Change > Audit Authorization Policy Change = Success. Command: auditpol /set /subcategory:"Authorization Policy Change" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0577:
  title: "Audit MPSSVC Rule-Level Policy Change: Success and Failure"
  description: "Records changes to Windows Firewall rules and settings made through the firewall service."
  rationale: "Firewall rule changes can open the host to attack and should be traceable."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Policy Change > Audit MPSSVC Rule-Level Policy Change = Success and Failure. Command: auditpol /set /subcategory:"MPSSVC Rule-Level Policy Change" /success:enable /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0578:
  title: "Audit Other Policy Change Events: includes Failure"
  description: "Records other policy events, such as failures in the cryptographic and IPsec policy subsystems."
  rationale: "Failures in these subsystems can indicate tampering or misconfiguration that weakens protection."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Policy Change > Audit Other Policy Change Events = Failure. Command: auditpol /set /subcategory:"Other Policy Change Events" /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0579:
  title: "Audit Sensitive Privilege Use: Success and Failure"
  description: "Records use of powerful user rights such as acting as part of the operating system, debugging programs or taking ownership of objects."
  rationale: "Sensitive rights are used in most privilege escalation; their use should be recorded."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Privilege Use > Audit Sensitive Privilege Use = Success and Failure. Command: auditpol /set /subcategory:"Sensitive Privilege Use" /success:enable /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0580:
  title: "Audit IPsec Driver: Success and Failure"
  description: "Records IPsec driver events such as start and stop, and packets dropped for failing integrity checks."
  rationale: "Problems with the IPsec driver can expose traffic that should be protected."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > System > Audit IPsec Driver = Success and Failure. Command: auditpol /set /subcategory:"IPsec Driver" /success:enable /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0581:
  title: "Audit Other System Events: Success and Failure"
  description: "Records events such as the Windows Firewall service starting or stopping and cryptographic key operations."
  rationale: "Stopping the firewall or misusing keys are signs of tampering that should be logged."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > System > Audit Other System Events = Success and Failure. Command: auditpol /set /subcategory:"Other System Events" /success:enable /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0582:
  title: "Audit Security State Change: includes Success"
  description: "Records system start-up, shutdown and changes to the system time."
  rationale: "Start-up, shutdown and clock changes frame the timeline of any investigation."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > System > Audit Security State Change = Success. Command: auditpol /set /subcategory:"Security State Change" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0583:
  title: "Audit Security System Extension: includes Success"
  description: "Records loading of security extensions such as authentication packages and new services."
  rationale: "Malicious authentication packages or services are a known persistence method and must be visible."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > System > Audit Security System Extension = Success. Command: auditpol /set /subcategory:"Security System Extension" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0584:
  title: "Audit System Integrity: Success and Failure"
  description: "Records integrity events, such as failed code integrity checks and lost audit events."
  rationale: "These events reveal tampering with system files and gaps in the audit trail."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > System > Audit System Integrity = Success and Failure. Command: auditpol /set /subcategory:"System Integrity" /success:enable /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0585:
  title: "Local Administrator Password Solution (legacy LAPS): client extension installed"
  description: "Checks that the Group Policy client-side extension of the legacy Local Administrator Password Solution is registered, so the local administrator password can be managed."
  rationale: "Without automatic management, local administrator passwords tend to be shared across machines and enable lateral movement."
  remediation: 'Install the legacy LAPS client (AdmPwd) on the server. It registers HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\GPExtensions\{D76B9641-3288-4f75-942D-087DE603E3EA} with a DllName value. On newer systems use Windows LAPS instead.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0586:
  title: "Do not allow password expiration time longer than required by policy (legacy LAPS): Enabled"
  description: "Stops anyone from setting a managed local administrator password expiry later than the policy allows."
  rationale: "Enforcing the maximum age keeps managed passwords rotating on schedule."
  remediation: 'Computer Configuration > Policies > Administrative Templates > LAPS > Do not allow password expiration time longer than required by policy = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft Services\AdmPwd\PwdExpirationProtectionEnabled (REG_DWORD) = 1.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0587:
  title: "Enable local admin password management (legacy LAPS): Enabled"
  description: "Turns on management of the local administrator password by the legacy LAPS client."
  rationale: "Unique, regularly changed local administrator passwords stop one stolen password from opening every server."
  remediation: 'Computer Configuration > Policies > Administrative Templates > LAPS > Enable local admin password management = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft Services\AdmPwd\AdmPwdEnabled (REG_DWORD) = 1.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0588:
  title: "Password Settings (legacy LAPS) complexity: Large letters + small letters + numbers + special characters"
  description: "Sets which character classes the legacy LAPS client uses when it generates the local administrator password. Value 4 uses all four classes."
  rationale: "Using every character class makes generated passwords much harder to guess or crack."
  remediation: 'Computer Configuration > Policies > Administrative Templates > LAPS > Password Settings = Enabled, Password Complexity: Large letters + small letters + numbers + specials. Registry: HKLM\SOFTWARE\Policies\Microsoft Services\AdmPwd\PasswordComplexity (REG_DWORD) = 4.'
  compliance: { nist_800_53: [IA-5], pci_dss: ["8.3.6", "8.3.9"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: [A.5.17] }
S0589:
  title: "Password Settings (legacy LAPS) length: 15 or more characters"
  description: "Sets the length of the local administrator password generated by the legacy LAPS client. The check requires 15 or more."
  rationale: "Longer generated passwords resist brute-force attacks."
  remediation: 'Computer Configuration > Policies > Administrative Templates > LAPS > Password Settings = Enabled, Password Length: 15 or more. Registry: HKLM\SOFTWARE\Policies\Microsoft Services\AdmPwd\PasswordLength (REG_DWORD) >= 15.'
  compliance: { nist_800_53: [IA-5], pci_dss: ["8.3.6", "8.3.9"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: [A.5.17] }
S0590:
  title: "Password Settings (legacy LAPS) age: 30 days or fewer"
  description: "Sets how many days a generated local administrator password stays valid before the legacy LAPS client changes it. The check requires 30 or fewer."
  rationale: "Frequent rotation limits how long a disclosed local administrator password remains useful."
  remediation: 'Computer Configuration > Policies > Administrative Templates > LAPS > Password Settings = Enabled, Password Age (Days): 30 or fewer. Registry: HKLM\SOFTWARE\Policies\Microsoft Services\AdmPwd\PasswordAgeDays (REG_DWORD) <= 30.'
  compliance: { nist_800_53: [IA-5], pci_dss: ["8.3.6", "8.3.9"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: [A.5.17] }
S0591:
  title: "Apply UAC restrictions to local accounts on network logons: Enabled"
  description: "Makes local accounts that sign in over the network receive a filtered token without administrator rights. The check expects LocalAccountTokenFilterPolicy = 0."
  rationale: "Filtering remote local-account tokens blocks pass-the-hash lateral movement with shared local administrator passwords."
  remediation: 'Computer Configuration > Policies > Administrative Templates > MS Security Guide > Apply UAC restrictions to local accounts on network logons = Enabled (security baseline template). Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LocalAccountTokenFilterPolicy (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-6], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.312(a)(1)"], iso_27001: [A.8.2] }
S0592:
  title: "SMB v1 client driver: removed from the Workstation service dependencies"
  description: "Checks that the Workstation service depends only on Bowser, MRxSmb20 and NSI, meaning the SMBv1 client driver is no longer required."
  rationale: "SMBv1 is obsolete and has well-known critical flaws; removing the dependency is part of turning it off."
  remediation: 'Computer Configuration > Policies > Administrative Templates > MS Security Guide > Configure SMB v1 client (security baseline template) = Bowser, MRxSmb20, NSI. Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\DependOnService (REG_MULTI_SZ) = Bowser MRxSmb20 NSI.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0593:
  title: "Configure SMB v1 client driver: Disabled"
  description: "Sets the start type of the SMBv1 client driver (mrxsmb10). Value 4 means the driver never starts."
  rationale: "Turning off the SMBv1 client stops the computer from using a protocol with known remote code execution flaws."
  remediation: 'Computer Configuration > Policies > Administrative Templates > MS Security Guide > Configure SMB v1 client driver = Enabled: Disable driver (security baseline template). Registry: HKLM\SYSTEM\CurrentControlSet\Services\mrxsmb10\Start (REG_DWORD) = 4.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0594:
  title: "Configure SMB v1 server: Disabled"
  description: "Controls whether the SMB server accepts the SMBv1 protocol."
  rationale: "SMBv1 lacks modern protections and has been used by large worm outbreaks; servers should not offer it."
  remediation: 'Computer Configuration > Policies > Administrative Templates > MS Security Guide > Configure SMB v1 server = Disabled (security baseline template). Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\SMB1 (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0595:
  title: "WDigest Authentication: Disabled"
  description: "Controls whether WDigest keeps a reversible copy of signed-in users' passwords in memory."
  rationale: "Clear-text passwords in memory can be dumped by credential theft tools."
  remediation: 'Computer Configuration > Policies > Administrative Templates > MS Security Guide > WDigest Authentication = Disabled (security baseline template). Registry: HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest\UseLogonCredential (REG_DWORD) = 0.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0596:
  title: "Automatic logon: Disabled"
  description: "Controls whether Windows signs a user in automatically at start-up using a stored password."
  rationale: "Automatic logon stores a password in the registry and gives anyone with physical access a signed-in session."
  remediation: 'Computer Configuration > Policies > Administrative Templates > MSS (Legacy) > MSS: (AutoAdminLogon) Enable Automatic Logon = Disabled. Registry: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\AutoAdminLogon (REG_SZ) = 0.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0597:
  title: "Ignore NetBIOS name release requests except from WINS servers: Enabled"
  description: "Makes the computer ignore NetBIOS name release requests unless they come from a WINS server."
  rationale: "Prevents an attacker on the network from forcing the computer to give up its NetBIOS name."
  remediation: 'Computer Configuration > Policies > Administrative Templates > MSS (Legacy) > MSS: (NoNameReleaseOnDemand) Allow the computer to ignore NetBIOS name release requests except from WINS servers = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\NoNameReleaseOnDemand (REG_DWORD) = 1.'
  compliance: { nist_800_53: [CM-7, SC-7], pci_dss: ["2.2.4"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0598:
  title: "Safe DLL search mode: Enabled"
  description: "Makes Windows search system folders before the current folder when loading DLLs."
  rationale: "Searching system folders first makes DLL planting attacks from the working folder harder."
  remediation: 'Computer Configuration > Policies > Administrative Templates > MSS (Legacy) > MSS: (SafeDllSearchMode) Enable Safe DLL search mode = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\SafeDllSearchMode (REG_DWORD) = 1.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0599:
  title: "Screen saver grace period: 5 seconds or fewer"
  description: "Sets how many seconds after the screen saver starts the session can be resumed without a password. The check requires 5 or fewer."
  rationale: "A long grace period lets a passer-by resume a session that should already be locked."
  remediation: 'Computer Configuration > Policies > Administrative Templates > MSS (Legacy) > MSS: (ScreenSaverGracePeriod) The time in seconds before the screen saver grace period expires = 5 or fewer. Registry: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\ScreenSaverGracePeriod (REG_SZ) <= 5.'
  compliance: { nist_800_53: [AC-11, AC-12], pci_dss: ["8.2.8"], hipaa: ["164.312(a)(2)(iii)"], iso_27001: [A.8.5] }
S0600:
  title: "Security event log warning threshold: 90% or less"
  description: "Sets the percentage of the Security log size at which Windows raises a warning event. The check requires 90 or lower."
  rationale: "An early warning gives administrators time to archive the log before events are lost."
  remediation: 'Computer Configuration > Policies > Administrative Templates > MSS (Legacy) > MSS: (WarningLevel) Percentage threshold for the security event log at which the system will generate a warning = 90% or less. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Eventlog\Security\WarningLevel (REG_DWORD) <= 90.'
  compliance: { nist_800_53: [AU-4, AU-11], pci_dss: ["10.5.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0601:
  title: "Configure NetBIOS settings: EnableNetbios = 1 (allow NetBIOS name resolution)"
  description: "Controls whether the DNS client also resolves names over NetBIOS. Value 1 allows NetBIOS name resolution on all networks."
  rationale: "A defined NetBIOS policy makes name resolution behaviour predictable; where possible, prefer disabling NetBIOS on public networks to limit name spoofing."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > DNS Client > Configure NetBIOS settings = Enabled: Allow NetBIOS resolution. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient\EnableNetbios (REG_DWORD) = 1.'
  compliance: { nist_800_53: [CM-7, SC-7], pci_dss: ["2.2.4"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0602:
  title: "Multicast name resolution (LLMNR): EnableMulticast = 1"
  description: "Controls whether the DNS client uses Link-Local Multicast Name Resolution when DNS fails. The check expects the policy value EnableMulticast to be 1, which leaves multicast resolution allowed."
  rationale: "LLMNR answers can be spoofed by any host on the local link to capture credentials, so its state should be set deliberately by policy."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > DNS Client > Turn off multicast name resolution. The check reads HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient\EnableMulticast (REG_DWORD) = 1.'
  compliance: { nist_800_53: [CM-7, SC-7], pci_dss: ["2.2.4"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0603:
  title: "Turn on Mapper I/O (LLTDIO) driver: Disabled"
  description: "Controls the Link-Layer Topology Discovery mapper driver, which lets the computer discover other devices and draw the network map. All four policy values must be 0."
  rationale: "Network discovery protocols are not needed on servers and reveal network layout to others."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Link-Layer Topology Discovery > Turn on Mapper I/O (LLTDIO) driver = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LLTD AllowLLTDIOOnDomain, AllowLLTDIOOnPublicNet, EnableLLTDIO, ProhibitLLTDIOOnPrivateNet (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0604:
  title: "Turn on Responder (RSPNDR) driver: Disabled"
  description: "Controls the Link-Layer Topology Discovery responder driver, which lets the computer be discovered on the network map. All four policy values must be 0."
  rationale: "Answering discovery requests reveals the server to anyone on the local network."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Link-Layer Topology Discovery > Turn on Responder (RSPNDR) driver = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LLTD AllowRspndrOnDomain, AllowRspndrOnPublicNet, EnableRspndr, ProhibitRspndrOnPrivateNet (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0605:
  title: "Hardened UNC Paths: NETLOGON and SYSVOL require mutual authentication and integrity"
  description: "Requires mutual authentication and integrity whenever the computer connects to the NETLOGON and SYSVOL shares of any server."
  rationale: "Group Policy and logon scripts come from these shares; hardening them prevents a spoofed server from delivering malicious policy."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Network Provider > Hardened UNC Paths = Enabled with \\*\NETLOGON and \\*\SYSVOL set to RequireMutualAuthentication=1, RequireIntegrity=1. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths (REG_SZ values).'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0606:
  title: "Minimize the number of simultaneous connections to the Internet or a Windows Domain: Enabled"
  description: "Makes the computer prefer one network connection at a time instead of keeping several active."
  rationale: "Being connected to two networks at once can bridge a trusted network to an untrusted one."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Windows Connection Manager > Minimize the number of simultaneous connections to the Internet or a Windows Domain = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy\fMinimizeConnections (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-7], pci_dss: ["1.5.1"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0607:
  title: "Allow Print Spooler to accept client connections: Disabled"
  description: "Controls whether the Print Spooler service listens for remote client connections."
  rationale: "A spooler that does not accept remote connections cannot be attacked over the network through print vulnerabilities."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Printers > Allow Print Spooler to accept client connections = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RegisterSpoolerRemoteRpcEndPoint (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0608:
  title: "Limits print driver installation to Administrators: Enabled"
  description: "Allows only administrators to install print drivers when connecting to a printer."
  rationale: "Ordinary users installing print drivers was abused by print spooler attacks to run code as SYSTEM."
  remediation: 'Computer Configuration > Policies > Administrative Templates > MS Security Guide > Limits print driver installation to Administrators = Enabled (security baseline template). Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint\RestrictDriverInstallationToAdministrators (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-6], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.312(a)(1)"], iso_27001: [A.8.2] }
S0609:
  title: "Point and Print Restrictions, new connections: NoWarningNoElevationOnInstall = 1"
  description: "Controls whether users see a warning and elevation prompt when Point and Print installs a driver for a new printer connection. The check expects the value 1."
  rationale: "Point and Print driver installation runs with high privilege, so its prompt behaviour must be set by policy."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Printers > Point and Print Restrictions. The check reads HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint\NoWarningNoElevationOnInstall (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-6], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.312(a)(1)"], iso_27001: [A.8.2] }
S0610:
  title: "Point and Print Restrictions, updating drivers: UpdatePromptSettings = 1"
  description: "Controls whether users see a warning and elevation prompt when Point and Print updates a driver for an existing connection. The check expects the value 1."
  rationale: "Driver updates run with high privilege, so their prompt behaviour must be set by policy."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Printers > Point and Print Restrictions. The check reads HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint\UpdatePromptSettings (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-6], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.312(a)(1)"], iso_27001: [A.8.2] }
S0611:
  title: "Encryption Oracle Remediation: Mitigated"
  description: "Controls whether CredSSP clients and servers may talk to peers that lack the CredSSP security update. Value 1 (Mitigated) stops clients falling back to insecure versions, while still serving unpatched clients."
  rationale: "Blocking fallback to the vulnerable CredSSP version protects remote sessions from credential relay and code execution attacks."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Credentials Delegation > Encryption Oracle Remediation = Enabled: Mitigated. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\CredSSP\Parameters\AllowEncryptionOracle (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-17, SC-8], pci_dss: ["2.2.7"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20, A.8.24] }
S0612:
  title: "Turn off background refresh of Group Policy: Disabled"
  description: "Controls whether Group Policy is refreshed while the computer is in use. Leaving the policy disabled keeps periodic background refresh on."
  rationale: "Background refresh makes sure security settings are reapplied even if someone changes them locally."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Group Policy > Turn off background refresh of Group Policy = Disabled. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableBkGndGroupPolicy (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0613:
  title: "Enumerate local users on domain-joined computers: Disabled"
  description: "Controls whether the sign-in screen lists all local user accounts on a domain-joined computer."
  rationale: "Showing account names gives an attacker at the console half of the credentials."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Logon > Enumerate local users on domain-joined computers = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\System\EnumerateLocalUsers (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0614:
  title: "Turn on convenience PIN sign-in: Disabled"
  description: "Controls whether domain users may sign in with a simple PIN that stands in for their password."
  rationale: "A convenience PIN is a short secret backed by the cached domain password and is weaker than the password itself."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Logon > Turn on convenience PIN sign-in = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\System\AllowDomainPINLogon (REG_DWORD) = 0.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0615:
  title: "Require a password when a computer wakes (on battery): Enabled"
  description: "Requires the user to enter a password when the computer resumes from sleep while running on battery."
  rationale: "Without it, anyone who wakes the device gets the previous user's session."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Power Management > Sleep Settings > Require a password when a computer wakes (on battery) = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51\DCSettingIndex (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-11, AC-12], pci_dss: ["8.2.8"], hipaa: ["164.312(a)(2)(iii)"], iso_27001: [A.8.5] }
S0616:
  title: "Require a password when a computer wakes (plugged in): Enabled"
  description: "Requires the user to enter a password when the computer resumes from sleep while on mains power."
  rationale: "Without it, anyone who wakes the device gets the previous user's session."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Power Management > Sleep Settings > Require a password when a computer wakes (plugged in) = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51\ACSettingIndex (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-11, AC-12], pci_dss: ["8.2.8"], hipaa: ["164.312(a)(2)(iii)"], iso_27001: [A.8.5] }
S0617:
  title: "Configure Offer Remote Assistance: Disabled"
  description: "Controls whether helpers may offer Remote Assistance to this computer without the user first asking for help."
  rationale: "Unsolicited remote assistance offers can be used to trick users into handing over control of the server."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Remote Assistance > Configure Offer Remote Assistance = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\fAllowUnsolicited (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-17, SC-8], pci_dss: ["2.2.7"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20, A.8.24] }
S0618:
  title: "Restrict Unauthenticated RPC clients: Authenticated"
  description: "Controls how the RPC runtime treats clients that connect without authenticating. Value 1 requires authentication except for interfaces that explicitly allow anonymous callers."
  rationale: "Requiring authenticated RPC calls shrinks the remote attack surface of services built on RPC."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Remote Procedure Call > Restrict Unauthenticated RPC clients = Enabled: Authenticated. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Rpc\RestrictRemoteClients (REG_DWORD) = 1.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0619:
  title: "Enable Windows NTP Server: Disabled"
  description: "Controls whether this computer acts as a time server for other machines on the network."
  rationale: "Servers that do not need to hand out time should not run an extra network listener."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Windows Time Service > Time Providers > Enable Windows NTP Server = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\W32Time\TimeProviders\NtpServer\Enabled (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0620:
  title: "Enumerate administrator accounts on elevation: Disabled"
  description: "Controls whether the elevation prompt lists administrator accounts for the user to choose from."
  rationale: "Listing administrator accounts tells an attacker which account names to target."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Credential User Interface > Enumerate administrator accounts on elevation = Disabled. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\CredUI\EnumerateAdministrators (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0621:
  title: "Enhanced Mitigation Experience Toolkit (EMET): installed"
  description: "Checks that EMET, Microsoft's legacy exploit mitigation tool for older Windows versions, is installed."
  rationale: "On older servers without built-in exploit protection, EMET adds mitigations that block common memory corruption exploits."
  remediation: 'Install the latest supported EMET release on the server (creates HKLM\SOFTWARE\Microsoft\EMET). On newer Windows versions use the built-in Exploit protection instead.'
  compliance: { nist_800_53: [SI-16], pci_dss: ["2.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0622:
  title: "EMET Default Action and Mitigation Settings: Enabled (Deep Hooks, Anti Detours, Banned Functions on; ExploitAction = 2)"
  description: "Turns on the EMET advanced mitigations Deep Hooks, Anti Detours and Banned Functions and sets the action taken when an exploit is detected. The check expects ExploitAction = 2."
  rationale: "These options close common ways for exploit code to evade EMET's hooks."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > EMET > Default Action and Mitigation Settings = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\EMET\SysSettings AntiDetours = 1, BannedFunctions = 1, DeepHooks = 1, ExploitAction = 2.'
  compliance: { nist_800_53: [SI-16], pci_dss: ["2.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0623:
  title: "EMET Default Protections for Internet Explorer: Enabled"
  description: "Applies EMET's predefined mitigation profile, including Export Address Filtering and Attack Surface Reduction, to Internet Explorer."
  rationale: "The browser is a common exploit target; extra mitigations make attacks against it harder."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > EMET > Default Protections for Internet Explorer = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\EMET\Defaults\*\Internet Explorer\iexplore.exe holds the IE protection string.'
  compliance: { nist_800_53: [SI-16], pci_dss: ["2.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0624:
  title: "EMET Default Protections for Popular Software: Enabled"
  description: "Applies EMET's predefined mitigation profiles to widely used third-party applications such as browsers, media players, archivers and chat clients."
  rationale: "Popular applications are frequent exploit targets; applying mitigations reduces the chance of a successful attack."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > EMET > Default Protections for Popular Software = Enabled. Registry: entries under HKLM\SOFTWARE\Policies\Microsoft\EMET\Defaults for each listed application.'
  compliance: { nist_800_53: [SI-16], pci_dss: ["2.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0625:
  title: "EMET Default Protections for Recommended Software: Enabled"
  description: "Applies EMET's predefined mitigation profiles to Microsoft Office, Adobe Reader and Acrobat, Java and WordPad."
  rationale: "Document readers and runtimes are often attacked through malicious files; extra mitigations block many such exploits."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > EMET > Default Protections for Recommended Software = Enabled. Registry: entries under HKLM\SOFTWARE\Policies\Microsoft\EMET\Defaults for each listed application.'
  compliance: { nist_800_53: [SI-16], pci_dss: ["2.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0626:
  title: "EMET System ASLR Policy: Application Opt-In (3)"
  description: "Sets the system-wide Address Space Layout Randomization mode enforced by EMET. The check expects value 3."
  rationale: "Randomised memory layout makes it much harder for exploit code to find the addresses it needs."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > EMET > System ASLR Policy = Enabled: Application Opt-In. Registry: HKLM\SOFTWARE\Policies\Microsoft\EMET\SysSettings\ASLR (REG_DWORD) = 3.'
  compliance: { nist_800_53: [SI-16], pci_dss: ["2.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0627:
  title: "EMET System DEP Policy: Application Opt Out (2)"
  description: "Sets the system-wide Data Execution Prevention mode enforced by EMET. The check expects value 2."
  rationale: "DEP stops code from running in memory meant for data, which defeats many classic exploits."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > EMET > System DEP Policy = Enabled: Application Opt Out. Registry: HKLM\SOFTWARE\Policies\Microsoft\EMET\SysSettings\DEP (REG_DWORD) = 2.'
  compliance: { nist_800_53: [SI-16], pci_dss: ["2.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0628:
  title: "EMET System SEHOP Policy: Application Opt Out (2)"
  description: "Sets the system-wide Structured Exception Handler Overwrite Protection mode enforced by EMET. The check expects value 2."
  rationale: "SEHOP blocks exploits that overwrite exception handler records on the stack."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > EMET > System SEHOP Policy = Enabled: Application Opt Out. Registry: HKLM\SOFTWARE\Policies\Microsoft\EMET\SysSettings\SEHOP (REG_DWORD) = 2.'
  compliance: { nist_800_53: [SI-16], pci_dss: ["2.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0629:
  title: "Application log: Control Event Log behavior when the log file reaches its maximum size: Disabled"
  description: "Decides what happens when the Application log is full. With the policy disabled (Retention = 0) the oldest events are overwritten and new events keep being recorded."
  rationale: "Logging never stops, so new events are not lost when the log fills up."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Event Log Service > Application > Control Event Log behavior when the log file reaches its maximum size = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application\Retention (REG_SZ) = 0.'
  compliance: { nist_800_53: [AU-4, AU-11], pci_dss: ["10.5.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0630:
  title: "Security log: Control Event Log behavior when the log file reaches its maximum size: Disabled"
  description: "Decides what happens when the Security log is full. With the policy disabled (Retention = 0) the oldest events are overwritten and new events keep being recorded."
  rationale: "Security logging never stops, so recent audit events are always captured."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Event Log Service > Security > Control Event Log behavior when the log file reaches its maximum size = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security\Retention (REG_SZ) = 0.'
  compliance: { nist_800_53: [AU-4, AU-11], pci_dss: ["10.5.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0631:
  title: "Setup log: Control Event Log behavior when the log file reaches its maximum size: Disabled"
  description: "Decides what happens when the Setup log is full. With the policy disabled (Retention = 0) the oldest events are overwritten and new events keep being recorded."
  rationale: "Logging never stops, so new installation events are not lost."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Event Log Service > Setup > Control Event Log behavior when the log file reaches its maximum size = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\EventLog\Setup\Retention (REG_SZ) = 0.'
  compliance: { nist_800_53: [AU-4, AU-11], pci_dss: ["10.5.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0632:
  title: "System log: Control Event Log behavior when the log file reaches its maximum size: Disabled"
  description: "Decides what happens when the System log is full. With the policy disabled (Retention = 0) the oldest events are overwritten and new events keep being recorded."
  rationale: "Logging never stops, so new system events are not lost."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Event Log Service > System > Control Event Log behavior when the log file reaches its maximum size = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\EventLog\System\Retention (REG_SZ) = 0.'
  compliance: { nist_800_53: [AU-4, AU-11], pci_dss: ["10.5.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0633:
  title: "Turn off Data Execution Prevention for Explorer: Disabled"
  description: "Controls whether File Explorer may run without Data Execution Prevention, which some old shell extensions need."
  rationale: "Keeping DEP on for Explorer blocks exploits delivered through malicious files and folders."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > File Explorer > Turn off Data Execution Prevention for Explorer = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer\NoDataExecutionPrevention (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SI-16], pci_dss: ["2.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0634:
  title: "Turn off heap termination on corruption: Disabled"
  description: "Controls whether File Explorer is terminated when heap corruption is detected."
  rationale: "Ending the process on heap corruption stops exploit code from continuing after it damages memory."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > File Explorer > Turn off heap termination on corruption = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer\NoHeapTerminationOnCorruption (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SI-16], pci_dss: ["2.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0635:
  title: "Turn off shell protocol protected mode: Disabled"
  description: "Controls whether the shell protocol runs in protected mode, which lets applications open only a limited set of folders through it."
  rationale: "Protected mode stops web pages and documents from using the shell protocol to open arbitrary files."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > File Explorer > Turn off shell protocol protected mode = Disabled. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\PreXPSP2ShellProtocolBehavior (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SI-16], pci_dss: ["2.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0636:
  title: "Turn off Windows Location Provider: Enabled"
  description: "Turns off the Windows Location Provider so applications cannot determine the computer's location through it."
  rationale: "Servers have no need to share location data, which could reveal sensitive site information."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Location and Sensors > Windows Location Provider > Turn off Windows Location Provider = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors\DisableWindowsLocationProvider (REG_DWORD) = 1.'
  compliance: { nist_800_53: [CM-7, PT-2], pci_dss: ["2.2.4"], hipaa: ["164.312(e)(1)"], iso_27001: [A.5.34] }
S0637:
  title: "Configure local setting override for reporting to Microsoft MAPS: Disabled"
  description: "Controls whether a local administrator may override the Group Policy setting for cloud protection (MAPS) reporting."
  rationale: "Preventing local overrides keeps the antimalware reporting configuration under central control."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > MAPS > Configure local setting override for reporting to Microsoft MAPS = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet\LocalSettingOverrideSpynetReporting (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SI-3], pci_dss: ["5.2.1", "5.3.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0638:
  title: "Join Microsoft MAPS: Disabled or not configured"
  description: "Controls whether Microsoft Defender Antivirus sends information about detected software to the Microsoft cloud protection service. The check passes when the policy value is absent or 0."
  rationale: "On sensitive servers, organisations may need to control what file and detection data leaves the network."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > MAPS > Join Microsoft MAPS = Disabled (or Not Configured). Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet\SpynetReporting (REG_DWORD) = 0 or absent.'
  compliance: { nist_800_53: [CM-7, PT-2], pci_dss: ["2.2.4"], hipaa: ["164.312(e)(1)"], iso_27001: [A.5.34] }
S0639:
  title: "Scan all downloaded files and attachments: Enabled"
  description: "Makes Microsoft Defender Antivirus scan files and attachments downloaded from the internet. The policy value DisableIOAVProtection must be 0."
  rationale: "Downloads and attachments are a primary way malware arrives."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Real-time Protection > Scan all downloaded files and attachments = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection\DisableIOAVProtection (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SI-3], pci_dss: ["5.2.1", "5.3.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0640:
  title: "Turn off real-time protection: Disabled"
  description: "Keeps Microsoft Defender Antivirus real-time protection running, so files are scanned as they are opened or written."
  rationale: "Real-time scanning stops malware before it runs rather than after the fact."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Real-time Protection > Turn off real-time protection = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection\DisableRealtimeMonitoring (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SI-3], pci_dss: ["5.2.1", "5.3.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0641:
  title: "Turn on behavior monitoring: Enabled"
  description: "Keeps Microsoft Defender Antivirus behaviour monitoring on, which watches running processes for suspicious actions. The policy value DisableBehaviorMonitoring must be 0."
  rationale: "Behaviour monitoring catches new malware that signatures do not yet recognise."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Real-time Protection > Turn on behavior monitoring = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection\DisableBehaviorMonitoring (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SI-3], pci_dss: ["5.2.1", "5.3.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0642:
  title: "Turn on script scanning: Enabled"
  description: "Keeps Microsoft Defender Antivirus scanning of scripts on. The policy value DisableScriptScanning must be 0."
  rationale: "Malicious scripts are widely used for initial access and fileless attacks."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Real-time Protection > Turn on script scanning = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection\DisableScriptScanning (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SI-3], pci_dss: ["5.2.1", "5.3.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0643:
  title: "Turn off Microsoft Defender Antivirus: Disabled"
  description: "Keeps Microsoft Defender Antivirus running. The check reads DisableAntiSpyware = 0 under the WindowsDefender policy key."
  rationale: "Without an active antimalware engine the server has no protection against known malware."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Turn off Microsoft Defender Antivirus = Disabled. The check reads HKLM\SOFTWARE\Policies\Microsoft\WindowsDefender\DisableAntiSpyware (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SI-3], pci_dss: ["5.2.1", "5.3.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0644:
  title: "Restrict Remote Desktop Services users to a single Remote Desktop Services session: Enabled"
  description: "Limits each user to one Remote Desktop session on the server; reconnecting returns the user to the existing session."
  rationale: "Single sessions save resources and make it easier to spot a second, unexpected session for the same account."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Connections > Restrict Remote Desktop Services users to a single Remote Desktop Services session = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\fSingleSessionPerUser (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-17, SC-8], pci_dss: ["2.2.7"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20, A.8.24] }
S0645:
  title: "Require user authentication for remote connections by using Network Level Authentication: Enabled"
  description: "Requires users to authenticate before a full Remote Desktop session is created on the server."
  rationale: "Network Level Authentication stops unauthenticated users from consuming session resources and reaching the sign-in screen code."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security > Require user authentication for remote connections by using Network Level Authentication = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\UserAuthentication (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-17, SC-8], pci_dss: ["2.2.7"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20, A.8.24] }
S0646:
  title: "Set client connection encryption level: High Level"
  description: "Sets the encryption strength used for Remote Desktop traffic between client and server. Value 3 requires 128-bit encryption."
  rationale: "Strong encryption keeps remote session content and keystrokes confidential."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security > Set client connection encryption level = Enabled: High Level. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\MinEncryptionLevel (REG_DWORD) = 3.'
  compliance: { nist_800_53: [AC-17, SC-8], pci_dss: ["2.2.7"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20, A.8.24] }
S0647:
  title: "Do not delete temp folders upon exit: Disabled"
  description: "Makes Remote Desktop Services delete a user's temporary folders when the session ends."
  rationale: "Deleting temporary data on logoff stops sensitive leftovers from being read later."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Temporary folders > Do not delete temp folders upon exit = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\DeleteTempDirsOnExit (REG_DWORD) = 1.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0648:
  title: "Do not use temporary folders per session: Disabled"
  description: "Gives each Remote Desktop session its own temporary folder instead of sharing one per user."
  rationale: "Separate temporary folders keep data from one session out of another."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Temporary folders > Do not use temporary folders per session = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\PerSessionTempDir (REG_DWORD) = 1.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0649:
  title: "Configure Default consent: Always ask before sending data"
  description: "Sets the default consent level for Windows Error Reporting. Value 1 asks the user before any data is sent."
  rationale: "Error reports can contain memory with sensitive data, so sending them should require consent."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Error Reporting > Consent > Configure Default consent = Enabled: Always ask before sending data. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting\Consent\DefaultConsent (REG_DWORD) = 1.'
  compliance: { nist_800_53: [CM-7, PT-2], pci_dss: ["2.2.4"], hipaa: ["164.312(e)(1)"], iso_27001: [A.5.34] }
S0650:
  title: "Turn on PowerShell Script Block Logging: Enabled"
  description: "Records the content of PowerShell script blocks as they are run, in the PowerShell operational log."
  rationale: "Attackers rely heavily on PowerShell; logging what actually ran exposes obfuscated and in-memory scripts."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows PowerShell > Turn on PowerShell Script Block Logging = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging\EnableScriptBlockLogging (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0651:
  title: "WinRM Client: Allow Basic authentication: Disabled"
  description: "Controls whether the Windows Remote Management client may use Basic authentication."
  rationale: "Basic authentication sends the password in an easily decoded form."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Remote Management (WinRM) > WinRM Client > Allow Basic authentication = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client\AllowBasic (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-17, SC-8], pci_dss: ["2.2.7"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20, A.8.24] }
S0652:
  title: "WinRM Client: Allow unencrypted traffic: Disabled"
  description: "Controls whether the Windows Remote Management client may send and receive unencrypted messages."
  rationale: "Unencrypted management traffic exposes commands and credentials on the network."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Remote Management (WinRM) > WinRM Client > Allow unencrypted traffic = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client\AllowUnencryptedTraffic (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-17, SC-8], pci_dss: ["2.2.7"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20, A.8.24] }
S0653:
  title: "WinRM Service: Allow Basic authentication: Disabled"
  description: "Controls whether the Windows Remote Management service accepts Basic authentication from clients."
  rationale: "Basic authentication sends the password in an easily decoded form."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Remote Management (WinRM) > WinRM Service > Allow Basic authentication = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service\AllowBasic (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-17, SC-8], pci_dss: ["2.2.7"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20, A.8.24] }
S0654:
  title: "Allow remote server management through WinRM: Disabled"
  description: "Controls whether the WinRM service automatically listens for remote management requests."
  rationale: "Turning off the listener where it is not needed removes a remote administration entry point."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Remote Management (WinRM) > WinRM Service > Allow remote server management through WinRM = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service\AllowAutoConfig (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0655:
  title: "WinRM Service: Allow unencrypted traffic: Disabled"
  description: "Controls whether the Windows Remote Management service accepts unencrypted messages."
  rationale: "Unencrypted management traffic exposes commands and credentials on the network."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Remote Management (WinRM) > WinRM Service > Allow unencrypted traffic = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service\AllowUnencryptedTraffic (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-17, SC-8], pci_dss: ["2.2.7"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20, A.8.24] }
S0656:
  title: "No auto-restart with logged on users for scheduled automatic updates installations: Disabled"
  description: "Controls whether Windows Update waits for signed-in users instead of restarting automatically to finish installing updates."
  rationale: "Allowing the scheduled restart makes sure security updates actually take effect."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Update > No auto-restart with logged on users for scheduled automatic updates installations = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU\NoAutoRebootWithLoggedOnUsers (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SI-2], pci_dss: ["6.3.3"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.8] }
S0657:
  title: "Configure Automatic Updates: Enabled"
  description: "Turns on automatic downloading and installation of Windows updates."
  rationale: "Automatic updates close known vulnerabilities without waiting for manual action."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Update > Configure Automatic Updates = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU\NoAutoUpdate (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SI-2], pci_dss: ["6.3.3"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.8] }
S0658:
  title: "Configure Automatic Updates: Scheduled install day: 0 - Every day"
  description: "Sets the day on which automatic updates are installed. Value 0 installs them every day."
  rationale: "Daily installation keeps the gap between an update's release and its installation short."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Update > Configure Automatic Updates = Enabled, Scheduled install day: 0 - Every day. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU\ScheduledInstallDay (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SI-2], pci_dss: ["6.3.3"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.8] }
S0659:
  title: "Accounts: Limit local account use of blank passwords to console logon only: Enabled"
  description: "Stops local accounts with an empty password from signing in over the network or through Remote Desktop."
  rationale: "Accounts without a password would otherwise be an open door from the network."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Accounts: Limit local account use of blank passwords to console logon only = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\LimitBlankPasswordUse (REG_DWORD) = 1.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0660:
  title: "Devices: Allowed to format and eject removable media: Administrators"
  description: "Sets who may format and eject removable NTFS media. The check passes when the value is absent or 0 (Administrators)."
  rationale: "Limiting this right to administrators reduces the chance of data being carried off on removable media."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Devices: Allowed to format and eject removable media = Administrators. Registry: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\AllocateDASD (REG_SZ) = 0.'
  compliance: { nist_800_53: [AC-6], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.312(a)(1)"], iso_27001: [A.8.2] }
S0661:
  title: "Domain controller: Allow server operators to schedule tasks: Disabled"
  description: "Controls whether members of Server Operators may create scheduled tasks on a domain controller. The check passes when the value is absent or 0."
  rationale: "Scheduled tasks often run as SYSTEM, so this right could let Server Operators gain full control."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain controller: Allow server operators to schedule tasks = Disabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\SubmitControl (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-6], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.312(a)(1)"], iso_27001: [A.8.2] }
S0662:
  title: "Domain controller: Allow vulnerable Netlogon secure channel connections: not configured"
  description: "Lists accounts a domain controller still accepts over a Netlogon channel without secure RPC. The check requires the Netlogon parameters key to exist without an allow list value."
  rationale: "Any account on this list can bypass the protection added against Netlogon channel downgrade attacks."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain controller: Allow vulnerable Netlogon secure channel connections: leave Not Defined. Delete HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\VulnerableChannelAllowList if present.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0663:
  title: "Domain controller: LDAP server signing requirements: Require signing"
  description: "Defines whether the domain controller insists on signed LDAP binds. Value 2 rejects unsigned binds that are not protected by TLS."
  rationale: "Unsigned LDAP traffic can be modified or relayed in transit."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain controller: LDAP server signing requirements = Require signing. Registry: HKLM\SYSTEM\CurrentControlSet\Services\NTDS\Parameters\LDAPServerIntegrity (REG_DWORD) = 2.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0664:
  title: "Domain controller: Refuse machine account password changes: Disabled"
  description: "When enabled, the domain controller refuses requests from domain members to change their computer account password. The check passes when the value is absent or 0."
  rationale: "Computer account passwords must rotate regularly; refusing changes leaves long-lived machine secrets."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain controller: Refuse machine account password changes = Disabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\RefusePasswordChange (REG_DWORD) = 0.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0665:
  title: "Domain member: Maximum machine account password age: 30 days"
  description: "Sets how often the computer changes its computer account password. The check expects exactly 30 days."
  rationale: "A short rotation interval reduces the window in which a captured machine password can be abused."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain member: Maximum machine account password age = 30 days. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\MaximumPasswordAge (REG_DWORD) = 30.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0666:
  title: "Interactive logon: Number of previous logons to cache (in case domain controller is not available): 4 or fewer"
  description: "Sets how many domain sign-ins are cached locally so users can sign in when no domain controller is reachable. The check requires 4 or fewer."
  rationale: "Cached credentials can be extracted and cracked offline; keeping fewer limits exposure."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Interactive logon: Number of previous logons to cache (in case domain controller is not available) = 4 or fewer. Registry: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\CachedLogonsCount (REG_SZ) <= 4.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0667:
  title: "Microsoft network server: Amount of idle time required before suspending session: 15 minutes or fewer"
  description: "Sets how many minutes an SMB session may stay idle before the server suspends it. The check requires 15 or fewer."
  rationale: "Closing idle sessions frees server resources and shortens the time an unattended session can be misused."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Microsoft network server: Amount of idle time required before suspending session = 15 or fewer minutes. Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\AutoDisconnect (REG_DWORD) <= 15.'
  compliance: { nist_800_53: [AC-11, AC-12], pci_dss: ["8.2.8"], hipaa: ["164.312(a)(2)(iii)"], iso_27001: [A.8.5] }
S0668:
  title: "Microsoft network server: Disconnect clients when logon hours expire: Enabled"
  description: "Ends SMB server sessions of users whose permitted logon hours have run out."
  rationale: "Users should not keep network file access outside the hours their account allows."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Microsoft network server: Disconnect clients when logon hours expire = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\EnableForcedLogOff (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-11, AC-12], pci_dss: ["8.2.8"], hipaa: ["164.312(a)(2)(iii)"], iso_27001: [A.8.5] }
S0669:
  title: "Network access: Named Pipes that can be accessed anonymously (domain controller): includes LSARPC, NETLOGON, SAMR"
  description: "Lists the named pipes an anonymous session may open. On a domain controller the list must contain LSARPC, NETLOGON and SAMR."
  rationale: "Limiting anonymous pipes to the ones domain services require keeps other RPC interfaces closed to unauthenticated users."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Named Pipes that can be accessed anonymously = LSARPC, NETLOGON, SAMR (plus BROWSER only if needed). Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\NullSessionPipes (REG_MULTI_SZ).'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0670:
  title: "Network access: Remotely accessible registry paths and subpaths (member server): standard list or not configured"
  description: "Lists registry keys, and everything under them, that remote users may read through the remote registry service. The check passes when the value is absent or holds the member server list (print, event log, OLAP, content index, Terminal Server, Perflib, SysmonLog)."
  rationale: "Keeping the list to the documented defaults avoids exposing extra configuration to remote readers."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Remotely accessible registry paths and subpaths = the standard member server list. Registry: HKLM\SYSTEM\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedPaths\Machine (REG_MULTI_SZ).'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0671:
  title: "Network access: Restrict clients allowed to make remote calls to SAM: Administrators only"
  description: "Sets the security descriptor that decides who may query the local Security Accounts Manager over RPC. The expected descriptor O:BAG:BAD:(A;;RC;;;BA) grants remote access to Administrators only."
  rationale: "Restricting remote SAM queries stops ordinary users from enumerating local accounts and groups."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Restrict clients allowed to make remote calls to SAM = Administrators: Remote Access: Allow. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RestrictRemoteSAM (REG_SZ) = O:BAG:BAD:(A;;RC;;;BA).'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0672:
  title: "Shutdown: Allow system to be shut down without having to log on: Disabled"
  description: "Controls whether the Shut Down command is offered on the sign-in screen to people who have not signed in."
  rationale: "Only authenticated, authorised users should be able to take a server offline."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Shutdown: Allow system to be shut down without having to log on = Disabled. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ShutdownWithoutLogon (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-6], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.312(a)(1)"], iso_27001: [A.8.2] }
S0673:
  title: "User Account Control: Behavior of the elevation prompt for administrators in Admin Approval Mode: Prompt for credentials or consent on the secure desktop"
  description: "Sets what an administrator sees when a program asks for elevation. Value 1 asks for credentials and value 2 asks for consent, both on the secure desktop."
  rationale: "A secure-desktop prompt makes every elevation a deliberate act that other programs cannot spoof or approve."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > User Account Control: Behavior of the elevation prompt for administrators in Admin Approval Mode = Prompt for consent on the secure desktop (or Prompt for credentials on the secure desktop). Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ConsentPromptBehaviorAdmin (REG_DWORD) = 1 or 2.'
  compliance: { nist_800_53: [AC-6], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.312(a)(1)"], iso_27001: [A.8.2] }
S0674:
  title: "Audit Kerberos Authentication Service: Success and Failure"
  description: "Records Kerberos ticket-granting ticket requests handled by a domain controller."
  rationale: "TGT request events show who signed in to the domain and expose brute-force and ticket attacks."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Account Logon > Audit Kerberos Authentication Service = Success and Failure. Command: auditpol /set /subcategory:"Kerberos Authentication Service" /success:enable /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0675:
  title: "Audit Kerberos Service Ticket Operations: Success and Failure"
  description: "Records Kerberos service ticket requests issued by a domain controller."
  rationale: "Service ticket events help trace access to services and detect ticket harvesting for offline cracking."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Account Logon > Audit Kerberos Service Ticket Operations = Success and Failure. Command: auditpol /set /subcategory:"Kerberos Service Ticket Operations" /success:enable /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0676:
  title: "Audit Computer Account Management: includes Success"
  description: "Records creation, change and deletion of computer accounts."
  rationale: "Unexpected computer accounts can be used for persistence or relay attacks."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Account Management > Audit Computer Account Management = Success (or Success and Failure). Command: auditpol /set /subcategory:"Computer Account Management" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0677:
  title: "Audit Distribution Group Management: includes Success"
  description: "Records creation, change and deletion of distribution groups and their membership."
  rationale: "Distribution group changes can redirect mail and hint at account misuse."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Account Management > Audit Distribution Group Management = Success (or Success and Failure). Command: auditpol /set /subcategory:"Distribution Group Management" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0678:
  title: "Audit Other Account Management Events: includes Success"
  description: "Records other account events, such as access to password hashes or changes to password policy."
  rationale: "These events can reveal attempts to read account secrets or weaken account rules."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Account Management > Audit Other Account Management Events = Success (or Success and Failure). Command: auditpol /set /subcategory:"Other Account Management Events" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0679:
  title: "Audit Directory Service Access: includes Failure"
  description: "Records attempts to access Active Directory objects that carry an auditing entry; failures show refused access."
  rationale: "Refused directory access can indicate reconnaissance or attempts to reach protected objects."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > DS Access > Audit Directory Service Access = Failure (or Success and Failure). Command: auditpol /set /subcategory:"Directory Service Access" /failure:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0680:
  title: "Audit Directory Service Changes: includes Success"
  description: "Records creation, modification, move and deletion of Active Directory objects."
  rationale: "Directory changes can grant rights or alter policy, so a record of what changed is essential."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > DS Access > Audit Directory Service Changes = Success (or Success and Failure). Command: auditpol /set /subcategory:"Directory Service Changes" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0681:
  title: "Remote UAC token filtering for local accounts: LocalAccountTokenFilterPolicy = 1"
  description: "Controls whether local accounts that sign in over the network receive a filtered token. The check expects the value 1, which gives remote local administrators a full token."
  rationale: "This value decides how much power a remote local account gets, so it must be set deliberately and reviewed against pass-the-hash risk."
  remediation: 'Computer Configuration > Policies > Administrative Templates > MS Security Guide > Apply UAC restrictions to local accounts on network logons (security baseline template). The check reads HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LocalAccountTokenFilterPolicy (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-6], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.312(a)(1)"], iso_27001: [A.8.2] }
S0682:
  title: "Structured Exception Handling Overwrite Protection: DisableExceptionChainValidation = 1"
  description: "Controls the kernel setting that validates exception handler chains (SEHOP). The check expects DisableExceptionChainValidation = 1."
  rationale: "SEHOP blocks a common stack-overflow exploit technique, so its state must be set deliberately by policy."
  remediation: 'Computer Configuration > Policies > Administrative Templates > MS Security Guide > Enable Structured Exception Handling Overwrite Protection (SEHOP) (security baseline template). The check reads HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\kernel\DisableExceptionChainValidation (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SI-16], pci_dss: ["2.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0683:
  title: "Allow ICMP redirects to override OSPF generated routes: Disabled or not set"
  description: "Controls whether ICMP redirect messages may change the computer's routing table. The check passes when the value is absent or 0."
  rationale: "Forged ICMP redirects can send traffic through an attacker's machine."
  remediation: 'Computer Configuration > Policies > Administrative Templates > MSS (Legacy) > MSS: (EnableICMPRedirect) Allow ICMP redirects to override OSPF generated routes = Disabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\EnableICMPRedirect (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-7, SC-7], pci_dss: ["2.2.4"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0684:
  title: "Allow IRDP to detect and configure Default Gateway addresses: Disabled or not set"
  description: "Controls whether the computer uses ICMP Router Discovery to learn default gateways. The check passes when the value is absent or 0."
  rationale: "An attacker could advertise a rogue gateway and intercept traffic."
  remediation: 'Computer Configuration > Policies > Administrative Templates > MSS (Legacy) > MSS: (PerformRouterDiscovery) Allow IRDP to detect and configure Default Gateway addresses = Disabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\PerformRouterDiscovery (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-7, SC-7], pci_dss: ["2.2.4"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0685:
  title: "Configure NetBIOS settings: Disable NetBIOS name resolution on public networks"
  description: "Controls whether the DNS client also resolves names over NetBIOS. Value 2 turns NetBIOS name resolution off on networks marked as public."
  rationale: "NetBIOS replies can be spoofed to capture credentials, and untrusted networks are where that risk is highest."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > DNS Client > Configure NetBIOS settings = Enabled: Disable NetBIOS name resolution on public networks. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient\EnableNetbios (REG_DWORD) = 2.'
  compliance: { nist_800_53: [CM-7, SC-7], pci_dss: ["2.2.4"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0686:
  title: "Point and Print Restrictions: When installing drivers for a new connection: Show warning and elevation prompt"
  description: "Makes users see a warning and an administrator elevation prompt before Point and Print installs a driver for a new printer connection."
  rationale: "Silent driver installs were abused to run attacker code as SYSTEM."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Printers > Point and Print Restrictions = Enabled, When installing drivers for a new connection: Show warning and elevation prompt. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint\NoWarningNoElevationOnInstall (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-6], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.312(a)(1)"], iso_27001: [A.8.2] }
S0687:
  title: "Do not use temporary folders per session: Disabled or not configured"
  description: "Gives each Remote Desktop session its own temporary folder. The check passes when the value is absent or 1."
  rationale: "Separate temporary folders keep data from one session out of another."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Temporary folders > Do not use temporary folders per session = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\PerSessionTempDir (REG_DWORD) = 1.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0688:
  title: "Allow indexing of encrypted files: Disabled"
  description: "Controls whether Windows Search indexes encrypted files and stores."
  rationale: "Indexing encrypted content may place readable copies of protected data in the search index."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Search > Allow indexing of encrypted files = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search\AllowIndexingEncryptedStoresOrItems (REG_DWORD) = 0.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0689:
  title: "Set what information is shared in Search: Anonymous info"
  description: "Sets what user and location information Windows Search shares with Bing. Value 3 shares only anonymous information."
  rationale: "Limiting what is shared reduces exposure of user and organisation details to external services."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Search > Set what information is shared in Search = Enabled: Anonymous info. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search\ConnectedSearchPrivacy (REG_DWORD) = 3.'
  compliance: { nist_800_53: [CM-7, PT-2], pci_dss: ["2.2.4"], hipaa: ["164.312(e)(1)"], iso_27001: [A.5.34] }
S0690:
  title: "Automatically send memory dumps for OS-generated error reports: Disabled or not configured"
  description: "Controls whether memory dumps from operating system errors are sent to Microsoft without asking. The check passes when the value is absent or 0."
  rationale: "Memory dumps may contain passwords, keys and business data."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Error Reporting > Automatically send memory dumps for OS-generated error reports = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting\AutoApproveOSDumps (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-7, PT-2], pci_dss: ["2.2.4"], hipaa: ["164.312(e)(1)"], iso_27001: [A.5.34] }
S0691:
  title: "Domain member: Maximum machine account password age: 365 days or fewer, but not 0"
  description: "Sets how often the computer changes its computer account password. The check requires 1 to 365 days."
  rationale: "Regular rotation limits how long a captured machine password stays useful; 0 would stop rotation."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain member: Maximum machine account password age = 1 to 365 days. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\MaximumPasswordAge (REG_DWORD) = 1-365.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0692:
  title: "Domain controller: Allow vulnerable Netlogon secure channel connections: not configured"
  description: "Lists accounts a domain controller still accepts over a Netlogon channel without secure RPC. The check requires that no allow list is configured."
  rationale: "Any account on this list can bypass the protection added against Netlogon channel downgrade attacks."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain controller: Allow vulnerable Netlogon secure channel connections: leave Not Defined. Delete HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\VulnerableChannelAllowList if present.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0693:
  title: "Domain controller: Refuse machine account password changes: Disabled"
  description: "When enabled, the domain controller refuses computer account password changes from domain members. The check requires the value to be present and 0."
  rationale: "Computer account passwords must rotate regularly; refusing changes leaves long-lived machine secrets."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain controller: Refuse machine account password changes = Disabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\RefusePasswordChange (REG_DWORD) = 0.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0694:
  title: "Microsoft network client: Send unencrypted password to third-party SMB servers: EnablePlainTextPassword = 1"
  description: "Controls whether the SMB client may send a clear-text password to servers that do not support password encryption. The check expects the value 1."
  rationale: "Clear-text passwords can be captured on the network, so this setting must be set deliberately and reviewed."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Microsoft network client: Send unencrypted password to third-party SMB servers. The check reads HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters\EnablePlainTextPassword (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0695:
  title: "Network security: Allow LocalSystem NULL session fallback: Disabled"
  description: "Controls whether NTLM may fall back to a null session when used by Local System."
  rationale: "Null sessions give weak or no protection to the data exchanged."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network security: Allow LocalSystem NULL session fallback = Disabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0\AllowNullSessionFallback (REG_DWORD) = 0.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0696:
  title: "Network security: Allow PKU2U authentication requests to this computer to use online identities: Disabled"
  description: "Controls whether peer-to-peer authentication with online identities (PKU2U) is accepted by this computer."
  rationale: "Servers in a domain should authenticate users through the domain, not through outside identities."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network security: Allow PKU2U authentication requests to this computer to use online identities = Disabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\pku2u\AllowOnlineID (REG_DWORD) = 0.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0697:
  title: "Windows Firewall: Public profile outbound connections: Allow"
  description: "Allows outbound connections on the public profile unless a rule blocks them."
  rationale: "Allowing outbound traffic by default keeps normal operation working while inbound traffic stays restricted."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Windows Defender Firewall with Advanced Security > Properties > Public Profile > Outbound connections = Allow (default). Registry: HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile\DefaultOutboundAction (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SC-7], pci_dss: ["1.5.1"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0698:
  title: "Audit PNP Activity: includes Success"
  description: "Records when Plug and Play detects an external device."
  rationale: "Device connection records help trace the use of unauthorised hardware such as USB storage."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Detailed Tracking > Audit PNP Activity = Success. Command: auditpol /set /subcategory:"Plug and Play Events" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0699:
  title: "Audit Group Membership: includes Success"
  description: "Records the group memberships of each account when it signs in."
  rationale: "Knowing which groups a session held shows what access an account actually had at the time."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies > Logon/Logoff > Audit Group Membership = Success. Command: auditpol /set /subcategory:"Group Membership" /success:enable'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0700:
  title: "Configure RPC packet level privacy setting for incoming connections: Enabled"
  description: "Makes the Print Spooler require packet privacy (encryption) on incoming RPC connections."
  rationale: "Packet privacy protects print RPC traffic and closes an authentication bypass in the spooler."
  remediation: 'Computer Configuration > Policies > Administrative Templates > MS Security Guide > Configure RPC packet level privacy setting for incoming connections = Enabled (security baseline template). Registry: HKLM\SYSTEM\CurrentControlSet\Control\Print\RpcAuthnLevelPrivacyEnabled (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0701:
  title: "Turn on Mapper I/O (LLTDIO) driver: Disabled"
  description: "Controls the Link-Layer Topology Discovery mapper driver, which lets the computer discover other devices. All four policy values must be 0."
  rationale: "Network discovery protocols are not needed on servers and reveal network layout to others."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Link-Layer Topology Discovery > Turn on Mapper I/O (LLTDIO) driver = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LLTD AllowLLTDIOOnDomain, AllowLLTDIOOnPublicNet, EnableLLTDIO, ProhibitLLTDIOOnPrivateNet (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0702:
  title: "Turn on Responder (RSPNDR) driver: Disabled"
  description: "Controls the Link-Layer Topology Discovery responder driver, which lets the computer be discovered. All four policy values must be 0."
  rationale: "Answering discovery requests reveals the server to anyone on the local network."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Link-Layer Topology Discovery > Turn on Responder (RSPNDR) driver = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LLTD AllowRspndrOnDomain, AllowRspndrOnPublicNet, EnableRspndr, ProhibitRspndrOnPrivateNet (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0703:
  title: "Internet Connection Sharing on the domain network: NC_ShowSharedAccessUI = 1"
  description: "Controls whether administrators may turn on Internet Connection Sharing, which would let the server route traffic for other devices. The check expects the policy value NC_ShowSharedAccessUI = 1."
  rationale: "Connection sharing can bridge the internal network to another network, so its availability must be set by policy."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Network Connections > Prohibit use of Internet Connection Sharing on your DNS domain network. The check reads HKLM\SOFTWARE\Policies\Microsoft\Windows\Network Connections\NC_ShowSharedAccessUI (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-7], pci_dss: ["1.5.1"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0704:
  title: "Hardened UNC Paths: NETLOGON and SYSVOL require mutual authentication and integrity"
  description: "Requires mutual authentication and integrity whenever the computer connects to the NETLOGON and SYSVOL shares of any server."
  rationale: "Hardening these shares prevents a spoofed server from delivering malicious Group Policy or logon scripts."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Network Provider > Hardened UNC Paths = Enabled with \\*\NETLOGON and \\*\SYSVOL set to RequireMutualAuthentication=1, RequireIntegrity=1. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths (REG_SZ values).'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0705:
  title: "Configuration of wireless settings using Windows Connect Now: Disabled"
  description: "Turns off the Windows Connect Now registrars that configure wireless settings over UPnP, in-band 802.11, flash drives and portable devices. All five policy values must be 0."
  rationale: "Servers do not need wireless provisioning, and the registrars add network-reachable features."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Windows Connect Now > Configuration of wireless settings using Windows Connect Now = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\WCN\Registrars EnableRegistrars, DisableUPnPRegistrar, DisableInBand802DOT11Registrar, DisableFlashConfigRegistrar, DisableWPDRegistrar (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0706:
  title: "Configure RPC connection settings: RpcUseNamedPipeProtocol = 1"
  description: "Sets which protocol the print client uses for outgoing RPC connections to print servers. The check expects RpcUseNamedPipeProtocol = 1."
  rationale: "Fixing the print RPC transport by policy keeps print traffic on the protocol the organisation has secured."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Printers > Configure RPC connection settings = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC\RpcUseNamedPipeProtocol (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0707:
  title: "Configure RPC connection settings: RpcAuthentication = 1"
  description: "Sets whether outgoing print RPC connections use authentication. The check expects RpcAuthentication = 1."
  rationale: "Authenticated print RPC prevents a client from talking to an impersonated print server."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Printers > Configure RPC connection settings = Enabled, Use authentication for outgoing RPC connections. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC\RpcAuthentication (REG_DWORD) = 1.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0708:
  title: "Configure RPC listener settings: RpcProtocols = 1"
  description: "Sets which protocols the print server accepts for incoming RPC connections. The check expects RpcProtocols = 1."
  rationale: "Limiting incoming print RPC protocols reduces the spooler's network attack surface."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Printers > Configure RPC listener settings = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC\RpcProtocols (REG_DWORD) = 1.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0709:
  title: "Configure RPC listener settings: Authentication protocol for incoming RPC connections: Kerberos"
  description: "Sets the authentication protocol the print server requires for incoming RPC connections. Value 1 requires Kerberos."
  rationale: "Kerberos gives mutual authentication and avoids weaker NTLM for print traffic."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Printers > Configure RPC listener settings = Enabled, Authentication protocol to use for incoming RPC connections: Kerberos. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC\ForceKerberosForRpc (REG_DWORD) = 1.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0710:
  title: "Turn On Virtualization Based Security: Platform Security Level: Secure Boot or Secure Boot and DMA Protection"
  description: "Sets the platform features virtualization-based security requires. Value 1 requires Secure Boot and value 3 requires Secure Boot plus DMA protection."
  rationale: "Requiring these features keeps the isolated security environment trustworthy from boot onwards."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Device Guard > Turn On Virtualization Based Security = Enabled, Select Platform Security Level: Secure Boot (or Secure Boot and DMA Protection). Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\RequirePlatformSecurityFeatures (REG_DWORD) = 1 or 3.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0711:
  title: "Turn On Virtualization Based Security: Credential Guard Configuration: LsaCfgFlags = 3"
  description: "Sets whether Credential Guard isolates domain credential secrets inside virtualization-based security. The check expects LsaCfgFlags = 3."
  rationale: "Credential Guard stops tools that dump password hashes and Kerberos tickets from the LSA process."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Device Guard > Turn On Virtualization Based Security = Enabled, Credential Guard Configuration. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\LsaCfgFlags (REG_DWORD) = 3.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0712:
  title: "Turn On Virtualization Based Security: Credential Guard Configuration: Disabled (domain controller)"
  description: "Sets whether Credential Guard runs. On a domain controller it adds no protection for the directory database, so the check expects LsaCfgFlags = 0."
  rationale: "Turning it off on domain controllers avoids compatibility problems without losing protection there."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Device Guard > Turn On Virtualization Based Security = Enabled, Credential Guard Configuration: Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\LsaCfgFlags (REG_DWORD) = 0.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0713:
  title: "Turn On Virtualization Based Security: Secure Launch Configuration: Enabled"
  description: "Turns on System Guard Secure Launch, which uses the processor's dynamic root of trust to start the system in a measured, trusted state."
  rationale: "Secure Launch protects against firmware-level tampering during boot."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Device Guard > Turn On Virtualization Based Security = Enabled, Secure Launch Configuration: Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\ConfigureSystemGuardLaunch (REG_DWORD) = 1.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0714:
  title: "Support device authentication using certificate: Enabled, Automatic"
  description: "Lets the computer authenticate to the domain with its device certificate through Kerberos PKINIT, using automatic mode."
  rationale: "Certificate-based device authentication is stronger than a password-based computer secret."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Kerberos > Support device authentication using certificate = Enabled: Automatic. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\kerberos\parameters DevicePKInitEnabled (REG_DWORD) = 1, DevicePKInitBehavior (REG_DWORD) = 0.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0715:
  title: "Configure validation of ROCA-vulnerable WHfB keys during authentication: Audit or Block"
  description: "Makes the domain controller check Windows Hello for Business keys for the ROCA weakness. Value 1 audits and value 2 blocks such keys."
  rationale: "Keys generated by affected TPM firmware can be factored, letting an attacker impersonate the user."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Security Account Manager > Configure validation of ROCA-vulnerable WHfB keys during authentication = Enabled: Audit (or Block). Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\SAM\SamNGCKeyROCAValidation (REG_DWORD) >= 1.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0716:
  title: "Allow a Windows app to share application data between users: Disabled"
  description: "Controls whether packaged apps may share data between user accounts through a shared local folder."
  rationale: "Data shared between users can leak information from one account to another."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > App Package Deployment > Allow a Windows app to share application data between users = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\AppModel\StateManager\AllowSharedLocalAppData (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-7, PT-2], pci_dss: ["2.2.4"], hipaa: ["164.312(e)(1)"], iso_27001: [A.5.34] }
S0717:
  title: "Allow Diagnostic Data: Off/Security (0) or Required (1)"
  description: "Sets how much diagnostic data Windows sends to Microsoft. The check passes at level 0 or 1."
  rationale: "Limiting diagnostic data reduces the system and usage information that leaves the organisation."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Data Collection and Preview Builds > Allow Diagnostic Data (Allow Telemetry) = Enabled: Diagnostic data off (not recommended) or Send required diagnostic data. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection\AllowTelemetry (REG_DWORD) = 0 or 1.'
  compliance: { nist_800_53: [CM-7, PT-2], pci_dss: ["2.2.4"], hipaa: ["164.312(e)(1)"], iso_27001: [A.5.34] }
S0718:
  title: "Join Microsoft MAPS: Disabled"
  description: "Controls whether Microsoft Defender Antivirus sends information about detected software to the Microsoft cloud protection service. The check expects the value to be present and 0."
  rationale: "On sensitive servers, organisations may need to control what file and detection data leaves the network."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > MAPS > Join Microsoft MAPS = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet\SpynetReporting (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-7, PT-2], pci_dss: ["2.2.4"], hipaa: ["164.312(e)(1)"], iso_27001: [A.5.34] }
S0719:
  title: "Allow Windows Ink Workspace: Disabled or On but disallow access above lock"
  description: "Controls access to Windows Ink Workspace. Value 0 turns it off; value 1 keeps it on but not from the lock screen."
  rationale: "Ink Workspace on the lock screen offers features to someone who has not signed in."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Ink Workspace > Allow Windows Ink Workspace = Enabled: Disabled (or On, but disallow access above lock). Registry: HKLM\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace\AllowWindowsInkWorkspace (REG_DWORD) = 0 or 1.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0720:
  title: "Allow user control over installs: Disabled"
  description: "Controls whether users may change Windows Installer options that are normally reserved for administrators, such as the install folder."
  rationale: "Letting users change protected install options can be used to bypass security controls."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Installer > Allow user control over installs = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\Installer\EnableUserControl (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-11], pci_dss: ["2.2.4"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.19] }
S0721:
  title: "Always install with elevated privileges: Disabled"
  description: "Controls whether Windows Installer runs every package with system privileges, even for standard users."
  rationale: "When enabled, any user can gain SYSTEM rights by installing a crafted package."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Installer > Always install with elevated privileges = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\Installer\AlwaysInstallElevated (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-6], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.312(a)(1)"], iso_27001: [A.8.2] }
S0722:
  title: "Prevent Internet Explorer security prompt for Windows Installer scripts: Disabled"
  description: "Controls whether web-based scripts can install software through Windows Installer without a security warning."
  rationale: "The warning gives the user a chance to stop a web page from installing software."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Installer > Prevent Internet Explorer security prompt for Windows Installer scripts = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\Installer\SafeForScripting (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-11], pci_dss: ["2.2.4"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.19] }
S0723:
  title: "Manage preview builds: Disable preview builds"
  description: "Controls whether the computer may receive Windows Insider preview builds. Value 0 blocks them."
  rationale: "Preview builds are pre-release software and not suited to production servers."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Update > Windows Update for Business > Manage preview builds = Enabled: Disable preview builds. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\ManagePreviewBuildsPolicyValue (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SI-2], pci_dss: ["6.3.3"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.8] }
S0724:
  title: "Select when Preview Builds and Feature Updates are received: Enabled, deferred 180 or more days"
  description: "Defers feature updates by a set number of days after release. The check requires deferral to be on with 180 or more days."
  rationale: "Deferring feature updates gives time to test them before they reach production servers."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Update > Windows Update for Business > Select when Preview Builds and Feature Updates are received = Enabled, 180 or more days. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate DeferFeatureUpdates (REG_DWORD) = 1, DeferFeatureUpdatesPeriodInDays (REG_DWORD) >= 180.'
  compliance: { nist_800_53: [SI-2], pci_dss: ["6.3.3"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.8] }
S0725:
  title: "Maximum password age: 365 days or fewer, but not 0"
  description: "Sets how long a user password can be used before it must be changed. The check requires 1 to 365 days."
  rationale: "Passwords that never expire stay useful to an attacker indefinitely once disclosed."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Account Policies > Password Policy > Maximum password age = 1 to 365 days. The check reads MaximumPasswordAge from secedit /export.'
  compliance: { nist_800_53: [IA-5], pci_dss: ["8.3.6", "8.3.9"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: [A.5.17] }
S0726:
  title: "Minimum password age: 1 or more days"
  description: "Sets how many days a password must be kept before the user can change it again."
  rationale: "A minimum age stops users cycling through changes to get back to an old password."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Account Policies > Password Policy > Minimum password age = 1 or more days. The check reads MinimumPasswordAge from secedit /export.'
  compliance: { nist_800_53: [IA-5], pci_dss: ["8.3.6", "8.3.9"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: [A.5.17] }
S0727:
  title: "Minimum password length: 14 or more characters"
  description: "Sets the fewest characters a user password may contain."
  rationale: "Longer passwords are much harder to guess or crack."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Account Policies > Password Policy > Minimum password length = 14 or more characters. The check reads MinimumPasswordLength from secedit /export.'
  compliance: { nist_800_53: [IA-5], pci_dss: ["8.3.6", "8.3.9"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: [A.5.17] }
S0728:
  title: "Account lockout duration: 15 or more minutes"
  description: "Sets how many minutes a locked-out account stays locked before it unlocks on its own."
  rationale: "A meaningful lockout slows down online password guessing."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Account Policies > Account Lockout Policy > Account lockout duration = 15 or more minutes. The check reads LockoutDuration from secedit /export.'
  compliance: { nist_800_53: [AC-7], pci_dss: ["8.3.4"], hipaa: ["164.308(a)(5)(ii)(C)"], iso_27001: [A.8.5] }
S0729:
  title: "Account lockout threshold: 5 or fewer invalid attempts, but not 0"
  description: "Sets how many failed sign-in attempts lock the account. The check requires 1 to 5."
  rationale: "A low threshold stops attackers from trying many passwords against an account; 0 would turn lockout off."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Account Policies > Account Lockout Policy > Account lockout threshold = 1 to 5 invalid logon attempts. The check reads LockoutBadCount from secedit /export.'
  compliance: { nist_800_53: [AC-7], pci_dss: ["8.3.4"], hipaa: ["164.308(a)(5)(ii)(C)"], iso_27001: [A.8.5] }
S0730:
  title: "Reset account lockout counter after: 15 or more minutes"
  description: "Sets how many minutes must pass after a failed sign-in before the failed-attempt counter returns to zero."
  rationale: "A longer reset window limits how many guesses an attacker can make over time without triggering lockout."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Account Policies > Account Lockout Policy > Reset account lockout counter after = 15 or more minutes. The check reads ResetLockoutCount from secedit /export.'
  compliance: { nist_800_53: [AC-7], pci_dss: ["8.3.4"], hipaa: ["164.308(a)(5)(ii)(C)"], iso_27001: [A.8.5] }
S0731:
  title: "Accounts: Guest account status: Disabled"
  description: "Checks that the built-in local Guest account (relative ID 501) is disabled."
  rationale: "The Guest account allows sign-in without a known user identity and often without a password."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Accounts: Guest account status = Disabled. Command: net user Guest /active:no (use the renamed account name if it was renamed).'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0732:
  title: "Domain controller: Allow vulnerable Netlogon secure channel connections: not configured"
  description: "Lists accounts a domain controller still accepts over a Netlogon channel without secure RPC. The check passes when no allow list value is present."
  rationale: "Any account on this list can bypass the protection added against Netlogon channel downgrade attacks."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain controller: Allow vulnerable Netlogon secure channel connections: leave Not Defined. Delete HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\VulnerableChannelAllowList if present.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0733:
  title: "Domain member: Maximum machine account password age: 30 days"
  description: "Sets how often the computer changes its computer account password. The check expects 30 days."
  rationale: "A short rotation interval reduces the window in which a captured machine password can be abused."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain member: Maximum machine account password age = 30 days. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\MaximumPasswordAge (REG_DWORD) = 30.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0734:
  title: "Network access: Remotely accessible registry paths and subpaths (member server): standard list"
  description: "Lists registry keys, and everything under them, that remote users may read through the remote registry service. The value must hold the member server list (print, event log, OLAP, content index, Terminal Server, Perflib, SysmonLog)."
  rationale: "Keeping the list to the documented defaults avoids exposing extra configuration to remote readers."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Remotely accessible registry paths and subpaths = the standard member server list. Registry: HKLM\SYSTEM\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedPaths\Machine (REG_MULTI_SZ).'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0735:
  title: "Network security: Minimum session security for NTLM SSP based (including secure RPC) clients: Require 128-bit encryption"
  description: "Sets the minimum protection the NTLM client demands for its sessions. The check expects 536870912, which requires 128-bit encryption."
  rationale: "Strong session encryption protects NTLM-authenticated traffic from eavesdropping."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network security: Minimum session security for NTLM SSP based (including secure RPC) clients = Require 128-bit encryption. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0\NtlmMinClientSec (REG_DWORD) = 536870912.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0736:
  title: "Print Spooler service: Disabled"
  description: "Checks that the Print Spooler service is set to Disabled (start type 4)."
  rationale: "The spooler has a long history of remote and local privilege escalation flaws; servers that do not print should not run it."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > System Services > Print Spooler = Disabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Spooler\Start (REG_DWORD) = 4. Command: sc config Spooler start= disabled'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0737:
  title: "Print RPC authentication: RpcAuthentication = 1 (Printers policy key)"
  description: "Sets whether print RPC connections use authentication. This check reads RpcAuthentication = 1 directly under the Printers policy key."
  rationale: "Authenticated print RPC prevents a client from talking to an impersonated print server."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Printers > Configure RPC connection settings = Enabled. The check reads HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RpcAuthentication (REG_DWORD) = 1.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0738:
  title: "Turn On Virtualization Based Security: Credential Guard Configuration: Disabled or not configured"
  description: "Sets whether Credential Guard runs. The check passes when the policy is absent or LsaCfgFlags = 0, the expected state on domain controllers."
  rationale: "Credential Guard gives domain controllers no extra protection for the directory database and can cause compatibility problems there."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Device Guard > Turn On Virtualization Based Security > Credential Guard Configuration = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\LsaCfgFlags (REG_DWORD) = 0.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0739:
  title: "Enable App Installer: Disabled"
  description: "Controls whether App Installer is available to install packaged apps. The check requires the AppInstaller policy value to exist and reads the disabled state (0) under the PreviewBuilds key."
  rationale: "Servers do not need end-user app installation tools, which can be abused to deliver malware."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Desktop App Installer > Enable App Installer = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\AppInstaller\EnableAppInstaller (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-11], pci_dss: ["2.2.4"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.19] }
S0740:
  title: "Enable App Installer Experimental Features: Disabled"
  description: "Controls whether experimental App Installer and Windows Package Manager features may be turned on."
  rationale: "Experimental features have had less security review and do not belong on production servers."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Desktop App Installer > Enable App Installer Experimental Features = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\AppInstaller\EnableExperimentalFeatures (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-11], pci_dss: ["2.2.4"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.19] }
S0741:
  title: "Enable App Installer Hash Override: Disabled"
  description: "Controls whether users may tell Windows Package Manager to ignore a failed installer hash check."
  rationale: "The hash check confirms the installer has not been tampered with; overriding it allows modified installers to run."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Desktop App Installer > Enable App Installer Hash Override = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\AppInstaller\EnableHashOverride (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-11], pci_dss: ["2.2.4"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.19] }
S0742:
  title: "Enable App Installer ms-appinstaller protocol: Disabled"
  description: "Controls whether web pages can start app installs through the ms-appinstaller link scheme."
  rationale: "This link scheme has been abused to deliver malware straight from websites."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Desktop App Installer > Enable App Installer ms-appinstaller protocol = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\AppInstaller\EnableMSAppInstallerProtocol (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-11], pci_dss: ["2.2.4"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.19] }
S0743:
  title: "WinRM Client: Disallow Digest authentication: Enabled or not configured"
  description: "Controls whether the Windows Remote Management client may use Digest authentication. The check passes when AllowDigest is absent or 0."
  rationale: "Digest authentication is weaker than Kerberos or NTLMv2 and exposes more to offline attack."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Remote Management (WinRM) > WinRM Client > Disallow Digest authentication = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client\AllowDigest (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-17, SC-8], pci_dss: ["2.2.7"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20, A.8.24] }
S0744:
  title: "Manage preview builds: Disable preview builds once the next release is public"
  description: "Controls whether the computer may receive Windows Insider preview builds. Value 1 stops them once the next release is generally available."
  rationale: "Preview builds are pre-release software and not suited to production servers."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Update > Windows Update for Business > Manage preview builds = Enabled: Disable preview builds once the next release is public. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\ManagePreviewBuildsPolicyValue (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SI-2], pci_dss: ["6.3.3"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.8] }
S0745:
  title: "Select when Quality Updates are received: Enabled, 0 days"
  description: "Controls deferral of monthly quality (security) updates. The check requires the policy to be on with a deferral of 0 days."
  rationale: "Installing security fixes without delay shortens the time known vulnerabilities stay open."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Update > Windows Update for Business > Select when Quality Updates are received = Enabled, 0 days. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate DeferQualityUpdates (REG_DWORD) = 1, DeferQualityUpdatesPeriodInDays (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SI-2], pci_dss: ["6.3.3"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.8] }
S0746:
  title: "Domain member: Maximum machine account password age: 30 days or fewer, but not 0"
  description: "Sets how often the computer changes its computer account password. The check requires 1 to 30 days."
  rationale: "A short rotation interval reduces the window in which a captured machine password can be abused; 0 would stop rotation."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain member: Maximum machine account password age = 1 to 30 days. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\MaximumPasswordAge (REG_DWORD) = 1-30.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0747:
  title: "Interactive logon: Message text for users attempting to log on: configured"
  description: "Shows a text notice to everyone before they sign in. The check queries the registry and passes when the message text contains text."
  rationale: "A logon notice informs users of acceptable use and monitoring, which supports legal action against misuse."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Interactive logon: Message text for users attempting to log on = your organisation notice. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LegalNoticeText (REG_SZ) = non-empty text.'
  compliance: { nist_800_53: [AC-8], pci_dss: ["12.6.1"], hipaa: ["164.308(a)(5)(ii)(A)"], iso_27001: [A.5.10] }
S0748:
  title: "Interactive logon: Message title for users attempting to log on: configured"
  description: "Sets the title of the notice window shown before sign-in. The check queries the registry and passes when a title is present."
  rationale: "A titled notice makes the acceptable-use warning clear and consistent across systems."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Interactive logon: Message title for users attempting to log on = your notice title. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LegalNoticeCaption (REG_SZ) = non-empty text.'
  compliance: { nist_800_53: [AC-8], pci_dss: ["12.6.1"], hipaa: ["164.308(a)(5)(ii)(A)"], iso_27001: [A.5.10] }
S0749:
  title: "Interactive logon: Require Domain Controller authentication to unlock workstation: Enabled"
  description: "Forces a domain controller check of the account before a locked session can be unlocked, instead of relying on cached credentials."
  rationale: "Disabled or changed accounts cannot keep unlocking a session with an old cached password."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Interactive logon: Require Domain Controller authentication to unlock workstation = Enabled. Registry: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\ForceUnlockLogon (REG_DWORD) = 1.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0750:
  title: "Microsoft network server: Server SPN target name validation level: Accept if provided by client or Required from client"
  description: "Controls how strictly the SMB server checks the service principal name the client presents. The check requires level 1 or 2."
  rationale: "Validating the target name helps stop SMB relay attacks against the server."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Microsoft network server: Server SPN target name validation level = Accept if provided by client (or Required from client). Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\SMBServerNameHardeningLevel (REG_DWORD) = 1 or 2.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0751:
  title: "Network access: Allow anonymous SID/Name translation: Disabled"
  description: "Determines whether an anonymous user can translate security identifiers to account names. The check reads LSAAnonymousNameLookup = 0 from the exported security policy."
  rationale: "Blocking anonymous name lookups denies attackers an easy way to learn account names, including a renamed Administrator."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Allow anonymous SID/Name translation = Disabled. The check reads LSAAnonymousNameLookup from secedit /export.'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0752:
  title: "Network access: Named Pipes that can be accessed anonymously (domain controller): LSARPC, NETLOGON, SAMR (and BROWSER if needed)"
  description: "Lists the named pipes an anonymous session may open. On a domain controller the value must be present and list the domain service pipes LSARPC, NETLOGON and SAMR, with BROWSER only where the legacy browser is used."
  rationale: "Limiting anonymous pipes to the ones domain services require keeps other RPC interfaces closed to unauthenticated users."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Named Pipes that can be accessed anonymously = LSARPC, NETLOGON, SAMR (plus BROWSER only if needed). Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\NullSessionPipes (REG_MULTI_SZ).'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0753:
  title: "Network access: Named Pipes that can be accessed anonymously (member server): None, or only RDS licensing and BROWSER pipes"
  description: "Lists the named pipes an anonymous session may open. On a member server the list should be empty, except HydraLSPipe and TermServLicensing on RDS licensing servers and BROWSER where the legacy browser is used."
  rationale: "Every anonymously reachable pipe is an unauthenticated entry point."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Named Pipes that can be accessed anonymously = blank (or HydraLSPipe, TermServLicensing / BROWSER where needed). Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\NullSessionPipes (REG_MULTI_SZ).'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0754:
  title: "Network access: Remotely accessible registry paths: standard list"
  description: "Lists the exact registry keys remote users may read through the remote registry service. The value must include the System\\CurrentControlSet\\Control keys and Software\\Microsoft\\Windows NT\\CurrentVersion."
  rationale: "Keeping the list to the standard keys stops remote users reading other configuration data."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Remotely accessible registry paths = System\CurrentControlSet\Control\ProductOptions, System\CurrentControlSet\Control\Server Applications, Software\Microsoft\Windows NT\CurrentVersion. Registry: HKLM\SYSTEM\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedExactPaths\Machine (REG_MULTI_SZ).'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0755:
  title: "Network access: Shares that can be accessed anonymously: None"
  description: "Lists the network shares an anonymous session may open. The check passes when the value is absent or empty."
  rationale: "Any share listed here is readable without authentication."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Shares that can be accessed anonymously = blank. Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\NullSessionShares (REG_MULTI_SZ) = empty.'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0756:
  title: "Network security: Configure encryption types allowed for Kerberos: AES128, AES256 and future encryption types"
  description: "Limits the encryption types Kerberos may use. The value 2147483640 allows AES128-HMAC-SHA1, AES256-HMAC-SHA1 and future types, and excludes DES and RC4."
  rationale: "DES and RC4 tickets are weak and make offline cracking of service account passwords easier."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network security: Configure encryption types allowed for Kerberos = AES128_HMAC_SHA1, AES256_HMAC_SHA1, Future encryption types. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters\SupportedEncryptionTypes (REG_DWORD) = 2147483640.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0757:
  title: "Network security: LDAP client signing requirements: Negotiate signing or Require signing"
  description: "Sets whether LDAP requests from this computer are signed. The check accepts value 1 or 2."
  rationale: "Signed LDAP traffic cannot be silently altered or relayed by an attacker in the middle."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network security: LDAP client signing requirements = Negotiate signing (or Require signing). Registry: HKLM\SYSTEM\CurrentControlSet\Services\LDAP\LDAPClientIntegrity (REG_DWORD) = 1 or 2.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0758:
  title: "Network security: Minimum session security for NTLM SSP based (including secure RPC) clients: Require NTLMv2 session security, Require 128-bit encryption"
  description: "Sets the minimum protection the NTLM client demands for its sessions. The value 537395200 requires both NTLMv2 session security and 128-bit encryption."
  rationale: "Requiring NTLMv2 session security and strong encryption protects NTLM traffic from downgrade and eavesdropping."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network security: Minimum session security for NTLM SSP based (including secure RPC) clients = Require NTLMv2 session security, Require 128-bit encryption. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0\NtlmMinClientSec (REG_DWORD) = 537395200.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0759:
  title: "Shutdown: Allow system to be shut down without having to log on: Disabled"
  description: "Controls whether the Shut Down command is offered on the sign-in screen to people who have not signed in."
  rationale: "Only authenticated, authorised users should be able to take a server offline."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Shutdown: Allow system to be shut down without having to log on = Disabled. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ShutdownWithoutLogon (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-6], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.312(a)(1)"], iso_27001: [A.8.2] }
S0760:
  title: "Windows Firewall: Public profile outbound connections: Allow or not configured"
  description: "Allows outbound connections on the public profile unless a rule blocks them. The check passes when the value is absent or 0."
  rationale: "Allowing outbound traffic by default keeps normal operation working while inbound traffic stays restricted."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Windows Defender Firewall with Advanced Security > Properties > Public Profile > Outbound connections = Allow (default). Registry: HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile\DefaultOutboundAction (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SC-7], pci_dss: ["1.5.1"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0761:
  title: "Local Administrator Password Solution (legacy LAPS): client extension installed"
  description: "Checks that the Group Policy client-side extension of the legacy Local Administrator Password Solution is registered."
  rationale: "Without automatic management, local administrator passwords tend to be shared across machines and enable lateral movement."
  remediation: 'Install the legacy LAPS client (AdmPwd); it registers HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\GPExtensions\{D76B9641-3288-4f75-942D-087DE603E3EA}. On newer systems use Windows LAPS instead.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0762:
  title: "Turn on Mapper I/O (LLTDIO) driver: Disabled or not configured"
  description: "Controls the Link-Layer Topology Discovery mapper driver. The check passes when the policy is absent or its values are 0."
  rationale: "Network discovery protocols are not needed on servers and reveal network layout to others."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Link-Layer Topology Discovery > Turn on Mapper I/O (LLTDIO) driver = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LLTD AllowLLTDIOOnDomain, AllowLLTDIOOnPublicNet, EnableLLTDIO, ProhibitLLTDIOOnPrivateNet (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0763:
  title: "Turn on Responder (RSPNDR) driver: Disabled or not configured"
  description: "Controls the Link-Layer Topology Discovery responder driver. The check passes when the policy is absent or EnableRspndr is not 1."
  rationale: "Answering discovery requests reveals the server to anyone on the local network."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Link-Layer Topology Discovery > Turn on Responder (RSPNDR) driver = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LLTD\EnableRspndr (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0764:
  title: "Hardened UNC Paths: NETLOGON and SYSVOL require mutual authentication and integrity"
  description: "Requires mutual authentication and integrity whenever the computer connects to the NETLOGON and SYSVOL shares of any server."
  rationale: "Hardening these shares prevents a spoofed server from delivering malicious Group Policy or logon scripts."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Network Provider > Hardened UNC Paths = Enabled with \\*\NETLOGON and \\*\SYSVOL set to RequireMutualAuthentication=1, RequireIntegrity=1. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths (REG_SZ values).'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0765:
  title: "Print RPC listener authentication protocol: Kerberos (ForceKerberosForRpc = 1, Printers policy key)"
  description: "Sets the authentication protocol the print server requires for incoming RPC connections. This check reads ForceKerberosForRpc = 1 directly under the Printers policy key."
  rationale: "Kerberos gives mutual authentication and avoids weaker NTLM for print traffic."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Printers > Configure RPC listener settings = Enabled, Authentication protocol to use for incoming RPC connections: Kerberos. The check reads HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\ForceKerberosForRpc (REG_DWORD) = 1.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0766:
  title: "Point and Print Restrictions: When updating drivers for an existing connection: Show warning and elevation prompt"
  description: "Makes users see a warning and an administrator elevation prompt before Point and Print updates a printer driver. The check passes when the value is absent or 0."
  rationale: "Silent driver updates were abused to run attacker code as SYSTEM."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Printers > Point and Print Restrictions = Enabled, When updating drivers for an existing connection: Show warning and elevation prompt. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint\UpdatePromptSettings (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-6], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.312(a)(1)"], iso_27001: [A.8.2] }
S0767:
  title: "Configure validation of ROCA-vulnerable WHfB keys during authentication: Audit or Block"
  description: "Makes the domain controller check Windows Hello for Business keys for the ROCA weakness. Value 1 audits and value 2 blocks such keys."
  rationale: "Keys generated by affected TPM firmware can be factored, letting an attacker impersonate the user."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Security Account Manager > Configure validation of ROCA-vulnerable WHfB keys during authentication = Enabled: Audit (or Block). Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\SAM\SamNGCKeyROCAValidation (REG_DWORD) = 1 or 2.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0768:
  title: "Join Microsoft MAPS: not set to Disabled"
  description: "Controls whether Microsoft Defender Antivirus uses the Microsoft cloud protection service. The check passes when the policy is absent or SpynetReporting is anything other than 0."
  rationale: "Cloud protection lets the antivirus recognise new threats within seconds of their first sighting."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > MAPS > Join Microsoft MAPS = Not Configured or Enabled (Basic or Advanced). Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet\SpynetReporting (REG_DWORD) absent or not 0.'
  compliance: { nist_800_53: [SI-3], pci_dss: ["5.2.1", "5.3.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0769:
  title: "Turn off Microsoft Defender Antivirus: Disabled or not configured"
  description: "Keeps Microsoft Defender Antivirus running. The check passes when the policy value is absent or 0 under the WindowsDefender policy key."
  rationale: "Without an active antimalware engine the server has no protection against known malware."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Turn off Microsoft Defender Antivirus = Disabled. The check reads HKLM\SOFTWARE\Policies\Microsoft\WindowsDefender\DisableAntiSpyware (REG_DWORD) = 0 or absent.'
  compliance: { nist_800_53: [SI-3], pci_dss: ["5.2.1", "5.3.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0770:
  title: "Allow indexing of encrypted files: Disabled or not configured"
  description: "Controls whether Windows Search indexes encrypted files and stores. The check passes when the value is absent or 0."
  rationale: "Indexing encrypted content may place readable copies of protected data in the search index."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Search > Allow indexing of encrypted files = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search\AllowIndexingEncryptedStoresOrItems (REG_DWORD) = 0.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0771:
  title: "Accounts: Rename administrator account: renamed"
  description: "Checks that no local account is still called Administrator, in any of the common Windows display languages."
  rationale: "The default name is the first one attackers try, so renaming it removes half of the credentials they need."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Accounts: Rename administrator account = a name other than Administrator. Command: Rename-LocalUser -Name Administrator -NewName <new name>'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0772:
  title: "Audit: Force audit policy subcategory settings to override audit policy category settings: Enabled or not configured"
  description: "Makes Windows apply the detailed audit subcategory settings instead of the older category-level audit settings. The check passes when the value is absent or 1."
  rationale: "Without it, older category settings can silently override the detailed audit policy."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Audit: Force audit policy subcategory settings (Windows Vista or later) to override audit policy category settings = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\SCENoApplyLegacyAuditPolicy (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0773:
  title: "Domain controller: LDAP server signing requirements enforcement: Enabled or not configured"
  description: "Controls whether the domain controller enforces its LDAP signing requirement regardless of local overrides. The check passes when the value is absent or LDAPServerForceIntegrity = 1."
  rationale: "Enforced signing stops unsigned LDAP binds that could be tampered with or relayed."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain controller: LDAP server signing requirements Enforcement = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\NTDS\Parameters\LDAPServerForceIntegrity (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0774:
  title: "Network access: Named Pipes that can be accessed anonymously (member server): None, or only RDS licensing and BROWSER pipes"
  description: "Lists the named pipes an anonymous session may open. The check passes when the value is absent, empty, or lists only HydraLSPipe, TermServLicensing or BROWSER."
  rationale: "Every anonymously reachable pipe is an unauthenticated entry point."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Named Pipes that can be accessed anonymously = blank (or HydraLSPipe, TermServLicensing / BROWSER where needed). Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\NullSessionPipes (REG_MULTI_SZ).'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0775:
  title: "Network access: Remotely accessible registry paths: ProductOptions, Server Applications, Windows NT CurrentVersion"
  description: "Lists the exact registry keys remote users may read through the remote registry service. The value must include the ProductOptions, Server Applications and Windows NT CurrentVersion keys."
  rationale: "Keeping the list to the standard keys stops remote users reading other configuration data."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Remotely accessible registry paths = System\CurrentControlSet\Control\ProductOptions, System\CurrentControlSet\Control\Server Applications, Software\Microsoft\Windows NT\CurrentVersion. Registry: HKLM\SYSTEM\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedExactPaths\Machine (REG_MULTI_SZ).'
  compliance: { nist_800_53: [AC-3, AC-14], pci_dss: ["7.2.1"], hipaa: ["164.312(a)(1)"], iso_27001: [A.5.15, A.8.3] }
S0776:
  title: "Network security: LDAP client encryption requirements: Negotiate sealing or Require sealing"
  description: "Sets whether LDAP traffic from this computer is encrypted (sealed). The check accepts value 1 or 2."
  rationale: "Encrypted LDAP traffic keeps directory queries and returned data confidential on the network."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network security: LDAP client encryption requirements = Negotiate sealing (or Require sealing). Registry: HKLM\SYSTEM\CurrentControlSet\Services\LDAP\LDAPClientConfidentiality (REG_DWORD) = 1 or 2.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0777:
  title: "Network security: LDAP client signing requirements: Negotiate signing"
  description: "Sets whether LDAP requests from this computer are signed. The check expects value 1."
  rationale: "Signed LDAP traffic cannot be silently altered or relayed by an attacker in the middle."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network security: LDAP client signing requirements = Negotiate signing. Registry: HKLM\SYSTEM\CurrentControlSet\Services\LDAP\LDAPClientIntegrity (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0778:
  title: "Network security: Restrict NTLM: Audit Incoming NTLM Traffic: Enable auditing for all accounts"
  description: "Logs every incoming NTLM authentication request so administrators can see where NTLM is still used. Value 2 audits all accounts."
  rationale: "Knowing where NTLM is used is the first step to retiring this weaker protocol."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network security: Restrict NTLM: Audit Incoming NTLM Traffic = Enable auditing for all accounts. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0\AuditReceivingNTLMTraffic (REG_DWORD) = 2.'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0779:
  title: "Network security: Restrict NTLM: Audit NTLM authentication in this domain: Enable all"
  description: "Makes the domain controller log all NTLM pass-through authentication in the domain. Value 7 audits every case."
  rationale: "Domain-wide NTLM auditing shows which servers and accounts still depend on NTLM."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network security: Restrict NTLM: Audit NTLM authentication in this domain = Enable all. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\AuditNTLMInDomain (REG_DWORD) = 7.'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0780:
  title: "Network security: Restrict NTLM: Outgoing NTLM traffic to remote servers: Audit all or Deny all"
  description: "Controls outgoing NTLM authentication to remote servers. Value 1 audits every attempt and value 2 blocks them."
  rationale: "Watching or blocking outgoing NTLM limits credential exposure to relay and cracking attacks."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network security: Restrict NTLM: Outgoing NTLM traffic to remote servers = Audit all (or Deny all). Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0\RestrictSendingNTLMTraffic (REG_DWORD) = 1 or 2.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0781:
  title: "Windows Firewall: Domain profile log file: System32\\logfiles\\firewall\\domainfw.log"
  description: "Sets where the firewall writes its log for the domain profile. The path must end in System32\\logfiles\\firewall\\domainfw.log."
  rationale: "A dedicated, known log file per profile makes firewall events easy to collect and review."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Windows Defender Firewall with Advanced Security > Properties > Domain Profile > Logging > Name = %SystemRoot%\System32\logfiles\firewall\domainfw.log. Registry: HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\Logging\LogFilePath (REG_SZ).'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0782:
  title: "Windows Firewall: Private profile log file: System32\\logfiles\\firewall\\privatefw.log"
  description: "Sets where the firewall writes its log for the private profile. The path must end in System32\\logfiles\\firewall\\privatefw.log."
  rationale: "A dedicated, known log file per profile makes firewall events easy to collect and review."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Windows Defender Firewall with Advanced Security > Properties > Private Profile > Logging > Name = %SystemRoot%\System32\logfiles\firewall\privatefw.log. Registry: HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile\Logging\LogFilePath (REG_SZ).'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0783:
  title: "Windows Firewall: Public profile log file: System32\\logfiles\\firewall\\publicfw.log"
  description: "Sets where the firewall writes its log for the public profile. The path must end in System32\\logfiles\\firewall\\publicfw.log."
  rationale: "A dedicated, known log file per profile makes firewall events easy to collect and review."
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Windows Defender Firewall with Advanced Security > Properties > Public Profile > Logging > Name = %SystemRoot%\System32\logfiles\firewall\publicfw.log. Registry: HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile\Logging\LogFilePath (REG_SZ).'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0784:
  title: "Enable Certificate Padding: Enabled"
  description: "Makes Authenticode signature checks reject files with extra data appended after the signature."
  rationale: "Strict padding checks stop attackers from hiding a payload inside a validly signed file."
  remediation: 'Computer Configuration > Policies > Administrative Templates > MS Security Guide > Enable Certificate Padding = Enabled (security baseline template). Registry: HKLM\SOFTWARE\Microsoft\Cryptography\Wintrust\Config\EnableCertPaddingCheck (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SI-16], pci_dss: ["2.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0785:
  title: "Configure multicast DNS (mDNS) protocol: Disabled"
  description: "Controls whether the DNS client resolves names on the local link with multicast DNS."
  rationale: "Multicast answers can be spoofed by any host on the local network to redirect connections."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > DNS Client > Configure multicast DNS (mDNS) protocol = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient\EnableMDNS (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-7, SC-7], pci_dss: ["2.2.4"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0786:
  title: "Turn off default IPv6 DNS Servers: Enabled"
  description: "Stops the DNS client from using the well-known default IPv6 DNS server addresses when none are configured."
  rationale: "An attacker on the local link could claim those default addresses and answer DNS queries."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > DNS Client > Turn off default IPv6 DNS Servers = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient\DisableIPv6DefaultDnsServers (REG_DWORD) = 1.'
  compliance: { nist_800_53: [CM-7, SC-7], pci_dss: ["2.2.4"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0787:
  title: "Lanman Server: Audit client does not support encryption: Enabled"
  description: "Makes the SMB server log an event when a client connects that cannot use SMB encryption."
  rationale: "These events identify clients that would break if encryption were required."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Lanman Server > Audit client does not support encryption = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanServer\AuditClientDoesNotSupportEncryption (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0788:
  title: "Lanman Server: Audit client does not support signing: Enabled"
  description: "Makes the SMB server log an event when a client connects that cannot sign SMB traffic."
  rationale: "These events identify clients that would break if signing were required."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Lanman Server > Audit client does not support signing = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanServer\AuditClientDoesNotSupportSigning (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0789:
  title: "Lanman Server: Audit insecure guest logon: Enabled"
  description: "Makes the SMB server log an event when a client signs in as an unauthenticated guest."
  rationale: "Guest SMB access bypasses authentication and should be found and removed."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Lanman Server > Audit insecure guest logon = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanServer\AuditInsecureGuestLogon (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0790:
  title: "Computer Browser mailslots: Disabled"
  description: "Turns off mailslot support used by the legacy Computer Browser service. The policy value EnableMailslots must be 0."
  rationale: "Mailslots are an old, unauthenticated messaging feature that modern networks do not need."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Computer Browser > Enable Mailslots = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\Bowser\EnableMailslots (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0791:
  title: "Lanman Server: Mandate the minimum version of SMB: SMB 3.1.1"
  description: "Sets the oldest SMB dialect the server accepts. Value 785 (0x311) requires SMB 3.1.1."
  rationale: "SMB 3.1.1 adds pre-authentication integrity and stronger encryption that older dialects lack."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Lanman Server > Mandate the minimum version of SMB = Enabled: SMB 3.1.1. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanServer\MinSmb2Dialect (REG_DWORD) = 785.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0792:
  title: "Lanman Server: Set authentication rate limiter delay: 2000 milliseconds"
  description: "Sets how long the SMB server waits after each failed NTLM or PKU2U authentication. The check expects 2000 ms."
  rationale: "A delay after each failure makes password guessing over SMB far slower."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Lanman Server > Set authentication rate limiter delay (milliseconds) = 2000. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanServer\InvalidAuthenticationDelayTimeInMs (REG_DWORD) = 2000.'
  compliance: { nist_800_53: [AC-7], pci_dss: ["8.3.4"], hipaa: ["164.308(a)(5)(ii)(C)"], iso_27001: [A.8.5] }
S0793:
  title: "Lanman Workstation: Audit insecure guest logon: Enabled"
  description: "Makes the SMB client log an event when it connects to a server as an unauthenticated guest."
  rationale: "Guest connections can be redirected to an attacker's server without any authentication."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Lanman Workstation > Audit insecure guest logon = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation\AuditInsecureGuestLogon (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0794:
  title: "Lanman Workstation: Audit server does not support encryption: Enabled"
  description: "Makes the SMB client log an event when it connects to a server that cannot use SMB encryption."
  rationale: "These events identify servers that would break if encryption were required."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Lanman Workstation > Audit server does not support encryption = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation\AuditServerDoesNotSupportEncryption (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0795:
  title: "Lanman Workstation: Audit server does not support signing: Enabled"
  description: "Makes the SMB client log an event when it connects to a server that cannot sign SMB traffic."
  rationale: "These events identify servers that would break if signing were required."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Lanman Workstation > Audit server does not support signing = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation\AuditServerDoesNotSupportSigning (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0796:
  title: "Lanman Server: Enable authentication rate limiter: Enabled"
  description: "Turns on the SMB server's delay after failed authentication attempts."
  rationale: "Rate limiting makes brute-force password attacks over SMB impractical."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Lanman Server > Enable authentication rate limiter = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanServer\EnableAuthRateLimiter (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AC-7], pci_dss: ["8.3.4"], hipaa: ["164.308(a)(5)(ii)(C)"], iso_27001: [A.8.5] }
S0797:
  title: "Network Provider: Enable remote mailslots: Disabled"
  description: "Turns off sending and receiving of remote mailslot messages. The policy value EnableMailslots must be 0."
  rationale: "Remote mailslots are unauthenticated and unused by modern software, so they only add attack surface."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Network Provider > Enable remote mailslots = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\EnableMailslots (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0798:
  title: "Lanman Workstation: Mandate the minimum version of SMB: SMB 3.1.1"
  description: "Sets the oldest SMB dialect the client will use. Value 785 (0x311) requires SMB 3.1.1."
  rationale: "Refusing older dialects stops downgrade attacks and keeps modern integrity and encryption in use."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Lanman Workstation > Mandate the minimum version of SMB = Enabled: SMB 3.1.1. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation\MinSmb2Dialect (REG_DWORD) = 785.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0799:
  title: "Lanman Workstation: Require Encryption: Enabled"
  description: "Makes the SMB client require encryption on all outbound SMB connections."
  rationale: "Encrypted SMB keeps file contents and credentials confidential on the network."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Lanman Workstation > Require Encryption = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation\RequireEncryption (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
S0800:
  title: "Turn on Responder (RSPNDR) driver: Disabled or not configured"
  description: "Controls the Link-Layer Topology Discovery responder driver. The check passes when the policy is absent or its values are 0."
  rationale: "Answering discovery requests reveals the server to anyone on the local network."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Network > Link-Layer Topology Discovery > Turn on Responder (RSPNDR) driver = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\LLTD AllowRspndrOnDomain, AllowRspndrOnPublicNet, EnableRspndr, ProhibitRspndrOnPrivateNet (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0801:
  title: "Configure Windows protected print: Enabled"
  description: "Switches printing to Windows protected print mode, which uses only the built-in modern print driver and blocks third-party drivers."
  rationale: "Removing third-party print drivers eliminates a large class of spooler privilege escalation flaws."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Printers > Configure Windows protected print = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\WPP\WindowsProtectedPrintGroupPolicyState (REG_DWORD) = 1.'
  compliance: { nist_800_53: [CM-6, CM-7], pci_dss: ["2.2.1", "2.2.4"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: [A.8.9] }
S0802:
  title: "Disable Windows Error Reporting: Enabled"
  description: "Turns off Windows Error Reporting so no crash data is sent to Microsoft. Both the Disabled = 1 and the legacy DoReport = 0 values must be set."
  rationale: "Error reports can contain memory with credentials or business data."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Error Reporting > Disable Windows Error Reporting = Enabled, and System > Internet Communication Management > Internet Communication settings > Turn off Windows Error Reporting = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting\Disabled (REG_DWORD) = 1; HKLM\SOFTWARE\Policies\Microsoft\PCHealth\ErrorReporting\DoReport (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-7, PT-2], pci_dss: ["2.2.4"], hipaa: ["164.312(e)(1)"], iso_27001: [A.5.34] }
S0803:
  title: "Windows LAPS: Enable password encryption: Enabled or not configured"
  description: "Makes Windows LAPS encrypt the managed local administrator password before storing it in Active Directory. The check passes when the value is absent or 1."
  rationale: "Encrypted storage means only authorised readers can recover the password, not anyone who can read the attribute."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > LAPS > Enable password encryption = Enabled. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS\ADPasswordEncryptionEnabled (REG_DWORD) = 1.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0804:
  title: "Windows LAPS: Password Settings complexity: Large letters + small letters + numbers + special characters"
  description: "Sets which character classes Windows LAPS uses when generating the local administrator password. The check passes when the value is absent or 4."
  rationale: "Using every character class makes generated passwords much harder to guess or crack."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > LAPS > Password Settings = Enabled, Password Complexity: Large letters + small letters + numbers + special characters. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS\PasswordComplexity (REG_DWORD) = 4.'
  compliance: { nist_800_53: [IA-5], pci_dss: ["8.3.6", "8.3.9"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: [A.5.17] }
S0805:
  title: "Windows LAPS: Password Settings age: 30 days or fewer"
  description: "Sets how many days a generated local administrator password stays valid. The check passes when the value is absent or 30 or fewer."
  rationale: "Frequent rotation limits how long a disclosed local administrator password remains useful."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > LAPS > Password Settings = Enabled, Password Age (Days): 30 or fewer. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS\PasswordAgeDays (REG_DWORD) <= 30.'
  compliance: { nist_800_53: [IA-5], pci_dss: ["8.3.6", "8.3.9"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: [A.5.17] }
S0806:
  title: "Windows LAPS: Post-authentication actions grace period: 8 hours or fewer, but not 0"
  description: "Sets how many hours after the managed account is used Windows LAPS waits before resetting its password. The check requires 1 to 8 hours."
  rationale: "Resetting the password soon after use stops a password read for one task from being reused later."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > LAPS > Post-authentication actions = Enabled, Grace period (hours): 1 to 8. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS\PostAuthenticationResetDelay (REG_DWORD) = 1-8.'
  compliance: { nist_800_53: [IA-5, SC-28], pci_dss: ["8.3.2"], hipaa: ["164.312(d)"], iso_27001: [A.5.17, A.8.5] }
S0807:
  title: "Block NetBIOS-based discovery for domain controller location: Enabled"
  description: "Stops the DC locator from finding domain controllers through NetBIOS, so only DNS-based discovery is used."
  rationale: "NetBIOS lookups can be spoofed to send clients to a rogue domain controller."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Net Logon > DC Locator DNS Records > Block NetBIOS-based discovery for domain controller location = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Netlogon\Parameters\BlockNetbiosDiscovery (REG_DWORD) = 1.'
  compliance: { nist_800_53: [CM-7, SC-7], pci_dss: ["2.2.4"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20] }
S0808:
  title: "Configure SAM change password RPC methods policy: Block"
  description: "Controls whether the older SAMR password change RPC methods are accepted. Value 2 blocks them."
  rationale: "The older methods use weak protection; blocking them forces safer password change paths."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Security Account Manager > Configure SAM change password RPC methods policy = Enabled: Block. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\SAM\SamrChangeUserPasswordApiPolicy (REG_DWORD) = 2.'
  compliance: { nist_800_53: [IA-2, IA-8], pci_dss: ["8.3.1"], hipaa: ["164.312(d)"], iso_27001: [A.8.5] }
S0809:
  title: "Configure SAM change password RPC methods policy: Audit"
  description: "Controls whether the older SAMR password change RPC methods are accepted. Value 1 allows them but logs each use."
  rationale: "Auditing shows which clients still use the weaker methods before they are blocked."
  remediation: 'Computer Configuration > Policies > Administrative Templates > System > Security Account Manager > Configure SAM change password RPC methods policy = Enabled: Audit. Registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\SAM\SamrChangeUserPasswordApiPolicy (REG_DWORD) = 1.'
  compliance: { nist_800_53: [AU-2, AU-12], pci_dss: ["10.2.1"], hipaa: ["164.312(b)"], iso_27001: [A.8.15] }
S0810:
  title: "Not allow per-user unsigned packages to install by default: Enabled"
  description: "Stops users from installing unsigned app packages for themselves unless explicitly allowed."
  rationale: "Unsigned packages have no verified publisher and are a route for malicious software."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > App Package Deployment > Not allow per-user unsigned packages to install by default = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\Appx\DisablePerUserUnsignedPackagesByDefault (REG_DWORD) = 1.'
  compliance: { nist_800_53: [CM-11], pci_dss: ["2.2.4"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.19] }
S0811:
  title: "Enable App Installer: Disabled"
  description: "Controls whether App Installer is available to install packaged apps."
  rationale: "Servers do not need end-user app installation tools, which can be abused to deliver malware."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Desktop App Installer > Enable App Installer = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\AppInstaller\EnableAppInstaller (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-11], pci_dss: ["2.2.4"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.19] }
S0812:
  title: "Enable App Installer Local Archive Malware Scan Override: Disabled"
  description: "Controls whether users may skip the malware scan Windows Package Manager runs on local archive installers."
  rationale: "Skipping the scan lets a malicious archive install without inspection."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Desktop App Installer > Enable App Installer Local Archive Malware Scan Override = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\AppInstaller\EnableLocalArchiveMalwareScanOverride (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-11], pci_dss: ["2.2.4"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.19] }
S0813:
  title: "Enable App Installer ms-appinstaller protocol: Disabled"
  description: "Controls whether web pages can start app installs through the ms-appinstaller link scheme."
  rationale: "This link scheme has been abused to deliver malware straight from websites."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Desktop App Installer > Enable App Installer ms-appinstaller protocol = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\AppInstaller\EnableMSAppInstallerProtocol (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-11], pci_dss: ["2.2.4"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.19] }
S0814:
  title: "Enable App Installer Microsoft Store Source Certificate Validation Bypass: Disabled"
  description: "Controls whether Windows Package Manager may skip certificate pinning when it talks to the Microsoft Store source."
  rationale: "Certificate pinning protects package downloads from interception; bypassing it allows tampered packages."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Desktop App Installer > Enable App Installer Microsoft Store Source Certificate Validation Bypass = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\AppInstaller\EnableBypassCertificatePinningForMicrosoftStore (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-11], pci_dss: ["2.2.4"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.19] }
S0815:
  title: "Enable Windows Package Manager command line interfaces: Disabled"
  description: "Controls whether the winget command line and its PowerShell module can be used."
  rationale: "Command-line package installs let users or malware add software outside change control."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Desktop App Installer > Enable Windows Package Manager command line interfaces = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\AppInstaller\EnableWindowsPackageManagerCommandLineInterfaces (REG_DWORD) = 0.'
  compliance: { nist_800_53: [CM-11], pci_dss: ["2.2.4"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.19] }
S0816:
  title: "Mark of the Web on files copied from insecure paths: kept (DisableMotWOnInsecurePathCopy = 0)"
  description: "Controls whether File Explorer keeps the Mark of the Web zone tag on files copied from untrusted network locations."
  rationale: "The zone tag triggers SmartScreen and Office protected view, which block many malicious downloads."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > File Explorer > policy controlling Mark of the Web on files copied from insecure sources = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer\DisableMotWOnInsecurePathCopy (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SI-3], pci_dss: ["5.2.1", "5.3.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0817:
  title: "Microsoft Defender Antivirus passive remediation: PassiveRemediation = 1"
  description: "Lets Microsoft Defender Antivirus remediate detected threats even while it runs in passive mode alongside another antivirus product. The check requires the value under the Features key and reads PassiveRemediation = 1."
  rationale: "Remediation in passive mode means threats are still cleaned up when another product is primary."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Features > passive remediation policy = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Features\PassiveRemediation (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SI-3], pci_dss: ["5.2.1", "5.3.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0818:
  title: "Convert warn verdict to block: Enabled"
  description: "Makes Microsoft Defender network protection block, rather than only warn about, connections it judges dangerous."
  rationale: "Users often click through warnings; blocking stops the connection outright."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Network Inspection System > Convert warn verdict to block = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\NIS\EnableConvertWarnToBlock (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SI-3], pci_dss: ["5.2.1", "5.3.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0819:
  title: "Configure real-time protection and Security Intelligence Updates during OOBE: Enabled"
  description: "Turns on Microsoft Defender real-time protection and signature updates during the out-of-box setup experience."
  rationale: "The system is protected from the first boot rather than only after setup completes."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Real-time Protection > Configure real-time protection and Security Intelligence Updates during OOBE = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection\OobeEnableRtpAndSigUpdate (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SI-3], pci_dss: ["5.2.1", "5.3.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0820:
  title: "Brute-Force Protection aggressiveness: Medium or High"
  description: "Sets how aggressively Microsoft Defender blocks sources of repeated failed remote sign-ins. The check accepts value 1 or 2."
  rationale: "A higher level blocks password-spraying sources sooner."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Remediation > Behavioral Network Blocks > Brute-Force Protection > Configure Brute-Force Protection aggressiveness = Enabled: Medium (or High). Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Remediation\Behavioral Network Blocks\Brute Force Protection\BruteForceProtectionAggressiveness (REG_DWORD) = 1 or 2.'
  compliance: { nist_800_53: [AC-7], pci_dss: ["8.3.4"], hipaa: ["164.308(a)(5)(ii)(C)"], iso_27001: [A.8.5] }
S0821:
  title: "Configure Brute-Force Protection: Block or Audit"
  description: "Turns on Microsoft Defender protection against brute-force sign-in attempts. The check accepts value 1 (block) or 2 (audit)."
  rationale: "Detecting and blocking brute-force sources protects exposed remote sign-in services."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Remediation > Behavioral Network Blocks > Brute-Force Protection > Configure Brute-Force Protection = Enabled: Block (or Audit). Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Remediation\Behavioral Network Blocks\Brute Force Protection\BruteForceProtectionConfiguredState (REG_DWORD) = 1 or 2.'
  compliance: { nist_800_53: [AC-7], pci_dss: ["8.3.4"], hipaa: ["164.308(a)(5)(ii)(C)"], iso_27001: [A.8.5] }
S0822:
  title: "Remote Encryption Protection aggressiveness: Medium or High"
  description: "Sets how aggressively Microsoft Defender blocks remote machines that try to encrypt files on this server over the network. The check accepts value 1 or 2."
  rationale: "Blocking remote encryption attempts quickly limits ransomware damage spreading from another machine."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Remediation > Behavioral Network Blocks > Remote Encryption Protection > Configure Remote Encryption Protection aggressiveness = Enabled: Medium (or High). Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Remediation\Behavioral Network Blocks\Remote Encryption Protection\RemoteEncryptionProtectionAggressiveness (REG_DWORD) = 1 or 2.'
  compliance: { nist_800_53: [SI-3], pci_dss: ["5.2.1", "5.3.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0823:
  title: "Scan excluded files and directories during quick scans: Enabled"
  description: "Makes Microsoft Defender quick scans also check files and folders that are excluded from real-time scanning."
  rationale: "Attackers deliberately hide malware in excluded locations; periodic scanning closes that gap."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Scan > Scan excluded files and directories during quick scans = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Scan\QuickScanIncludeExclusions (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SI-3], pci_dss: ["5.2.1", "5.3.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0824:
  title: "Scan packed executables: Enabled"
  description: "Makes Microsoft Defender unpack and scan compressed or packed executable files. The policy value DisablePackedExeScanning must be 0."
  rationale: "Packing is commonly used to hide malware from signature checks."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Scan > Scan packed executables = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Scan\DisablePackedExeScanning (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SI-3], pci_dss: ["5.2.1", "5.3.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0825:
  title: "Define the number of days after which a catch-up quick scan is forced: 7"
  description: "Sets how many days of missed scheduled quick scans Microsoft Defender tolerates before it forces a catch-up scan. The check expects 7."
  rationale: "Forcing a scan after a week of missed scans keeps rarely-online systems from going unchecked."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Scan > Define the number of days after which a catch-up scan is forced = 7. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Scan\DaysUntilAggressiveCatchupQuickScan (REG_DWORD) = 7.'
  compliance: { nist_800_53: [SI-3], pci_dss: ["5.2.1", "5.3.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0826:
  title: "Control whether exclusions are visible to local users: Enabled"
  description: "Hides the Microsoft Defender exclusion list from local users and applications."
  rationale: "Attackers read the exclusion list to find folders where their malware will not be scanned."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Control whether or not exclusions are visible to local users = Enabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\HideExclusionsFromLocalUsers (REG_DWORD) = 1.'
  compliance: { nist_800_53: [SI-3], pci_dss: ["5.2.1", "5.3.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: [A.8.7] }
S0827:
  title: "Restrict clipboard transfer from server to client: Disable clipboard transfers from server to client"
  description: "Controls which clipboard content may be copied from a Remote Desktop session to the client device. Value 0 blocks all server-to-client clipboard transfers."
  rationale: "Blocking clipboard transfers stops data being copied out of the server through the remote session."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection > Restrict clipboard transfer from server to client = Enabled: Disable clipboard transfers from server to client. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\SCClipLevel (REG_DWORD) = 0.'
  compliance: { nist_800_53: [AC-17, SC-8], pci_dss: ["2.2.7"], hipaa: ["164.312(e)(1)"], iso_27001: [A.8.20, A.8.24] }
S0828:
  title: "Turn on Basic feed authentication over HTTP: Disabled"
  description: "Controls whether the RSS feed platform may send Basic authentication credentials over unencrypted HTTP."
  rationale: "Basic credentials over HTTP can be read by anyone observing the traffic."
  remediation: 'Computer Configuration > Policies > Administrative Templates > Windows Components > RSS Feeds > Turn on Basic feed authentication over HTTP = Disabled. Registry: HKLM\SOFTWARE\Policies\Microsoft\Internet Explorer\Feeds\AllowBasicAuthInClear (REG_DWORD) = 0.'
  compliance: { nist_800_53: [SC-8, SC-23], pci_dss: ["8.3.2"], hipaa: ["164.312(e)(1)", "164.312(e)(2)(i)"], iso_27001: [A.8.20, A.8.24] }
