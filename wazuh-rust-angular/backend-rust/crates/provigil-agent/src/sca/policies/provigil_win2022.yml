  - r:HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Policies\System -> NoConnectedUser
  - r:HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Policies\System -> NoConnectedUser -> 3
- id: 66009
  title: 'Accounts: Guest account status: Disabled'
  description: Controls whether the built-in local Guest account (the account whose SID ends in -501) is enabled.
  rationale: The Guest account allows unauthenticated, anonymous-like access to the computer.
  remediation: 'Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\Security Options\Accounts: Guest account status = Disabled. Command: the built-in local account with SID ending -501 must be disabled (for example: Disable-LocalUser -SID <machine SID>-501, or net user Guest /active:no).'
  compliance:
    nist_800_53:
    - IA-2
    - IA-5
    pci_dss:
    - 8.3.1
    hipaa:
    - 164.312(d)
    iso_27001:
    - '5.17'
    - '8.5'
    soc_2:
    - CC6.1
    - CC6.2
    gdpr_IV:
    - IV_32.2
  condition: all
  rules:
  - c:powershell -NoProfile -Command "[bool](Get-CimInstance -Query 'SELECT * FROM Win32_UserAccount WHERE LocalAccount = TRUE AND SID LIKE ''S-1-5-21-%-501''' | Where-Object -Property Disabled)" -> r:True
- id: 66010
  title: 'Accounts: Limit local account use of blank passwords to console logon only: Enabled'
  description: When enabled, local accounts with an empty password can sign in only at the physical keyboard, not over the network.
  rationale: Blank-password accounts would otherwise be open to anyone on the network.
  remediation: 'Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\Security Options\Accounts: Limit local account use of blank passwords to console logon only = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\LimitBlankPasswordUse (REG_DWORD) = 1.'
