- id: 62010
  title: 'Accounts: Limit local account use of blank passwords to console logon only: Enabled'
  description: Allows local accounts with blank passwords to sign in only at the physical console, not over the network.
  rationale: This stops remote attackers from using any account that has an empty password.
  remediation: 'Group Policy: Computer Configuration\Policies\Windows Settings\Security Settings\Local Policies\Security Options\Accounts: Limit local account use of blank passwords to console logon only = Enabled. Registry: HKLM\System\CurrentControlSet\Control\Lsa\LimitBlankPasswordUse = 1.'
