  rationale: Strong session keys make the secure channel resistant to key-recovery and hijacking attacks.
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain member: Require strong (Windows 2000 or later) session key = Enabled. Registry: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\RequireStrongKey (REG_DWORD) = 1.'
