- id: 72023
  title: 'log_timezone: America/New_York (policy variable $log_timezone)'
  description: log_timezone sets the time zone used for timestamps in the server log. The check expects SHOW log_timezone to return the site value, America/New_York by default.
  rationale: Consistent time zones let database events be lined up with other systems during an investigation.
  remediation: ALTER SYSTEM SET log_timezone = 'America/New_York'; SELECT pg_reload_conf();
