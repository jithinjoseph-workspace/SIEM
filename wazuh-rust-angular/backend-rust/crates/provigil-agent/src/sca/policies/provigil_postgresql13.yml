- id: 72024
  title: 'shared_preload_libraries: includes pgaudit'
  description: pgAudit is an extension that writes detailed session and object audit records; it must be preloaded at server start. The check expects SHOW shared_preload_libraries to include pgaudit.
  rationale: Standard statement logging lacks the structured audit detail that compliance reviews need.
  remediation: Install pgAudit, ALTER SYSTEM SET shared_preload_libraries = 'pgaudit'; restart PostgreSQL; CREATE EXTENSION pgaudit;
  compliance:
    nist_800_53:
    - AU-2
    - AU-3
    - AU-12
    pci_dss:
