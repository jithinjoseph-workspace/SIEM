[package]
name = "siem-util"
version = "0.1.0"
edition = "2021"
description = "Wazuh utility command-line tools (agent_control, list_agents, verify-agent-conf, clear_stats, wazuh-regex)"

[dependencies]
siem-core = { path = "../siem-core" }
siem-shared = { path = "../siem-shared" }
siem-wdb = { path = "../siem-wdb" }
siem-crypto = { path = "../siem-crypto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = { version = "0.36", features = ["serialize"] }
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
base64 = "0.21"

[[bin]]
name = "agent-control"
path = "src/bin/agent_control.rs"

[[bin]]
name = "list-agents"
path = "src/bin/list_agents.rs"

[[bin]]
name = "verify-agent-conf"
path = "src/bin/verify_agent_conf.rs"

[[bin]]
name = "clear-stats"
path = "src/bin/clear_stats.rs"

[[bin]]
name = "wazuh-regex"
path = "src/bin/wazuh_regex.rs"

[[bin]]
name = "wazuh-reportd"
path = "src/bin/wazuh_reportd.rs"

[[bin]]
name = "wazuh-control"
path = "src/bin/wazuh_control.rs"

[[bin]]
name = "manage-agents"
path = "src/bin/manage_agents.rs"
