[package]
name = "provigil-analysisd"
version = "0.1.0"
edition = "2021"
description = "ProVigil manager analysis: decoders, rules, lists, alerts, active responses and logtest"

[dependencies]
provigil-daemon = { path = "../provigil-daemon" }
provigil-fileop = { path = "../provigil-fileop" }
provigil-regex = { path = "../provigil-regex" }
provigil-json = { path = "../provigil-json" }
provigil-ipc = { path = "../provigil-ipc" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
regex = "1.10"
chrono = "0.4"
sha1 = "0.10"

[dev-dependencies]
# the old implementation, as the reference of the comparison tests (removed with it)
siem-analysisd = { path = "../siem-analysisd" }
siem-config = { path = "../siem-config" }
tempfile = "3"
