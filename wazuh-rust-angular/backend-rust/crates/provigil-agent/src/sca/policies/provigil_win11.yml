  description: Blocks installation of devices whose hardware IDs are listed. The check expects the deny list to contain at least one entry.
  rationale: Blocking known risky devices, such as certain storage or network adapters, reduces data loss and attack paths.
  remediation: 'Group Policy: Computer Configuration\Policies\Administrative Templates\System\Device Installation\Device Installation Restrictions\Prevent installation of devices that match any of these device IDs = Enabled, with the IDs to block. Registry: HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions\DenyDeviceIDs (REG_DWORD) = 1 and values 1, 2, ... under HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions\DenyDeviceIDs.'
