[package]
name = "siem-shared-modules"
version = "0.1.0"
edition = "2021"
description = "Port of Wazuh shared_modules (dbsync, rsync, router, indexer_connector, keystore, content_manager, utils, http-request)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
sha1 = "0.10"
sha2 = "0.10"
tracing = "0.1"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
