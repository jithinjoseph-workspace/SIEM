- id: 78012
  title: 'Obfuscated PHP (eval(base64_decode("aWYo...): none'
  description: Encoded code passed to eval is a common way to hide a web shell. The check fails when a .php file under /var/www contains eval(base64_decode( followed by a quoted string starting with aWYo (base64 for 'if(').
  rationale: This pattern is a known signature of injected malicious code.
  remediation: Find the files (grep -rl under /var/www), treat the site as compromised, remove the injected code and restore from a trusted source; then patch the entry point.
  compliance:
    nist_800_53:
    - SI-3
    - SI-4
    - SI-7
    pci_dss:
    - 5.2.1
    - 11.5.2
    hipaa:
    - 164.308(a)(5)(ii)(B)
    iso_27001:
    - A.8.7
    - A.8.16
    soc_2:
    - CC7.1
    - CC7.2
    gdpr_IV:
    - IV_35.7.d
  condition: none
  rules:
  - d:$web_dirs -> .php$ -> r:eval\(base64_decode\(\paWYo
- id: 78013
  title: 'PHP eval of POST data (eval(base64_decode($_POST...): none'
  description: A script that decodes and runs data straight from a POST request is a remote code backdoor. The check fails when a .php file under /var/www contains eval(base64_decode($_POST.
  rationale: Such code lets anyone send arbitrary PHP to the server.
  remediation: Find the files (grep -rl under /var/www), treat the site as compromised, remove the injected code and restore from a trusted source; then patch the entry point.
  compliance:
    nist_800_53:
    - SI-3
    - SI-4
