  rationale: A file named id in the web root is a typical leftover from testing command execution on a compromised site.
  remediation: Investigate any 'id' file under /var/www (find /var/www -name 'id'), treat the host as possibly compromised, remove the file and restore content from a trusted source.
  compliance:
