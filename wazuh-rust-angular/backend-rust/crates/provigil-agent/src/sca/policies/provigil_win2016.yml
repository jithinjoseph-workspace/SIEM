  - r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa -> restrictremotesam -> O:BAG:BAD:(A;;RC;;;BA)
- id: 64044
  title: 'Network access: Shares that can be accessed anonymously: None'
  description: Lists the network shares an anonymous session may open. The check passes when the value is absent or empty.
  rationale: Any share listed here is readable without authentication.
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Network access: Shares that can be accessed anonymously = blank. Registry: HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\NullSessionShares (REG_MULTI_SZ) = empty.'
