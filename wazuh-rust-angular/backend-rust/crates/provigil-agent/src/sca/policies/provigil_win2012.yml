  description: Sets how many days before a password expires the user starts receiving change reminders. The check requires 5 to 14 days.
  rationale: Early reminders let users choose a new password in good time instead of being locked out or picking a weak one in a hurry.
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Interactive logon: Prompt user to change password before expiration = 5 to 14 days. Registry: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\PasswordExpiryWarning (REG_DWORD) = 5-14.'
