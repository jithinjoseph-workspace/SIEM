# ProVigil configuration policy: web servers. Generated by specs/sca-manifest/build_policies.py; edit the catalog, not this file.
policy:
  id: provigil_web_exposure
  name: ProVigil web servers hardening
  description: Security configuration checks for web servers, written by ProVigil from the vendor's public documentation.
  references: []
requirements:
  any:
  - f:$php.ini
  - d:$web_dirs
variables:
  $php.ini: /etc/php.ini
  $web_dirs: /var/www
checks:
- id: 78000
  title: 'register_globals: Off'
  description: register_globals turned request variables into PHP global variables automatically (removed in PHP 5.4). The check expects a line 'register_globals = Off' in /etc/php.ini.
  rationale: Automatic globals let attackers set internal variables of a script from the URL.
  remediation: Set 'register_globals = Off' in /etc/php.ini, then restart the web server or PHP-FPM.
  compliance:
    nist_800_53:
    - SI-10
    - CM-6
    pci_dss:
    - 6.2.4
    hipaa:
    - 164.312(c)(1)
    iso_27001:
    - A.8.9
    - A.8.28
    soc_2:
    - CC7.1
    - CC7.2
    - CC8.1
    gdpr_IV:
    - IV_32.2
    - IV_35.7.d
  condition: all
  rules:
  - f:$php.ini -> r:^register_globals\s*\t*=\s*\t*Off|register_globals\s*\t*=\s*\t*off
- id: 78001
  title: 'expose_php: Off'
  description: expose_php adds an X-Powered-By header with the PHP version to responses. The check expects a line 'expose_php = Off' in /etc/php.ini.
  rationale: Advertising the PHP version helps attackers choose exploits.
  remediation: Set 'expose_php = Off' in /etc/php.ini, then restart the web server or PHP-FPM.
  compliance:
    nist_800_53:
    - CM-7
    - SI-11
    pci_dss:
    - 2.2.4
    - 6.2.4
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.9
    soc_2:
    - CC7.1
    - CC7.2
    - CC8.1
    gdpr_IV:
    - IV_32.2
    - IV_35.7.d
  condition: all
  rules:
  - f:$php.ini -> r:^expose_php\s*\t*=\s*\t*Off|^expose_php\s*\t*=\s*\t*off
- id: 78002
  title: 'allow_url_fopen: Off'
  description: allow_url_fopen lets file functions such as fopen and include open remote URLs. The check expects a line 'allow_url_fopen = Off' in /etc/php.ini.
  rationale: Remote file access turns file inclusion bugs into remote code execution.
  remediation: Set 'allow_url_fopen = Off' in /etc/php.ini, then restart the web server or PHP-FPM.
  compliance:
    nist_800_53:
    - SI-10
    - CM-6
    pci_dss:
    - 6.2.4
    hipaa:
    - 164.312(c)(1)
    iso_27001:
    - A.8.9
    - A.8.28
    soc_2:
    - CC7.1
    - CC7.2
    - CC8.1
    gdpr_IV:
    - IV_32.2
    - IV_35.7.d
  condition: all
  rules:
  - f:$php.ini -> r:^allow_url_fopen\s*\t*=\s*\t*Off|^allow_url_fopen\s*\t*=\s*\t*off
- id: 78003
  title: 'display_errors: Off'
  description: display_errors prints PHP errors in the page sent to the browser. The check expects a line 'display_errors = Off' in /etc/php.ini.
  rationale: Error output reveals paths, queries and code details; errors belong in the log instead.
  remediation: Set 'display_errors = Off' in /etc/php.ini, then restart the web server or PHP-FPM.
  compliance:
    nist_800_53:
    - CM-7
    - SI-11
    pci_dss:
    - 2.2.4
    - 6.2.4
    hipaa:
    - 164.308(a)(1)(ii)(B)
    iso_27001:
    - A.8.9
    soc_2:
    - CC7.1
    - CC7.2
    - CC8.1
    gdpr_IV:
    - IV_32.2
    - IV_35.7.d
  condition: all
  rules:
  - f:$php.ini -> r:^display_errors\s*\t*=\s*\t*Off|^display_errors\s*\t*=\s*\t*off
- id: 78004
  title: 'Suspicious file ''.yop'' in the web root: none'
  description: Files named .yop inside a web tree are a known trace left by web shells and intrusion kits. The check fails when a file with this name exists under /var/www.
  rationale: Hidden files with odd names in the web root usually mean an attacker has planted tools there.
  remediation: Investigate any '.yop' file under /var/www (find /var/www -name '.yop'), treat the host as possibly compromised, remove the file and restore content from a trusted source.
  compliance:
    nist_800_53:
    - SI-3
    - SI-4
    - SI-7
    pci_dss:
    - 5.2.1
    - 11.5.2
    hipaa:
    - 164.308(a)(5)(ii)(B)
    iso_27001:
    - A.8.7
    - A.8.16
    soc_2:
    - CC7.1
    - CC7.2
    gdpr_IV:
    - IV_35.7.d
  condition: none
  rules:
  - d:$web_dirs -> ^.yop$
