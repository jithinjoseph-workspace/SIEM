    - CC6.6
    - CC6.7
    gdpr_IV:
    - IV_32.2
  condition: all
  rules:
  - r:HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters
  - r:HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters -> LdapEnforceChannelBinding
  - r:HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters -> LdapEnforceChannelBinding -> 2
- id: 63019
  title: 'Domain controller: LDAP server signing requirements: Require signing'
  description: Defines whether the domain controller insists on signed LDAP binds. Value 2 rejects unsigned binds that are not protected by TLS.
  rationale: Unsigned LDAP traffic can be modified or relayed in transit.
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain controller: LDAP server signing requirements = Require signing. Registry: HKLM\SYSTEM\CurrentControlSet\Services\NTDS\Parameters\LDAPServerIntegrity (REG_DWORD) = 2.'
  compliance:
    nist_800_53:
    - SC-8
    - SC-23
    pci_dss:
