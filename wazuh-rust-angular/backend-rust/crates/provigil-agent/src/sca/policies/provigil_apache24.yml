- id: 68026
  title: 'LimitRequestLine: 512 bytes or less'
  description: LimitRequestLine caps the size of the HTTP request line (method, URL and protocol). The check expects an active value of 512 or lower in httpd.conf.
  rationale: Small limits reject oversized URLs used in buffer overflow and resource exhaustion attempts.
  remediation: Set 'LimitRequestLine 512' in httpd.conf and restart httpd.
