  compliance: { nist_800_53: ["CM-6", "CM-2"], pci_dss: ["2.2.1", "2.2.6"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: ["A.8.9"] }

S0223:
  title: "Configure security policy processing: Process even if the Group Policy objects have not changed: checked"
  description: "Controls whether security policy settings are reapplied even when the policy objects have not changed."
  rationale: "Reapplying unchanged policy undoes unauthorized local changes to security settings."
