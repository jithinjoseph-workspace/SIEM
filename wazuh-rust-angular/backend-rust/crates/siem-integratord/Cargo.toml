[package]
name = "siem-integratord"
version = "0.1.0"
edition = "2021"
description = "Wazuh External Integrations Daemon (src/os_integrator)"

[dependencies]
siem-core = { path = "../siem-core" }
siem-shared = { path = "../siem-shared" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
quick-xml = { version = "0.36", features = ["serialize"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "wazuh-integratord"
path = "src/bin/wazuh_integratord.rs"
