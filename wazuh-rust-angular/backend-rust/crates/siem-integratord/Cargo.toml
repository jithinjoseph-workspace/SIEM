[package]
name = "siem-integratord"
version = "0.1.0"
edition = "2021"
description = "Port of wazuh-integratord (src/os_integrator) and the integration scripts (integrations/*.py)"

[dependencies]
siem-config = { path = "../siem-config" }
siem-cjson = { path = "../siem-cjson" }
siem-ipc = { path = "../siem-ipc" }
siem-log = { path = "../siem-log" }
siem-daemon = { path = "../siem-daemon" }
siem-regex = { path = "../siem-regex" }
siem-xml = { path = "../siem-xml" }
siem-maild = { path = "../siem-maild" }
tokio = { version = "1.40", features = ["full"] }
chrono = "0.4"
libc = "0.2"
sha2 = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "deflate"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "wazuh-integratord"
path = "src/bin/wazuh-integratord.rs"

[[bin]]
name = "integrations"
path = "src/bin/integrations.rs"
