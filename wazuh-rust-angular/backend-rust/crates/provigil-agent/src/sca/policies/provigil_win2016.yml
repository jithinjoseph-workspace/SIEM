  description: Controls whether administrators may turn on Internet Connection Sharing, which would let the server route traffic for other devices. The check expects the policy value NC_ShowSharedAccessUI = 1.
  rationale: Connection sharing can bridge the internal network to another network, so its availability must be set by policy.
  remediation: Computer Configuration > Policies > Administrative Templates > Network > Network Connections > Prohibit use of Internet Connection Sharing on your DNS domain network. The check reads HKLM\SOFTWARE\Policies\Microsoft\Windows\Network Connections\NC_ShowSharedAccessUI (REG_DWORD) = 1.
