  condition: all
  rules:
  - c:sh -c "psql -U $user -h $host $db -c \"show syslog_facility\" | grep $syslog_facility" -> r:\.+
- id: 72010
  title: 'syslog_ident: postgres (policy variable $syslog_ident)'
  description: syslog_ident is the program name that tags PostgreSQL messages in syslog. The check expects SHOW syslog_ident to return the site value, postgres by default.
  rationale: A consistent tag makes database messages easy to find and filter.
  remediation: ALTER SYSTEM SET syslog_ident = 'postgres'; SELECT pg_reload_conf();
  compliance:
