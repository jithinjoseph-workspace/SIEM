[package]
name = "siem-core"
version = "0.1.0"
edition = "2021"
description = "Core domain models and types for next-generation Wazuh-compatible SIEM"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
quick-xml = { version = "0.36", features = ["serialize"] }
