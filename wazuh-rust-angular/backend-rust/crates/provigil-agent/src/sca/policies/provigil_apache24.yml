- id: 68024
  title: 'RequestReadTimeout header: 40 seconds or less (or mod_reqtimeout loaded in httpd.conf)'
  description: mod_reqtimeout limits how long a client may take to send the request headers. The check passes when httpd.conf loads mod_reqtimeout or an active RequestReadTimeout sets the header maximum to 40 seconds or less.
  rationale: Limiting header read time defeats attacks that trickle headers slowly to keep connections busy.
  remediation: Load mod_reqtimeout and set 'RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500' in httpd.conf.
  compliance:
    nist_800_53:
