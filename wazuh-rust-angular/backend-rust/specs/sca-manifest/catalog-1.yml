S0001:
  title: "Enforce password history: 24 or more passwords remembered"
  description: "Sets how many previous passwords Windows remembers for each account; a new password may not repeat any of them."
  rationale: "A long history stops users from cycling back to an old, possibly exposed password."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Account Policies\\Password Policy\\Enforce password history = 24 or more. Security template value [System Access] PasswordHistorySize = 24 (seen in the output of secedit /export)."
  compliance: { nist_800_53: ["IA-5", "IA-5(1)"], pci_dss: ["8.3.6", "8.3.9"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: ["A.5.17"] }

S0002:
  title: "Maximum password age: 1 to 365 days"
  description: "Sets how many days a password can be used before Windows requires a change. A value of 0 means passwords never expire."
  rationale: "A finite lifetime limits how long a stolen password stays useful, while 0 (never expire) removes that limit."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Account Policies\\Password Policy\\Maximum password age = a value from 1 to 365 days. Security template value [System Access] MaximumPasswordAge = 1-365 (seen in the output of secedit /export)."
  compliance: { nist_800_53: ["IA-5", "IA-5(1)"], pci_dss: ["8.3.6", "8.3.9"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: ["A.5.17"] }

S0003:
  title: "Minimum password age: 1 or more days"
  description: "Sets how many days a password must be kept before the user may change it again."
  rationale: "Without a minimum age a user can change the password repeatedly in one sitting and defeat the password history."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Account Policies\\Password Policy\\Minimum password age = 1 or more days. Security template value [System Access] MinimumPasswordAge = 1 or more (seen in the output of secedit /export)."
  compliance: { nist_800_53: ["IA-5", "IA-5(1)"], pci_dss: ["8.3.6", "8.3.9"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: ["A.5.17"] }

S0004:
  title: "Minimum password length: 14 or more characters"
  description: "Sets the fewest characters a local account password may contain."
  rationale: "Longer passwords take far longer to guess or crack offline."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Account Policies\\Password Policy\\Minimum password length = 14 or more. Security template value [System Access] MinimumPasswordLength = 14 or more (seen in the output of secedit /export)."
  compliance: { nist_800_53: ["IA-5", "IA-5(1)"], pci_dss: ["8.3.6", "8.3.9"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: ["A.5.17"] }

S0005:
  title: "Relax minimum password length limits: Enabled"
  description: "Allows the minimum password length policy to be set above the legacy limit of 14 characters."
  rationale: "Lets administrators require passphrases longer than 14 characters when needed."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Account Policies\\Password Policy\\Relax minimum password length limits = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\SAM\\RelaxMinimumPasswordLengthLimits (REG_DWORD) = 1."
  compliance: { nist_800_53: ["IA-5", "IA-5(1)"], pci_dss: ["8.3.6", "8.3.9"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: ["A.5.17"] }

S0006:
  title: "Account lockout duration: 15 or more minutes"
  description: "Sets how long a locked-out account stays locked before it unlocks on its own."
  rationale: "A lockout of at least 15 minutes slows down online password guessing considerably."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Account Policies\\Account Lockout Policy\\Account lockout duration = 15 or more minutes. Security template value [System Access] LockoutDuration = 15 or more (seen in the output of secedit /export)."
  compliance: { nist_800_53: ["AC-7"], pci_dss: ["8.3.4"], hipaa: ["164.308(a)(5)(ii)(C)"], iso_27001: ["A.5.17", "A.8.5"] }

S0007:
  title: "Account lockout threshold: 1 to 5 invalid sign-in attempts"
  description: "Sets how many failed sign-in attempts lock the account. A value of 0 means accounts are never locked."
  rationale: "A low, non-zero threshold stops brute-force password guessing against local accounts."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Account Policies\\Account Lockout Policy\\Account lockout threshold = a value from 1 to 5. Security template value [System Access] LockoutBadCount = 1-5 (seen in the output of secedit /export)."
  compliance: { nist_800_53: ["AC-7"], pci_dss: ["8.3.4"], hipaa: ["164.308(a)(5)(ii)(C)"], iso_27001: ["A.5.17", "A.8.5"] }

S0008:
  title: "Reset account lockout counter after: 15 or more minutes"
  description: "Sets how long after a failed sign-in the failed-attempt counter goes back to zero."
  rationale: "A longer reset window keeps an attacker from simply waiting a few minutes between guesses."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Account Policies\\Account Lockout Policy\\Reset account lockout counter after = 15 or more minutes. Security template value [System Access] ResetLockoutCount = 15 or more (seen in the output of secedit /export)."
  compliance: { nist_800_53: ["AC-7"], pci_dss: ["8.3.4"], hipaa: ["164.308(a)(5)(ii)(C)"], iso_27001: ["A.5.17", "A.8.5"] }

S0009:
  title: "Accounts: Block Microsoft accounts: Users can't add or log on with Microsoft accounts"
  description: "Controls whether consumer Microsoft accounts can be added to the computer or used to sign in."
  rationale: "Keeping sign-in to organization-managed accounts keeps identities under central control and auditing."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Accounts: Block Microsoft accounts = Users can't add or log on with Microsoft accounts. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\NoConnectedUser (REG_DWORD) = 3."
  compliance: { nist_800_53: ["AC-2", "IA-2"], pci_dss: ["2.2.2", "8.2.2"], hipaa: ["164.312(a)(1)", "164.312(a)(2)(i)"], iso_27001: ["A.5.15", "A.5.16", "A.8.2"] }

S0010:
  title: "Accounts: Guest account status: Disabled"
  description: "Checks that the built-in Guest account (RID 501) is disabled or not present."
  rationale: "An enabled Guest account allows unauthenticated people to use the computer and reach network resources."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Accounts: Guest account status = Disabled. Or run: net user Guest /active:no (use the local name of the account)."
  compliance: { nist_800_53: ["AC-2", "IA-2"], pci_dss: ["2.2.2", "8.2.2"], hipaa: ["164.312(a)(1)", "164.312(a)(2)(i)"], iso_27001: ["A.5.15", "A.5.16", "A.8.2"] }

S0011:
  title: "Accounts: Limit local account use of blank passwords to console logon only: Enabled"
  description: "When enabled, local accounts with an empty password can sign in only at the physical keyboard, not over the network."
  rationale: "Blank-password accounts would otherwise be open to anyone on the network."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Accounts: Limit local account use of blank passwords to console logon only = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\LimitBlankPasswordUse (REG_DWORD) = 1."
  compliance: { nist_800_53: ["AC-2", "IA-2"], pci_dss: ["2.2.2", "8.2.2"], hipaa: ["164.312(a)(1)", "164.312(a)(2)(i)"], iso_27001: ["A.5.15", "A.5.16", "A.8.2"] }

S0012:
  title: "Accounts: Rename administrator account: no local account name contains 'Admin' (or a translated equivalent)"
  description: "Checks the output of net user for any local account whose name contains 'Admin' or the localized word for administrator."
  rationale: "Renaming the built-in administrator removes one half of the credential pair an attacker would otherwise know."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Accounts: Rename administrator account = a name that does not contain 'admin'. Or rename it in Local Users and Groups (lusrmgr.msc)."
  compliance: { nist_800_53: ["AC-2", "IA-2"], pci_dss: ["2.2.2", "8.2.2"], hipaa: ["164.312(a)(1)", "164.312(a)(2)(i)"], iso_27001: ["A.5.15", "A.5.16", "A.8.2"] }

S0013:
  title: "Accounts: Rename guest account: no local account named 'Guest' (or a translated equivalent)"
  description: "Checks the output of net user for any local account named Guest or the localized word for guest."
  rationale: "A well-known account name makes the account an easy target for guessing and abuse."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Accounts: Rename guest account = a name other than 'Guest'. Or rename it in Local Users and Groups (lusrmgr.msc)."
  compliance: { nist_800_53: ["AC-2", "IA-2"], pci_dss: ["2.2.2", "8.2.2"], hipaa: ["164.312(a)(1)", "164.312(a)(2)(i)"], iso_27001: ["A.5.15", "A.5.16", "A.8.2"] }

S0014:
  title: "Audit: Shut down system immediately if unable to log security audits: Disabled"
  description: "When enabled, Windows halts if it cannot write security audit events, for example when the Security log is full."
  rationale: "Leaving it disabled avoids an easy denial of service where filling the log takes the system down."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Audit: Shut down system immediately if unable to log security audits = Disabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\CrashOnAuditFail (REG_DWORD) = 0."
  compliance: { nist_800_53: ["AU-2", "AU-3", "AU-12"], pci_dss: ["10.2.1", "10.2.2"], hipaa: ["164.312(b)", "164.308(a)(1)(ii)(D)"], iso_27001: ["A.8.15", "A.8.16"] }

S0015:
  title: "Devices: Prevent users from installing printer drivers: Enabled"
  description: "When enabled, only administrators can install a printer driver while adding a network printer."
  rationale: "Printer drivers run with high privilege, so letting ordinary users install them opens a path to system-level code."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Devices: Prevent users from installing printer drivers = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Print\\Providers\\LanMan Print Services\\Servers\\AddPrinterDrivers (REG_DWORD) = 1."
  compliance: { nist_800_53: ["CM-7", "AC-6", "SC-8"], pci_dss: ["2.2.4", "2.2.6"], hipaa: ["164.308(a)(1)(ii)(B)"], iso_27001: ["A.8.9", "A.8.20"] }

S0016:
  title: "Domain member: Digitally encrypt or sign secure channel data (always): Enabled"
  description: "Requires that all secure channel traffic between the domain member and a domain controller is signed or encrypted."
  rationale: "Unprotected secure channel traffic can be read or altered by an attacker on the network."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Domain member: Digitally encrypt or sign secure channel data (always) = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\Netlogon\\Parameters\\RequireSignOrSeal (REG_DWORD) = 1."
  compliance: { nist_800_53: ["SC-8", "SC-8(1)", "SC-23"], pci_dss: ["2.2.6", "4.2.1"], hipaa: ["164.312(c)(1)", "164.312(e)(2)(i)"], iso_27001: ["A.8.20", "A.8.24"] }

S0017:
  title: "Domain member: Digitally encrypt secure channel data (when possible): Enabled"
  description: "The domain member asks to encrypt all secure channel traffic with the domain controller whenever both sides support it."
  rationale: "Encryption keeps credentials and other secure channel data confidential on the wire."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Domain member: Digitally encrypt secure channel data (when possible) = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\Netlogon\\Parameters\\SealSecureChannel (REG_DWORD) = 1."
  compliance: { nist_800_53: ["SC-8", "SC-8(1)", "SC-23"], pci_dss: ["2.2.6", "4.2.1"], hipaa: ["164.312(c)(1)", "164.312(e)(2)(i)"], iso_27001: ["A.8.20", "A.8.24"] }

S0018:
  title: "Domain member: Digitally sign secure channel data (when possible): Enabled"
  description: "The domain member asks to sign all secure channel traffic with the domain controller whenever both sides support it."
  rationale: "Signing detects tampering with secure channel traffic in transit."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Domain member: Digitally sign secure channel data (when possible) = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\Netlogon\\Parameters\\SignSecureChannel (REG_DWORD) = 1."
  compliance: { nist_800_53: ["SC-8", "SC-8(1)", "SC-23"], pci_dss: ["2.2.6", "4.2.1"], hipaa: ["164.312(c)(1)", "164.312(e)(2)(i)"], iso_27001: ["A.8.20", "A.8.24"] }

S0019:
  title: "Domain member: Disable machine account password changes: Disabled"
  description: "Controls whether the computer periodically changes its own domain machine account password."
  rationale: "Regular automatic changes limit the value of a captured machine account password."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Domain member: Disable machine account password changes = Disabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\Netlogon\\Parameters\\DisablePasswordChange (REG_DWORD) = 0."
  compliance: { nist_800_53: ["IA-5", "IA-5(1)"], pci_dss: ["8.3.6", "8.3.9"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: ["A.5.17"] }

S0020:
  title: "Domain member: Maximum machine account password age: 1 to 30 days"
  description: "Sets how often the computer changes its domain machine account password. A value of 0 means it never changes."
  rationale: "Frequent machine password changes shorten the window in which a stolen machine secret can be used."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Domain member: Maximum machine account password age = a value from 1 to 30 days. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\Netlogon\\Parameters\\MaximumPasswordAge (REG_DWORD) = 1-30."
  compliance: { nist_800_53: ["IA-5", "IA-5(1)"], pci_dss: ["8.3.6", "8.3.9"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: ["A.5.17"] }

S0021:
  title: "Domain member: Require strong (Windows 2000 or later) session key: Enabled"
  description: "Requires 128-bit session keys for the secure channel with domain controllers."
  rationale: "Strong session keys make it much harder to break secure channel encryption."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Domain member: Require strong (Windows 2000 or later) session key = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\Netlogon\\Parameters\\RequireStrongKey (REG_DWORD) = 1."
  compliance: { nist_800_53: ["IA-2", "IA-5", "SC-8", "SC-13"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(d)", "164.312(e)(1)"], iso_27001: ["A.8.5", "A.8.24"] }

S0022:
  title: "Interactive logon: Do not require CTRL+ALT+DEL: Disabled"
  description: "When this setting is disabled, users must press CTRL+ALT+DEL before signing in."
  rationale: "The key combination is handled only by Windows, so the user knows the sign-in prompt is genuine and not a password-stealing program."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Interactive logon: Do not require CTRL+ALT+DEL = Disabled. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\DisableCAD (REG_DWORD) = 0."
  compliance: { nist_800_53: ["AC-2", "IA-2"], pci_dss: ["2.2.2", "8.2.2"], hipaa: ["164.312(a)(1)", "164.312(a)(2)(i)"], iso_27001: ["A.5.15", "A.5.16", "A.8.2"] }

S0023:
  title: "Interactive logon: Don't display last signed-in: Enabled"
  description: "When enabled, the sign-in screen does not show the name of the last user who signed in."
  rationale: "Hiding account names means an attacker at the console must guess both the user name and the password."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Interactive logon: Don't display last signed-in = Enabled. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\DontDisplayLastUserName (REG_DWORD) = 1."
  compliance: { nist_800_53: ["AC-2", "IA-2"], pci_dss: ["2.2.2", "8.2.2"], hipaa: ["164.312(a)(1)", "164.312(a)(2)(i)"], iso_27001: ["A.5.15", "A.5.16", "A.8.2"] }

S0024:
  title: "Interactive logon: Machine account lockout threshold: 1 to 30 invalid attempts"
  description: "Sets how many failed sign-in attempts cause a BitLocker-protected computer to restart into recovery mode. A value of 0 turns this off."
  rationale: "A threshold limits brute-force guessing of passwords at the console of a stolen or unattended device."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Interactive logon: Machine account lockout threshold = a value from 1 to 30. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\MaxDevicePasswordFailedAttempts (REG_DWORD) = 1-30."
  compliance: { nist_800_53: ["AC-7"], pci_dss: ["8.3.4"], hipaa: ["164.308(a)(5)(ii)(C)"], iso_27001: ["A.5.17", "A.8.5"] }

S0025:
  title: "Interactive logon: Machine inactivity limit: 1 to 900 seconds"
  description: "Sets how many seconds of inactivity lock the session. A value of 0 means the session never locks for inactivity."
  rationale: "Locking an idle session stops someone else from using an unattended, signed-in computer."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Interactive logon: Machine inactivity limit = a value from 1 to 900 seconds. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\InactivityTimeoutSecs (REG_DWORD) = 1-900."
  compliance: { nist_800_53: ["AC-11", "AC-12"], pci_dss: ["8.2.8"], hipaa: ["164.312(a)(2)(iii)"], iso_27001: ["A.8.5"] }

S0026:
  title: "Interactive logon: Message text for users attempting to log on: not empty"
  description: "Sets the text of the notice shown before sign-in. The check fails when the value is present but empty."
  rationale: "A sign-in notice informs users of acceptable use and monitoring, which supports legal action after misuse."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Interactive logon: Message text for users attempting to log on = your organization's notice. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\LegalNoticeText (REG_SZ) = the notice text."
  compliance: { nist_800_53: ["AC-8"], pci_dss: ["12.2.1"], hipaa: ["164.308(a)(5)(i)"], iso_27001: ["A.5.10"] }

S0027:
  title: "Interactive logon: Message title for users attempting to log on: not empty"
  description: "Sets the title of the notice shown before sign-in. The check fails when the value is present but empty."
  rationale: "A titled notice makes the acceptable-use warning clear to every user before they sign in."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Interactive logon: Message title for users attempting to log on = your notice title. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\LegalNoticeCaption (REG_SZ) = the notice title."
  compliance: { nist_800_53: ["AC-8"], pci_dss: ["12.2.1"], hipaa: ["164.308(a)(5)(i)"], iso_27001: ["A.5.10"] }

S0028:
  title: "Interactive logon: Number of previous logons to cache: 4 or fewer"
  description: "Sets how many domain sign-ins are cached locally so users can sign in when no domain controller is reachable."
  rationale: "Cached credentials can be extracted and cracked offline, so fewer cached entries means less exposure."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Interactive logon: Number of previous logons to cache (in case domain controller is not available) = 4 or fewer. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\CachedLogonsCount (REG_SZ) = 0-4."
  compliance: { nist_800_53: ["IA-5", "SC-28", "AC-3"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(a)(2)(iv)", "164.312(d)"], iso_27001: ["A.5.17", "A.8.5"] }

S0029:
  title: "Interactive logon: Prompt user to change password before expiration: 5 to 14 days"
  description: "Sets how many days before a password expires users start seeing a warning."
  rationale: "Early warning lets users change passwords in time instead of being locked out or choosing a weak password in a hurry."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Interactive logon: Prompt user to change password before expiration = a value from 5 to 14 days. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\PasswordExpiryWarning (REG_DWORD) = 5-14."
  compliance: { nist_800_53: ["IA-5", "IA-5(1)"], pci_dss: ["8.3.6", "8.3.9"], hipaa: ["164.308(a)(5)(ii)(D)"], iso_27001: ["A.5.17"] }

S0030:
  title: "Interactive logon: Smart card removal behavior: Lock Workstation, Force Logoff or Disconnect"
  description: "Sets what Windows does when the smart card used to sign in is removed from the reader."
  rationale: "Taking action on card removal ensures a session is not left open after the user walks away with the card."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Interactive logon: Smart card removal behavior = Lock Workstation (or Force Logoff / Disconnect if a Remote Desktop Services session). Registry: HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\ScRemoveOption (REG_SZ) = 1, 2 or 3."
  compliance: { nist_800_53: ["AC-11", "AC-12"], pci_dss: ["8.2.8"], hipaa: ["164.312(a)(2)(iii)"], iso_27001: ["A.8.5"] }

S0031:
  title: "Microsoft network client: Digitally sign communications (always): Enabled"
  description: "Requires the SMB client to sign all SMB packets; it will not talk to servers that do not sign."
  rationale: "SMB signing blocks tampering and relay attacks against file sharing traffic."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Microsoft network client: Digitally sign communications (always) = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanWorkstation\\Parameters\\RequireSecuritySignature (REG_DWORD) = 1."
  compliance: { nist_800_53: ["SC-8", "SC-8(1)", "SC-23"], pci_dss: ["2.2.6", "4.2.1"], hipaa: ["164.312(c)(1)", "164.312(e)(2)(i)"], iso_27001: ["A.8.20", "A.8.24"] }

S0032:
  title: "Microsoft network client: Digitally sign communications (if server agrees): Enabled"
  description: "The SMB client signs packets whenever the server supports signing."
  rationale: "Negotiated signing protects SMB sessions with any server that can sign."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Microsoft network client: Digitally sign communications (if server agrees) = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanWorkstation\\Parameters\\EnableSecuritySignature (REG_DWORD) = 1."
  compliance: { nist_800_53: ["SC-8", "SC-8(1)", "SC-23"], pci_dss: ["2.2.6", "4.2.1"], hipaa: ["164.312(c)(1)", "164.312(e)(2)(i)"], iso_27001: ["A.8.20", "A.8.24"] }

S0033:
  title: "Microsoft network client: Send unencrypted password to third-party SMB servers: Disabled"
  description: "Controls whether the SMB client may send a clear-text password to servers that do not support password encryption."
  rationale: "Clear-text passwords on the network can be captured by anyone who can see the traffic."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Microsoft network client: Send unencrypted password to third-party SMB servers = Disabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanWorkstation\\Parameters\\EnablePlainTextPassword (REG_DWORD) = 0."
  compliance: { nist_800_53: ["IA-2", "IA-5", "SC-8", "SC-13"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(d)", "164.312(e)(1)"], iso_27001: ["A.8.5", "A.8.24"] }

S0034:
  title: "Microsoft network server: Amount of idle time required before suspending session: 15 or fewer minutes"
  description: "Sets how many minutes an SMB session may stay idle before the server suspends it."
  rationale: "Closing idle sessions frees server resources and reduces the number of open sessions that could be abused."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Microsoft network server: Amount of idle time required before suspending session = 15 or fewer minutes. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanServer\\Parameters\\AutoDisconnect (REG_DWORD) = 0-15."
  compliance: { nist_800_53: ["AC-11", "AC-12"], pci_dss: ["8.2.8"], hipaa: ["164.312(a)(2)(iii)"], iso_27001: ["A.8.5"] }

S0035:
  title: "Microsoft network server: Digitally sign communications (always): Enabled"
  description: "Requires the SMB server to sign all SMB packets; clients that cannot sign are refused."
  rationale: "SMB signing blocks tampering and relay attacks against shares on this computer."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Microsoft network server: Digitally sign communications (always) = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanServer\\Parameters\\RequireSecuritySignature (REG_DWORD) = 1."
  compliance: { nist_800_53: ["SC-8", "SC-8(1)", "SC-23"], pci_dss: ["2.2.6", "4.2.1"], hipaa: ["164.312(c)(1)", "164.312(e)(2)(i)"], iso_27001: ["A.8.20", "A.8.24"] }

S0036:
  title: "Microsoft network server: Digitally sign communications (if client agrees): Enabled"
  description: "The SMB server signs packets whenever the client supports signing."
  rationale: "Negotiated signing protects SMB sessions with every client that can sign."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Microsoft network server: Digitally sign communications (if client agrees) = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanServer\\Parameters\\EnableSecuritySignature (REG_DWORD) = 1."
  compliance: { nist_800_53: ["SC-8", "SC-8(1)", "SC-23"], pci_dss: ["2.2.6", "4.2.1"], hipaa: ["164.312(c)(1)", "164.312(e)(2)(i)"], iso_27001: ["A.8.20", "A.8.24"] }

S0037:
  title: "Microsoft network server: Disconnect clients when logon hours expire: Enabled"
  description: "When enabled, the SMB server ends sessions of users whose allowed logon hours have ended."
  rationale: "Enforcing logon hours on open sessions stops access outside the times the account is allowed to work."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Microsoft network server: Disconnect clients when logon hours expire = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanServer\\Parameters\\EnableForcedLogOff (REG_DWORD) = 1."
  compliance: { nist_800_53: ["AC-11", "AC-12"], pci_dss: ["8.2.8"], hipaa: ["164.312(a)(2)(iii)"], iso_27001: ["A.8.5"] }

S0038:
  title: "Microsoft network server: Server SPN target name validation level: Accept if provided by client, or higher"
  description: "Sets how strictly the SMB server checks the service principal name (SPN) the client presents."
  rationale: "Checking the target name helps stop SMB relay attacks that forward a client's authentication to another server."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Microsoft network server: Server SPN target name validation level = Accept if provided by client (or Required from client). Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanServer\\Parameters\\SMBServerNameHardeningLevel (REG_DWORD) = 1 or 2."
  compliance: { nist_800_53: ["IA-2", "IA-5", "SC-8", "SC-13"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(d)", "164.312(e)(1)"], iso_27001: ["A.8.5", "A.8.24"] }

S0039:
  title: "Network access: Do not allow anonymous enumeration of SAM accounts: Enabled"
  description: "When enabled, anonymous users cannot list the local user accounts."
  rationale: "A list of account names is the first step of a password-guessing attack."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Do not allow anonymous enumeration of SAM accounts = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\RestrictAnonymousSAM (REG_DWORD) = 1."
  compliance: { nist_800_53: ["AC-3", "AC-14", "CM-7"], pci_dss: ["7.2.1", "2.2.6"], hipaa: ["164.312(a)(1)"], iso_27001: ["A.5.15", "A.8.3"] }

S0040:
  title: "Network access: Do not allow anonymous enumeration of SAM accounts and shares: Enabled"
  description: "When enabled, anonymous users cannot list local accounts or the names of shared folders."
  rationale: "Hiding accounts and shares from anonymous users removes useful reconnaissance information."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Do not allow anonymous enumeration of SAM accounts and shares = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\RestrictAnonymous (REG_DWORD) = 1."
  compliance: { nist_800_53: ["AC-3", "AC-14", "CM-7"], pci_dss: ["7.2.1", "2.2.6"], hipaa: ["164.312(a)(1)"], iso_27001: ["A.5.15", "A.8.3"] }

S0041:
  title: "Network access: Do not allow storage of passwords and credentials for network authentication: Enabled"
  description: "When enabled, Credential Manager does not keep passwords or credentials for later network authentication."
  rationale: "Stored credentials can be stolen from a compromised session and reused against other systems."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Do not allow storage of passwords and credentials for network authentication = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\DisableDomainCreds (REG_DWORD) = 1."
  compliance: { nist_800_53: ["IA-5", "SC-28", "AC-3"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(a)(2)(iv)", "164.312(d)"], iso_27001: ["A.5.17", "A.8.5"] }

S0042:
  title: "Network access: Let Everyone permissions apply to anonymous users: Disabled"
  description: "Controls whether anonymous connections receive the permissions granted to the Everyone group."
  rationale: "Keeping anonymous users out of Everyone stops them from reaching resources shared with all users."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Let Everyone permissions apply to anonymous users = Disabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\EveryoneIncludesAnonymous (REG_DWORD) = 0."
  compliance: { nist_800_53: ["AC-3", "AC-14", "CM-7"], pci_dss: ["7.2.1", "2.2.6"], hipaa: ["164.312(a)(1)"], iso_27001: ["A.5.15", "A.8.3"] }

S0043:
  title: "Network access: Named Pipes that can be accessed anonymously: None"
  description: "Lists the named pipes that anonymous users may open. The check passes when the list is empty or absent."
  rationale: "Every anonymously reachable pipe is an unauthenticated entry point into a service."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Named Pipes that can be accessed anonymously = (blank). Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanServer\\Parameters\\NullSessionPipes (REG_MULTI_SZ) = (empty)."
  compliance: { nist_800_53: ["AC-3", "AC-14", "CM-7"], pci_dss: ["7.2.1", "2.2.6"], hipaa: ["164.312(a)(1)"], iso_27001: ["A.5.15", "A.8.3"] }

S0044:
  title: "Network access: Remotely accessible registry paths: only the standard three paths"
  description: "Lists the registry paths reachable over the network by remote registry clients. The check passes when the value is absent or holds exactly the three default paths for product options, server applications and the Windows NT version key."
  rationale: "Limiting remote registry paths keeps network users from reading or changing other registry data."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Remotely accessible registry paths = System\\CurrentControlSet\\Control\\ProductOptions, System\\CurrentControlSet\\Control\\Server Applications, Software\\Microsoft\\Windows NT\\CurrentVersion. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\SecurePipeServers\\Winreg\\AllowedExactPaths\\Machine (REG_MULTI_SZ)."
  compliance: { nist_800_53: ["AC-3", "AC-14", "CM-7"], pci_dss: ["7.2.1", "2.2.6"], hipaa: ["164.312(a)(1)"], iso_27001: ["A.5.15", "A.8.3"] }

S0045:
  title: "Network access: Remotely accessible registry paths and sub-paths: the standard list"
  description: "Lists the registry paths and their sub-keys reachable over the network. The check expects the standard set: printers, event log, OLAP server, print, windows, content index, Terminal Server (and its UserConfig and DefaultUserConfiguration keys), Perflib and SysmonLog."
  rationale: "Keeping this list to the standard entries stops remote users from reaching other parts of the registry."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Remotely accessible registry paths and subpaths = the standard Windows list described above. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\SecurePipeServers\\Winreg\\AllowedPaths\\Machine (REG_MULTI_SZ)."
  compliance: { nist_800_53: ["AC-3", "AC-14", "CM-7"], pci_dss: ["7.2.1", "2.2.6"], hipaa: ["164.312(a)(1)"], iso_27001: ["A.5.15", "A.8.3"] }

S0046:
  title: "Network access: Restrict anonymous access to Named Pipes and Shares: Enabled"
  description: "When enabled, anonymous users can reach only the pipes and shares listed in the related policies."
  rationale: "This closes null-session access to every other pipe and share."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Restrict anonymous access to Named Pipes and Shares = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanServer\\Parameters\\RestrictNullSessAccess (REG_DWORD) = 1."
  compliance: { nist_800_53: ["AC-3", "AC-14", "CM-7"], pci_dss: ["7.2.1", "2.2.6"], hipaa: ["164.312(a)(1)"], iso_27001: ["A.5.15", "A.8.3"] }

S0047:
  title: "Network access: Restrict clients allowed to make remote calls to SAM: Administrators only"
  description: "Sets which users may query the local account database (SAM) over remote calls. The expected descriptor O:BAG:BAD:(A;;RC;;;BA) allows only the local Administrators group."
  rationale: "Restricting remote SAM queries stops ordinary domain users from listing local accounts and groups for attack planning."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Restrict clients allowed to make remote calls to SAM = Administrators: Remote Access: Allow. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\RestrictRemoteSAM (REG_SZ) = O:BAG:BAD:(A;;RC;;;BA)."
  compliance: { nist_800_53: ["AC-3", "AC-14", "CM-7"], pci_dss: ["7.2.1", "2.2.6"], hipaa: ["164.312(a)(1)"], iso_27001: ["A.5.15", "A.8.3"] }

S0048:
  title: "Network access: Shares that can be accessed anonymously: None"
  description: "Lists the shared folders that anonymous users may open. The expected state is an empty or absent list."
  rationale: "Any anonymously reachable share exposes its files to unauthenticated users."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Shares that can be accessed anonymously = (blank). Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanServer\\Parameters\\NullSessionShares (REG_MULTI_SZ) = (empty)."
  compliance: { nist_800_53: ["AC-3", "AC-14", "CM-7"], pci_dss: ["7.2.1", "2.2.6"], hipaa: ["164.312(a)(1)"], iso_27001: ["A.5.15", "A.8.3"] }

S0049:
  title: "Network access: Sharing and security model for local accounts: Classic"
  description: "Classic means network sign-ins with local accounts authenticate as themselves; Guest only maps them all to the Guest account."
  rationale: "The classic model keeps per-account permissions effective for network access."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Sharing and security model for local accounts = Classic - local users authenticate as themselves. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\ForceGuest (REG_DWORD) = 0."
  compliance: { nist_800_53: ["AC-3", "AC-14", "CM-7"], pci_dss: ["7.2.1", "2.2.6"], hipaa: ["164.312(a)(1)"], iso_27001: ["A.5.15", "A.8.3"] }

S0050:
  title: "Network security: Allow Local System to use computer identity for NTLM: Enabled"
  description: "When enabled, services running as Local System use the computer's identity for NTLM instead of an anonymous session."
  rationale: "Using the computer identity avoids anonymous (null session) authentication from system services."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network security: Allow Local System to use computer identity for NTLM = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\UseMachineId (REG_DWORD) = 1."
  compliance: { nist_800_53: ["IA-2", "IA-5", "SC-8", "SC-13"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(d)", "164.312(e)(1)"], iso_27001: ["A.8.5", "A.8.24"] }

S0051:
  title: "Network security: Allow LocalSystem NULL session fallback: Disabled"
  description: "Controls whether NTLM may fall back to a NULL session when used by Local System."
  rationale: "A NULL session gives no real protection to the traffic, so fallback should not be allowed."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network security: Allow LocalSystem NULL session fallback = Disabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\MSV1_0\\AllowNullSessionFallback (REG_DWORD) = 0."
  compliance: { nist_800_53: ["IA-2", "IA-5", "SC-8", "SC-13"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(d)", "164.312(e)(1)"], iso_27001: ["A.8.5", "A.8.24"] }

S0052:
  title: "Network security: Allow PKU2U authentication requests to this computer to use online identities: Disabled"
  description: "Controls whether peer-to-peer authentication (PKU2U) may use online identities to sign in to this computer."
  rationale: "In a managed environment, authentication should go through domain accounts, not online identities."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network security: Allow PKU2U authentication requests to this computer to use online identities = Disabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\pku2u\\AllowOnlineID (REG_DWORD) = 0."
  compliance: { nist_800_53: ["IA-2", "IA-5", "SC-8", "SC-13"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(d)", "164.312(e)(1)"], iso_27001: ["A.8.5", "A.8.24"] }

S0053:
  title: "Network security: Do not store LAN Manager hash value on next password change: Enabled"
  description: "When enabled, Windows does not keep the weak LAN Manager (LM) hash of a new password."
  rationale: "LM hashes are very easy to crack, so storing them exposes the password."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network security: Do not store LAN Manager hash value on next password change = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\NoLMHash (REG_DWORD) = 1."
  compliance: { nist_800_53: ["IA-5", "SC-28", "AC-3"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(a)(2)(iv)", "164.312(d)"], iso_27001: ["A.5.17", "A.8.5"] }

S0054:
  title: "Network security: Force logoff when logon hours expire: Enabled"
  description: "When enabled, network sessions of users are ended when their allowed logon hours run out. This check reads the SMB server value EnableForcedLogOff."
  rationale: "Ending sessions outside allowed hours enforces the time restrictions placed on accounts."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network security: Force logoff when logon hours expire = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanServer\\Parameters\\EnableForcedLogOff (REG_DWORD) = 1."
  compliance: { nist_800_53: ["AC-11", "AC-12"], pci_dss: ["8.2.8"], hipaa: ["164.312(a)(2)(iii)"], iso_27001: ["A.8.5"] }

S0055:
  title: "Network security: LAN Manager authentication level: Send NTLMv2 response only. Refuse LM & NTLM"
  description: "Sets which challenge/response protocols are used for network sign-in. The expected level allows only NTLMv2 and refuses LM and NTLMv1."
  rationale: "LM and NTLMv1 responses can be cracked or relayed easily; NTLMv2 is much stronger."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network security: LAN Manager authentication level = Send NTLMv2 response only. Refuse LM & NTLM. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\LmCompatibilityLevel (REG_DWORD) = 5."
  compliance: { nist_800_53: ["IA-2", "IA-5", "SC-8", "SC-13"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(d)", "164.312(e)(1)"], iso_27001: ["A.8.5", "A.8.24"] }

S0056:
  title: "Network security: LDAP client signing requirements: Negotiate signing or higher"
  description: "Sets whether the LDAP client asks for or requires signing of LDAP traffic."
  rationale: "Signed LDAP traffic cannot be silently altered or relayed by an attacker in the middle."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network security: LDAP client signing requirements = Negotiate signing (or Require signing). Registry: HKLM\\SYSTEM\\CurrentControlSet\\Services\\LDAP\\LDAPClientIntegrity (REG_DWORD) = 1 or 2."
  compliance: { nist_800_53: ["SC-8", "SC-8(1)", "SC-23"], pci_dss: ["2.2.6", "4.2.1"], hipaa: ["164.312(c)(1)", "164.312(e)(2)(i)"], iso_27001: ["A.8.20", "A.8.24"] }

S0057:
  title: "Network security: Restrict NTLM: Audit Incoming NTLM Traffic: Enable auditing for all accounts"
  description: "Records an event for every incoming NTLM authentication request."
  rationale: "Auditing NTLM use shows where legacy authentication remains so it can be reduced safely."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network security: Restrict NTLM: Audit Incoming NTLM Traffic = Enable auditing for all accounts. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\MSV1_0\\AuditReceivingNTLMTraffic (REG_DWORD) = 2."
  compliance: { nist_800_53: ["AU-2", "AU-3", "AU-12"], pci_dss: ["10.2.1", "10.2.2"], hipaa: ["164.312(b)", "164.308(a)(1)(ii)(D)"], iso_27001: ["A.8.15", "A.8.16"] }

S0058:
  title: "Network security: Restrict NTLM: Outgoing NTLM traffic to remote servers: Deny all"
  description: "Controls whether this computer may send NTLM authentication to remote servers. Value 2 blocks all outgoing NTLM."
  rationale: "Blocking outgoing NTLM stops credentials from being relayed or cracked through NTLM."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network security: Restrict NTLM: Outgoing NTLM traffic to remote servers = Deny all. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\MSV1_0\\RestrictSendingNTLMTraffic (REG_DWORD) = 2."
  compliance: { nist_800_53: ["IA-2", "IA-5", "SC-8", "SC-13"], pci_dss: ["8.3.2", "2.2.6"], hipaa: ["164.312(d)", "164.312(e)(1)"], iso_27001: ["A.8.5", "A.8.24"] }

S0059:
  title: "System objects: Require case insensitivity for non-Windows subsystems: Enabled"
  description: "When enabled, object names are treated as case-insensitive for all subsystems."
  rationale: "Case-sensitive names could let two objects look alike and confuse Windows programs."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\System objects: Require case insensitivity for non-Windows subsystems = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Kernel\\ObCaseInsensitive (REG_DWORD) = 1."
  compliance: { nist_800_53: ["SI-16", "SI-7", "SC-39"], pci_dss: ["2.2.6", "5.2.1"], hipaa: ["164.308(a)(5)(ii)(B)"], iso_27001: ["A.8.7", "A.8.9"] }

S0060:
  title: "System objects: Strengthen default permissions of internal system objects: Enabled"
  description: "When enabled, non-administrators can read but not change shared system objects such as symbolic links."
  rationale: "Stronger default permissions stop ordinary users from tampering with objects that other processes rely on."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\System objects: Strengthen default permissions of internal system objects (e.g. Symbolic Links) = Enabled. Registry: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\ProtectionMode (REG_DWORD) = 1."
  compliance: { nist_800_53: ["AC-6", "AC-6(2)", "AC-6(10)"], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.308(a)(4)(ii)(B)", "164.312(a)(1)"], iso_27001: ["A.8.2", "A.8.18"] }

S0061:
  title: "User Account Control: Admin Approval Mode for the Built-in Administrator account: Enabled"
  description: "When enabled, the built-in Administrator account also runs with a filtered token and must approve elevation."
  rationale: "Without it the built-in Administrator runs everything with full rights, including malware it happens to launch."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\User Account Control: Admin Approval Mode for the Built-in Administrator account = Enabled. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\FilterAdministratorToken (REG_DWORD) = 1."
  compliance: { nist_800_53: ["AC-6", "AC-6(2)", "AC-6(10)"], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.308(a)(4)(ii)(B)", "164.312(a)(1)"], iso_27001: ["A.8.2", "A.8.18"] }

S0062:
  title: "User Account Control: Behavior of the elevation prompt for standard users: Automatically deny elevation requests"
  description: "Sets what happens when a standard user starts something that needs administrator rights."
  rationale: "Denying requests stops standard users from being tricked into typing administrator credentials into an elevation prompt."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\User Account Control: Behavior of the elevation prompt for standard users = Automatically deny elevation requests. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\ConsentPromptBehaviorUser (REG_DWORD) = 0."
  compliance: { nist_800_53: ["AC-6", "AC-6(2)", "AC-6(10)"], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.308(a)(4)(ii)(B)", "164.312(a)(1)"], iso_27001: ["A.8.2", "A.8.18"] }

S0063:
  title: "User Account Control: Detect application installations and prompt for elevation: Enabled"
  description: "When enabled, Windows detects installers and asks for elevation before running them."
  rationale: "Installers change the system, so they should only run after an explicit administrator decision."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\User Account Control: Detect application installations and prompt for elevation = Enabled. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\EnableInstallerDetection (REG_DWORD) = 1."
  compliance: { nist_800_53: ["AC-6", "AC-6(2)", "AC-6(10)"], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.308(a)(4)(ii)(B)", "164.312(a)(1)"], iso_27001: ["A.8.2", "A.8.18"] }

S0064:
  title: "User Account Control: Only elevate UIAccess applications that are installed in secure locations: Enabled"
  description: "When enabled, accessibility (UIAccess) programs get elevated UI access only if they are installed in protected folders such as Program Files."
  rationale: "This stops a program in a user-writable folder from driving the elevated desktop."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\User Account Control: Only elevate UIAccess applications that are installed in secure locations = Enabled. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\EnableSecureUIAPaths (REG_DWORD) = 1."
  compliance: { nist_800_53: ["AC-6", "AC-6(2)", "AC-6(10)"], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.308(a)(4)(ii)(B)", "164.312(a)(1)"], iso_27001: ["A.8.2", "A.8.18"] }

S0065:
  title: "User Account Control: Run all administrators in Admin Approval Mode: Enabled"
  description: "Turns User Account Control on, so administrators work with a standard token and approve elevation."
  rationale: "Turning this off disables UAC entirely and lets every program run with full administrator rights."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\User Account Control: Run all administrators in Admin Approval Mode = Enabled. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\EnableLUA (REG_DWORD) = 1."
  compliance: { nist_800_53: ["AC-6", "AC-6(2)", "AC-6(10)"], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.308(a)(4)(ii)(B)", "164.312(a)(1)"], iso_27001: ["A.8.2", "A.8.18"] }

S0066:
  title: "User Account Control: Switch to the secure desktop when prompting for elevation: Enabled"
  description: "When enabled, elevation prompts appear on the secure desktop where other programs cannot interact with them."
  rationale: "The secure desktop stops malware from clicking or faking the elevation prompt."
  remediation: "Group Policy: Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\User Account Control: Switch to the secure desktop when prompting for elevation = Enabled. Registry: HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\PromptOnSecureDesktop (REG_DWORD) = 1."
  compliance: { nist_800_53: ["AC-6", "AC-6(2)", "AC-6(10)"], pci_dss: ["7.2.1", "7.2.2"], hipaa: ["164.308(a)(4)(ii)(B)", "164.312(a)(1)"], iso_27001: ["A.8.2", "A.8.18"] }

S0067:
  title: "User Account Control: Virtualize file and registry write failures to per-user locations: Enabled"
