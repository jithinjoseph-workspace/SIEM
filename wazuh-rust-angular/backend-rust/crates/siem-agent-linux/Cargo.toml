[package]
name = "siem-agent-linux"
version = "0.1.0"
edition = "2021"
description = "Dedicated Wazuh Next-Gen Linux Endpoint Agent in Rust mirroring Wazuh core architecture"

[dependencies]
siem-core = { path = "../siem-core" }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
hex = "0.4"

[package.metadata.deb]
name = "wazuh-agent"
maintainer = "Wazuh Rust Team <info@wazuh.com>"
copyright = "2026 Wazuh Inc."
license-file = ["../../LICENSE", "4"]
depends = "libc6 (>= 2.17), systemd, procps, iptables | ufw"
section = "admin"
priority = "optional"
assets = [
    ["target/release/siem-agent-linux", "var/ossec/bin/siem-agent-linux", "750"],
    ["init/wazuh-rust-agent.service", "lib/systemd/system/wazuh-rust-agent.service", "644"],
]
maintainer-scripts = "packages/debs"

[package.metadata.generate-rpm]
name = "wazuh-agent"
version = "4.14.7"
release = "1"
summary = "Wazuh Next-Gen Endpoint Telemetry & Security Agent in Rust"
license = "GPL-2.0"
vendor = "Wazuh, Inc."
url = "https://wazuh.com"
requires = ["systemd", "procps-ng", "iptables"]
assets = [
    { source = "target/release/siem-agent-linux", dest = "/var/ossec/bin/siem-agent-linux", mode = "750" },
    { source = "init/wazuh-rust-agent.service", dest = "/usr/lib/systemd/system/wazuh-rust-agent.service", mode = "644" }
]
pre_install_script = "packages/rpms/pre.sh"
post_install_script = "packages/rpms/post.sh"
pre_uninstall_script = "packages/rpms/preun.sh"
post_uninstall_script = "packages/rpms/postun.sh"

