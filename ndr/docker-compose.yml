services:

  # ── Kafka 3-broker KRaft cluster ─────────────────────────────────────────
  # Cluster ID generated once: docker run --rm apache/kafka:4.2.0
  #   /opt/kafka/bin/kafka-storage.sh random-uuid
  # Must be identical across all 3 brokers.

  kafka1:
    image: apache/kafka:4.2.0
    container_name: kafka1
    mem_limit: 1g
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka1:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "2RGQj2hlSfOoltzP3aUfng"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_LOG_RETENTION_MS: "3600000"
      KAFKA_LOG_RETENTION_BYTES: "536870912"
      KAFKA_LOG_SEGMENT_BYTES: "536870912"
    volumes:
      - kafka1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  kafka2:
    image: apache/kafka:4.2.0
    container_name: kafka2
    mem_limit: 1g
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka2:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "2RGQj2hlSfOoltzP3aUfng"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_LOG_RETENTION_MS: "3600000"
      KAFKA_LOG_RETENTION_BYTES: "536870912"
      KAFKA_LOG_SEGMENT_BYTES: "536870912"
    volumes:
      - kafka2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  kafka3:
    image: apache/kafka:4.2.0
    container_name: kafka3
    mem_limit: 1g
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka3:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "2RGQj2hlSfOoltzP3aUfng"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_LOG_RETENTION_MS: "3600000"
      KAFKA_LOG_RETENTION_BYTES: "536870912"
      KAFKA_LOG_SEGMENT_BYTES: "536870912"
    volumes:
      - kafka3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ── One-shot Kafka topic initialiser — creates all topics before engines start ──
  kafka-init:
    image: apache/kafka:4.2.0
    container_name: kafka-init
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    entrypoint: ["bash", "-c",
      "KAFKA=kafka1:9092,kafka2:9092,kafka3:9092 \
      && /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$KAFKA --create --if-not-exists --topic ndr-events        --partitions 9 --replication-factor 3 \
      && /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$KAFKA --create --if-not-exists --topic siem-logs         --partitions 9 --replication-factor 3 \
      && /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$KAFKA --create --if-not-exists --topic siem-correlations --partitions 3 --replication-factor 3 \
      && /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$KAFKA --create --if-not-exists --topic siem-compliance   --partitions 3 --replication-factor 3 \
      && /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$KAFKA --create --if-not-exists --topic siem-parse-errors --partitions 3 --replication-factor 3 \
      && echo '[NDR] All Kafka topics ready'"]
    restart: "no"

  vector:
    image: timberio/vector:0.32.1-alpine
    container_name: ndr-vector
    profiles: ["onpremise"]
    environment:
      - LOCAL_SENSOR_ID=${LOCAL_SENSOR_ID:-local-central}
      - TENANT_ID=${TENANT_ID:-default}
    volumes:
      - ${HOME_DIR}/.vector/vector.toml:/etc/vector/vector.toml:ro
      - ${HOME_DIR}/.vector/data:/etc/vector/data
      - ${HOME_DIR}/logs:/logs
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped


  # ── Auth service — identity microservice (login, JWT, MFA, refresh, logout) ─
  provigil-auth:
    build:
      context: ./rust
      dockerfile: auth-service/Dockerfile
    container_name: provigil-auth
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - ndr-internal
      - default
    volumes:
      # create_tenant() (rust/auth-service/src/db.rs) reads this to build each
      # new tenant's dedicated ndr_<tenant_id> database schema. The Dockerfile
      # only ships the compiled binary and init.sql lives outside the build
      # context (repo root, not ./rust), so it has to come in as a runtime
      # mount, same as clickhouse-init below does for the global schema.
      - ${INSTALL_DIR}/config/clickhouse/init.sql:/app/config/clickhouse/init.sql:ro
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - CLICKHOUSE_URL=http://clickhouse1:8123
      - CLICKHOUSE_USER=ndr
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=ndr
      - VALKEY_URL=redis://ndr-valkey:6379
      - REDIS_URL=redis://ndr-valkey:6379
      - TOKEN_TTL_SECS=3600
      - REFRESH_TTL_SECS=604800
      - LISTEN_ADDR=0.0.0.0:3001
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_TOKEN=${LICENSE_TOKEN}
    depends_on:
      clickhouse1:
        condition: service_healthy
      ndr-valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/auth/check-username?username=ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── SIEM engine — optional, only for NDR+SIEM customers ─────────────────
  siem-engine-1:
    build:
      context: ./rust
      dockerfile: siem-engine/Dockerfile
    container_name: siem-engine-1
    profiles: ["siem"]
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "3002:3002"     # HTTP API — direct access (bypasses nginx, useful for siem-only deploy)
      - "601:601"       # Syslog TCP (RFC 6587) — NXLog / Winlogbeat
      - "6514:6514"     # Syslog TCP TLS
      - "514:514/udp"   # Syslog UDP (legacy devices)
    networks:
      - default
      - ndr-internal
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - CLICKHOUSE_URL=http://clickhouse1:8123
      - CLICKHOUSE_DB=ndr
      - CLICKHOUSE_USER=ndr
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=ndr
      - VALKEY_URL=redis://ndr-valkey:6379
      - REDIS_URL=redis://ndr-valkey:6379
      - KAFKA_BROKERS=kafka1:9092,kafka2:9092,kafka3:9092
      - IP_TOKEN_KEY=${IP_TOKEN_KEY}
      - LISTEN_ADDR=0.0.0.0:3002
      - RUST_LOG=siem_engine=info
    depends_on:
      clickhouse1:
        condition: service_healthy
      ndr-valkey:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  ndr-engine-1:
    build: ./rust
    container_name: ndr-engine-1
    hostname: ndr-engine-1
    restart: unless-stopped
    mem_limit: 1536m
    env_file:
      - .env
    stop_grace_period: 5s
    networks:
      - default
      - ndr-internal
    environment:
      - KAFKA_BROKERS=kafka1:9092,kafka2:9092,kafka3:9092
      - NDR_AGENT_URL=http://host.docker.internal:3001
      - NDR_AGENT_SECRET=${NDR_AGENT_SECRET}
      - CLICKHOUSE_URL=http://clickhouse1:8123
      - CLICKHOUSE_USER=ndr
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - INSTANCE_ID=1
      - ENGINE_NAME=ndr-engine-1
      - VALKEY_URL=redis://ndr-valkey:6379
      - REDIS_URL=redis://ndr-valkey:6379
      - INSTALL_DIR=${INSTALL_DIR}
      - RULES_DIR=/app/ndr-engine/rules
      - HOST_INSTALL_DIR=${INSTALL_DIR}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - ARKIME_URL=${ARKIME_URL}
      - ARKIME_PASS=${ARKIME_PASS}
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - HOST_IP=${HOST_IP}
      - SENSOR_MODE=${SENSOR_MODE:-agent}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_TOKEN=${LICENSE_TOKEN}
      - TENANT_ADMIN_USER=${TENANT_ADMIN_USER}
      - TENANT_ADMIN_PASS=${TENANT_ADMIN_PASS}
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ${INSTALL_DIR}/scripts:/scripts
      - ${HOME_DIR}/logs:/logs
      - ${HOME_DIR}/ndr-config:/config
      - ${INSTALL_DIR}/rust/ndr-engine/rules:/app/ndr-engine/rules
      - ${INSTALL_DIR}/rust/ndr-engine/data:/app/ndr-engine/data
      - ${INSTALL_DIR}/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/ndr/pcap:/opt/ndr/pcap
      - /opt/ndr/evidence:/opt/ndr/evidence
      - /opt/arkime/raw:/opt/arkime/raw:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      ndr-valkey:
        condition: service_healthy
      clickhouse1:
        condition: service_healthy
      clickhouse2:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully

  ndr-engine-2:
    build: ./rust
    container_name: ndr-engine-2
    hostname: ndr-engine-2
    restart: unless-stopped
    mem_limit: 1536m
    env_file:
      - .env
    stop_grace_period: 5s
    networks:
      - default
      - ndr-internal
    environment:
      - KAFKA_BROKERS=kafka1:9092,kafka2:9092,kafka3:9092
      - NDR_AGENT_URL=http://host.docker.internal:3001
      - NDR_AGENT_SECRET=${NDR_AGENT_SECRET}
      - CLICKHOUSE_URL=http://clickhouse1:8123
      - CLICKHOUSE_USER=ndr
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - INSTANCE_ID=2
      - ENGINE_NAME=ndr-engine-2
      - VALKEY_URL=redis://ndr-valkey:6379
      - REDIS_URL=redis://ndr-valkey:6379
      - INSTALL_DIR=${INSTALL_DIR}
      - RULES_DIR=/app/ndr-engine/rules
      - HOST_INSTALL_DIR=${INSTALL_DIR}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - ARKIME_URL=${ARKIME_URL}
      - ARKIME_PASS=${ARKIME_PASS}
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - HOST_IP=${HOST_IP}
      - SENSOR_MODE=${SENSOR_MODE:-agent}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_TOKEN=${LICENSE_TOKEN}
      - TENANT_ADMIN_USER=${TENANT_ADMIN_USER}
      - TENANT_ADMIN_PASS=${TENANT_ADMIN_PASS}
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ${INSTALL_DIR}/scripts:/scripts
      - ${HOME_DIR}/logs:/logs
      - ${HOME_DIR}/ndr-config:/config
      - ${INSTALL_DIR}/rust/ndr-engine/rules:/app/ndr-engine/rules
      - ${INSTALL_DIR}/rust/ndr-engine/data:/app/ndr-engine/data
      - ${INSTALL_DIR}/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/ndr/pcap:/opt/ndr/pcap
      - /opt/ndr/evidence:/opt/ndr/evidence
      - /opt/arkime/raw:/opt/arkime/raw:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      ndr-valkey:
        condition: service_healthy
      clickhouse1:
        condition: service_healthy
      clickhouse2:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully

  ndr-engine-3:
    build: ./rust
    container_name: ndr-engine-3
    hostname: ndr-engine-3
    restart: unless-stopped
    mem_limit: 1536m
    env_file:
      - .env
    stop_grace_period: 5s
    networks:
      - default
      - ndr-internal
    environment:
      - KAFKA_BROKERS=kafka1:9092,kafka2:9092,kafka3:9092
      - NDR_AGENT_URL=http://host.docker.internal:3001
      - NDR_AGENT_SECRET=${NDR_AGENT_SECRET}
      - CLICKHOUSE_URL=http://clickhouse1:8123
      - CLICKHOUSE_USER=ndr
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - INSTANCE_ID=3
      - ENGINE_NAME=ndr-engine-3
      - VALKEY_URL=redis://ndr-valkey:6379
      - REDIS_URL=redis://ndr-valkey:6379
      - INSTALL_DIR=${INSTALL_DIR}
      - RULES_DIR=/app/ndr-engine/rules
      - HOST_INSTALL_DIR=${INSTALL_DIR}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - ARKIME_URL=${ARKIME_URL}
      - ARKIME_PASS=${ARKIME_PASS}
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - HOST_IP=${HOST_IP}
      - SENSOR_MODE=${SENSOR_MODE:-agent}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_TOKEN=${LICENSE_TOKEN}
      - TENANT_ADMIN_USER=${TENANT_ADMIN_USER}
      - TENANT_ADMIN_PASS=${TENANT_ADMIN_PASS}
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ${INSTALL_DIR}/scripts:/scripts
      - ${HOME_DIR}/logs:/logs
      - ${HOME_DIR}/ndr-config:/config
      - ${INSTALL_DIR}/rust/ndr-engine/rules:/app/ndr-engine/rules
      - ${INSTALL_DIR}/rust/ndr-engine/data:/app/ndr-engine/data
      - ${INSTALL_DIR}/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/ndr/pcap:/opt/ndr/pcap
      - /opt/ndr/evidence:/opt/ndr/evidence
      - /opt/arkime/raw:/opt/arkime/raw:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      ndr-valkey:
        condition: service_healthy
      clickhouse1:
        condition: service_healthy
      clickhouse2:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully

  ndr-valkey:
    image: valkey/valkey:7-alpine
    container_name: ndr-valkey
    mem_limit: 300m
    ports:
      - "127.0.0.1:6379:6379"
    command: valkey-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - valkey-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Angular UI — builds the SPA and serves it via nginx on port 80
  ndr-ui:
    build: ./ndr-ui
    container_name: ndr-ui
    networks:
      - ndr-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nginx Load Balancer — HTTPS entry point (port 443/3000) with HTTP→HTTPS redirect
  nginx:
    image: nginx:alpine
    container_name: ndr-nginx
    ports:
      - "443:443"    # HTTPS — standard port
      - "3000:443"   # HTTPS — legacy port (keep for existing bookmarks)
      - "80:80"      # HTTP — issues 301 redirect to https
      - "3080:80"    # HTTP — legacy port
    extra_hosts:
      - "host.docker.internal:host-gateway"  # so /deploy-webhook can reach the host-level webhook listener (scripts/deploy-webhook.py, not a container)
    volumes:
      - ${INSTALL_DIR}/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${INSTALL_DIR}/config/nginx/ssl:/etc/nginx/ssl:ro   # TLS cert & key
    # Periodic reload (every 30s) re-resolves upstream block hostnames so rebuilt
    # engine containers are picked up without a manual `nginx -s reload`.
    # ndr-ui 502s are already fixed by the set $ndr_ui variable in nginx.conf.
    command: >-
      /bin/sh -c "nginx -g 'daemon off;' & NGX=$$!;
      while sleep 30; do kill -0 $$NGX 2>/dev/null || break; nginx -s reload 2>/dev/null; done &
      wait $$NGX"
    depends_on:
      ndr-ui:
        condition: service_healthy
      provigil-auth:
        condition: service_healthy
    networks:
      - ndr-internal
      - default
    restart: unless-stopped

  # ── Qdrant vector DB — RAG embeddings per tenant (SIEM/XDR feature) ─────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ndr-qdrant
    mem_limit: 1g
    profiles: ["siem", "xdr"]
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  opensearch:
    image: opensearchproject/opensearch:2.5.0
    container_name: ndr-opensearch
    mem_limit: 2g
    cpus: "2.0"
    profiles: ["onpremise"]
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "bootstrap.memory_lock=false"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  clickhouse-keeper:
    image: clickhouse/clickhouse-keeper:24.8
    container_name: clickhouse-keeper
    networks:
      - ndr-internal
    volumes:
      - keeper-data:/var/lib/clickhouse
      - keeper-logs:/var/log/clickhouse-keeper
      - ${INSTALL_DIR}/config/clickhouse/cluster/keeper-config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    entrypoint: [""]
    command: ["/bin/sh", "-c", "chown -R 0:0 /var/lib/clickhouse /var/log/clickhouse-keeper && exec clickhouse-keeper --config-file=/etc/clickhouse-keeper/keeper_config.xml"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2181 && echo ruok >&3 && timeout 2 cat <&3 | grep -q imok' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  clickhouse1:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse1
    networks:
      - ndr-internal
    ports:
      - "127.0.0.1:8123:8123"   # localhost-only — host agent (ndr-agent.py) access
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
