  title: 'Domain controller: Allow server operators to schedule tasks: Disabled'
  description: Controls whether members of Server Operators may create scheduled tasks on a domain controller. The check passes when the value is absent or 0.
  rationale: Scheduled tasks often run as SYSTEM, so this right could let Server Operators gain full control.
  remediation: 'Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Domain controller: Allow server operators to schedule tasks = Disabled. Registry: HKLM\SYSTEM\CurrentControlSet\Control\Lsa\SubmitControl (REG_DWORD) = 0.'
