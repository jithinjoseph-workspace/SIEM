services:
  # ClickHouse High-Performance Columnar SIEM Database
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: wazuh-siem-clickhouse
    restart: always
    environment:
      CLICKHOUSE_DB: ndr
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123" # HTTP API port
      - "9000:9000" # Native TCP client port
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Production NGINX Load Balancer & WebSocket Reverse Proxy
  load-balancer:
    image: nginx:alpine
    container_name: wazuh-siem-loadbalancer
    restart: always
    ports:
      - "80:80"   # HTTP and WebSocket port
      - "443:443" # HTTPS SSL port
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist/frontend-angular:/usr/share/nginx/html:ro
    depends_on:
      - clickhouse

volumes:
  clickhouse_data:
    driver: local
