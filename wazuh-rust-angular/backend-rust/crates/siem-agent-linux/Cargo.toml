[package]
name = "siem-agent-linux"
version = "1.0.0"
edition = "2021"
description = "ProVigil Linux Endpoint Telemetry and Defense Agent"

[dependencies]
quick-xml = { version = "0.36", features = ["serialize"] }
siem-core = { path = "../siem-core" }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"

[package.metadata.deb]
name = "provigil-agent"
maintainer = "ProVigil Security <support@provigil.io>"
copyright = "2026 ProVigil Security"
depends = "libc6 (>= 2.17), systemd, procps, iptables | ufw"
section = "admin"
priority = "optional"
assets = [
    ["target/release/siem-agent-linux", "opt/provigil-agent/bin/siem-agent-linux", "750"],
    ["init/provigil-agent.service", "lib/systemd/system/provigil-agent.service", "644"],
]
maintainer-scripts = "packages/debs"

[package.metadata.generate-rpm]
name = "provigil-agent"
version = "1.0.0"
release = "1"
summary = "ProVigil Endpoint Telemetry and Security Agent"
license = "Proprietary"
vendor = "ProVigil Security"
requires = ["systemd", "procps-ng", "iptables"]
assets = [
    { source = "target/release/siem-agent-linux", dest = "/opt/provigil-agent/bin/siem-agent-linux", mode = "750" },
    { source = "init/provigil-agent.service", dest = "/usr/lib/systemd/system/provigil-agent.service", mode = "644" }
]
pre_install_script = "packages/rpms/pre.sh"
post_install_script = "packages/rpms/post.sh"
pre_uninstall_script = "packages/rpms/preun.sh"
post_uninstall_script = "packages/rpms/postun.sh"
