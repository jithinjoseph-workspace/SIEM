[package]
name = "siem-deception"
version = "0.1.0"
edition = "2021"
description = "Deception-as-Code & Adaptive Honeynet: declarative decoy assets, honeytokens, canary tripwires, and live zero-FP telemetry capture"

[dependencies]
siem-core = { path = "../siem-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.40", features = ["full"] }
