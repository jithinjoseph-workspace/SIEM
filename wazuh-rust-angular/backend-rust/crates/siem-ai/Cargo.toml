[package]
name = "siem-ai"
version = "0.1.0"
edition = "2021"
description = "AI provider calls for the SIEM analyst features (the providers configured in Settings > AI), with a call budget and untrusted-data quoting"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }
