[package]
name = "siem-engine"
version = "0.1.0"
edition = "2021"
description = "ProVigil in-process detection: decoders, built-in detections, XML-format rules, correlation and logtest"

[dependencies]
siem-core = { path = "../siem-core" }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
quick-xml = { version = "0.36", features = ["serialize"] }
